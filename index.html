<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Uitgavenoverzicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12151b;
    --panel: #1b2029;
    --rule: #2e3541;
    --paper: #edeae2;
    --paper-dim: #a8adaf;
    --muted: #8b93a3;
    --brass: #c9a66b;
    --brass-dim: #a8875e;
    --teal: #6fac9e;
    --rose: #ba7a90;
    --ingcc: #868ebd;
    --dot-ok: #5cb37e;
    --dot-over: #cf7089;
    --dot-afwijking: #d9985a;

    --c-abonnementen: #6fac9e;
    --c-reizen: #c99a5c;
    --c-vervoer: #7a94c0;
    --c-shopping: #c48a70;
    --c-kleding: #9b81b0;
    --c-wonen: #74a684;
    --c-entertainment: #c3ab6e;
    --c-bankkosten: #8b93a3;
    --c-persoonlijk: #ba7a90;
    --c-zakelijk: #7188b5;
    --c-eten: #c19d61;
    --c-goededoelen: #6bab97;
    --c-overig: #93897f;
    --c-hypotheek: #b68a5f;
    --c-verzekeringen: #7599c0;
    --c-nuts: #6bab8a;
    --c-telecom: #a689bd;
    --c-auto: #c08f60;
    --c-italie: #bd7f70;
    --c-vakbond: #93aa6e;
    --c-educatie: #bf9ab0;
    --c-verzorging: #c1a86e;
    --c-kids: #74a3bd;
    --c-boodschappen: #9bb072;
    --c-familie: #b98cae;
    --c-cadeaus: #c3a35f;
    --c-sparen: #6ea6b6;
    --c-onbekend: #bd7a63;
  }

  *{ box-sizing: border-box; }
  html,body{ overflow-x: clip; max-width: 100vw; }
  html,body{ margin:0; padding:0; background: var(--ink); }
  body{
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  .app{ max-width: 1000px; margin: 0 auto; min-width: 0; overflow-x: clip; }

  header{
    display:flex; align-items:flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 20px;
    margin-bottom: 20px;
    padding-bottom: 20px;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 8px;
  }
  .brand-eyebrow.brand-eyebrow--home{
    font-family:'Space Grotesk', sans-serif;
    font-size: 40px; letter-spacing: -0.01em; text-transform: none;
    font-weight: 600;
    color: var(--brass);
    margin-bottom: 0;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 40px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .view-toggle{ display:flex; gap:4px; margin-bottom: 28px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .view-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 15px;
    background: transparent; border: none;
    color: var(--muted);
    padding: 12px 6px; margin-right: 26px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transform: translateY(1px);
  }
  .view-btn.active{ color: var(--paper); border-bottom-color: var(--brass); }

  .tile-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .tile-grid--home{ margin-top: 28px; }
  .c3s-select{
    -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23ffffff' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center; background-size: 10px 7px;
    padding: 6px 24px 6px 10px !important;
    font-size: 13px !important;
    min-height: 30px;
    border-radius: 6px;
  }
  .c3s-select--muted{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23c9c2b3' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  }
  .app-tile{
    background: var(--panel); border: 1px solid var(--rule); border-radius: 16px;
    padding: 20px 18px; display:flex; flex-direction:column; align-items:flex-start; gap: 16px;
    cursor:pointer; text-align:left; font: inherit; color:inherit;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
    min-height: 106px;
  }
  .app-tile:active{ transform: scale(0.95); border-color: var(--brass-dim); background: #202632; }
  .app-tile.empty{ border-style: dashed; opacity: 0.35; cursor: default; }
  .app-tile-icon{
    width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.05); flex-shrink:0;
  }
  .app-tile-icon svg{ width:22px; height:22px; }
  .app-tile-icon.txt{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; }
  .app-tile-label{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; line-height:1.25; }

  .detail-header{ display:flex; align-items:center; gap:10px; margin-bottom:22px; position:sticky; top:0; z-index:25; background: var(--ink); padding: 14px 0 12px; }
  .vermogen-opties-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; position:sticky; top:66px; z-index:24; background:var(--ink); padding:10px 0; margin-bottom:2px; }
  .vermogen-optie-tegel{ background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:14px 10px; min-height:60px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:center; cursor:pointer; transition:border-color .15s,color .15s; }
  .vermogen-optie-tegel.active{ border-color:var(--brass); color:var(--paper); font-weight:600; }
  .c3s-sectie-tegel{ display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; margin-top:8px; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:14px; cursor:pointer; }
  .c3s-sectie-tegel.active{ border-color:var(--brass); color:var(--paper); font-weight:600; }
  .back-btn{ background:none;border:1px solid var(--rule); color:var(--paper); border-radius:9px; width:40px;height:40px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; }
  .back-btn:active{ background: rgba(255,255,255,0.07); }
  .back-btn svg{ width:20px; height:20px; }
  .detail-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:21px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .switch-btn{ background:none;border:1px solid var(--rule); color:var(--muted); border-radius:9px; width:40px;height:40px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; }
  .switch-btn:active{ background: rgba(255,255,255,0.07); }
  .switch-btn svg{ width:18px; height:18px; }
  .switch-menu{ position:absolute; top:48px; right:0; background:var(--panel); border:1px solid var(--rule); border-radius:12px; overflow:hidden; z-index:30; min-width:210px; box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
  .switch-menu button{ display:block; width:100%; text-align:left; background:none;border:none; color:var(--paper); padding:13px 16px; font-family:'IBM Plex Mono',monospace; font-size:13px; cursor:pointer; border-bottom:1px solid var(--rule); }
  .switch-menu button:last-child{ border-bottom:none; }
  .switch-menu button:active{ background: rgba(255,255,255,0.07); }
  .switch-menu button.active{ color: var(--brass); }
  [data-filter-cat]:active, [data-filter-src]:active, [data-filter-reis]:active{ background: rgba(201,162,39,0.15) !important; transform: scale(0.98); }
  .card[data-filter-cat], .card[data-filter-src], .card[data-filter-reis]{ transition: background .1s ease, transform .1s ease; }
  li[data-filter-cat], li[data-filter-src]{ transition: background .1s ease; border-radius: 4px; padding-left: 4px; margin-left: -4px; }
  .reis-plan-row[data-filter-reis]{ transition: background .1s ease, transform .1s ease; border-radius: 4px; padding-left: 4px; margin-left: -4px; }

  .month-tabs{ display:flex; gap: 4px; flex-wrap: wrap; }
  .month-tab{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    padding: 8px 13px;
    border-radius: 3px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .month-tab:hover{ border-color: var(--brass-dim); color: var(--paper); }
  .month-tab.active{ background: var(--brass); border-color: var(--brass); color: #1a1608; font-weight: 500; }

  .hero{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; min-width: 0; }
  .hero4{ display:grid; grid-template-columns: repeat(5,1fr); gap: 14px; margin-bottom: 20px; min-width: 0; }
  @media (max-width: 900px){ .hero4{ grid-template-columns: 1fr 1fr 1fr; } }
  @media (max-width: 720px){ .hero{ grid-template-columns: 1fr; } .hero4{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px){
    body{ padding: 16px 10px 50px; }
    h1{ font-size: 24px; }
    .brand-eyebrow{ font-size: 9px; }
    .brand-eyebrow.brand-eyebrow--home{ font-size: 24px; }
    .hero4{ grid-template-columns: 1fr; gap: 8px; }
    .card{ padding: 14px; }
    .card-label{ font-size: 10px; letter-spacing: 0.08em; }
    .total-figure{ font-size: 28px; }
    .stat-figure{ font-size: 24px; white-space: normal; }
    .stat-sub{ font-size: 10px; }
    .view-toggle{ overflow-x: auto; white-space: nowrap; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; margin-bottom: 20px; }
    .view-btn{ margin-right: 16px; font-size: 13.5px; padding: 10px 3px; }
    .month-tabs{ overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .donut-wrap{ flex-direction: column; align-items: flex-start; gap: 14px; }
    .donut{ width: 100px; height: 100px; }
    .legend .name{ font-size: 12px; }
    .legend .amt{ font-size: 11px; }
    .ledger-row{ flex-wrap: wrap; row-gap: 4px; font-size: 12.5px; align-items: baseline; }
    .lr-date{ flex: 0 0 auto; order: 1; font-size: 10px; margin-right: 6px; }
    .lr-tag{ order: 2; font-size: 9px; padding: 2px 5px; }
    .lr-tag-select{ order: 2; font-size: 9px; padding: 2px 16px 2px 6px; max-width: 150px; flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lr-amt{ order: 3; margin-left: auto; min-width: auto; font-size: 13px; font-weight: 600; }
    .lr-vendor{ flex: 1 1 100%; order: 4; white-space: normal; font-size: 12.5px; margin-top: 2px; }
    .lr-leader{ display: none; }
    .lr-src{ order: 5; font-size: 8.5px; margin-top: 2px; }
    .lr-btw{ order: 6; font-size: 8px; margin-top: 2px; }
    .card-label{ flex-wrap: wrap; gap: 4px; }
    .note-card{ font-size: 11.5px; }
    footer{ font-size: 11px; }
  }

  .card{ background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 24px; min-width: 0; overflow-x: hidden; }
  .card-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px;
  }
  .stat-figure{ font-family:'Space Grotesk', sans-serif; font-weight: 500; font-size: 30px; line-height:1; }
  .stat-figure.pos{ color: var(--teal); }
  .stat-figure.neg{ color: var(--rose); }
  .stat-sub{ margin-top:8px; font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); }

  .total-card{ display:flex; flex-direction:column; justify-content: space-between; }
  .total-figure{ font-family:'Space Grotesk', sans-serif; font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: -0.01em; }
  .total-delta{ margin-top: 10px; font-family:'IBM Plex Mono', monospace; font-size: 13px; }
  .total-delta.up{ color: var(--rose); }
  .total-delta.down{ color: var(--teal); }
  .total-sub{
    margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--rule);
    display:flex; justify-content: space-between;
    font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted);
  }
  .total-sub b{ color: var(--paper); font-weight: 500; }

  .donut-wrap{ display:flex; align-items:center; gap: 22px; }
  .donut{ position: relative; width: 132px; height: 132px; flex: 0 0 auto; border-radius: 50%; }
  .donut-hole{ position:absolute; inset: 20px; background: var(--panel); border-radius: 50%; display:flex; align-items:center; justify-content:center; flex-direction: column; }
  .donut-hole span{ font-family:'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--muted); text-transform:uppercase; letter-spacing: .08em;}
  .donut-hole b{ font-family:'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; margin-top:2px; }

  .bar-total{ display:flex; justify-content:space-between; align-items:baseline; font-family:'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }
  .bar-total b{ font-family:'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; color: var(--paper); text-transform: none; letter-spacing: 0; }
  .bar-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap: 11px; }
  .bar-row{ display:flex; flex-direction:column; gap: 4px; }
  .bar-row-top{ display:flex; justify-content:space-between; align-items:baseline; gap: 10px; font-size: 13px; }
  .bar-name{ color: var(--paper); min-width: 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-amt{ font-family:'IBM Plex Mono', monospace; font-size: 13px; color: var(--paper); white-space:nowrap; flex: 0 0 auto; }
  .bar-track{ height: 7px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow:visible; position:relative; }
  .bar-fill{ height: 100%; border-radius: 4px; min-width: 2px; transition: width .2s ease; }
  .bar-marker{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--paper-dim); opacity:0.55; border-radius:1px; }
  .bar-row[data-cat-toggle], .bar-row[data-filter-cat]{ transition: background .1s ease, transform .1s ease; border-radius: 4px; padding: 3px 4px; margin: -3px -4px; }
  .bar-row[data-cat-toggle]:active, .bar-row[data-filter-cat]:active{ background: rgba(201,162,39,0.15); transform: scale(0.98); }
  .cat-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:8px; flex:0 0 auto; }
  .cat-detail-tile{ margin: 10px 0 2px; padding: 12px 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; max-width: 100%; overflow: hidden; }
  .cdt-total{ font-family:'Space Grotesk', sans-serif; font-size: 19px; font-weight: 500; color: var(--paper); }
  .cdt-budget{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cdt-divider{ height:1px; background: var(--rule); margin: 12px 0; border-top: 1px dashed var(--rule); background: none; }
  .cdt-sum{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); text-align: right; }
  .tx-row2{ padding: 8px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
  .tx-row2:last-child{ border-bottom: none; }
  .tx-row2-meta{ display:flex; align-items:center; gap:8px; font-size:10.5px; color: var(--muted); font-family:'IBM Plex Mono', monospace; margin-bottom: 4px; min-width: 0; }
  .tx-row2-meta select{
    appearance:none; -webkit-appearance:none; border: none; color: var(--ink); font-weight: 600;
    border-radius: 4px; padding: 1px 16px 1px 6px; font-size: 10.5px; font-family:'IBM Plex Mono', monospace; max-width: 110px; min-width: 0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8'><path d='M1 2 L4 6 L7 2' stroke='%2312151b' stroke-width='1.4' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 5px center;
  }
  .tx-row2-content{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12.5px; min-width: 0; }
  .tx-row2-vendor{ flex: 1 1 auto; min-width: 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color: var(--paper-dim); }
  .tx-row2-amt{ flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-weight:600; font-size: 13px; }

  .legend{ list-style:none; margin:0; padding:0; flex:1; min-width:0; }
  .legend li{ display:flex; align-items:center; gap: 9px; font-size: 12.5px; padding: 4px 0; }
  .legend .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .legend .name{ color: var(--paper); flex: 1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend .amt{ font-family:'IBM Plex Mono', monospace; color: var(--muted); font-size: 11.5px;}

  .trend-card{ margin-bottom: 20px; }
  .trend-card svg{ display:block; width:100%; height:auto; overflow: visible; }
  .vermogen-trend-sticky{ position:sticky; top:214px; z-index:23; background:var(--ink); padding-top:10px; margin-bottom:0; }
  .trend-labels{ display:flex; justify-content: space-between; font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 6px; padding: 0 4px; }

  .ledger-card .card-label{ display:flex; justify-content: space-between; align-items: baseline;}
  .ledger-count{ color: var(--paper-dim); }
  .ledger-list{ list-style:none; margin:0; padding:0; }
  .ledger-row{ display:flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .ledger-row:last-child{ border-bottom: none; }
  .lr-date{ font-family:'IBM Plex Mono', monospace; color: var(--muted); font-size: 11.5px; flex: 0 0 56px; }
  .lr-src{
    flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 9px; letter-spacing:.05em;
    padding: 2px 5px; border-radius: 2px; border:1px solid var(--rule); color: var(--muted);
  }
  .lr-vendor{ flex: 0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lr-tag{
    flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 10px; letter-spacing:.04em;
    padding: 2px 6px; border-radius: 2px; color: var(--ink); font-weight: 600; white-space: nowrap;
  }
  .lr-tag-select{
    flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 10px; letter-spacing:.04em;
    padding: 2px 18px 2px 6px; border-radius: 2px; color: var(--ink); font-weight: 600; white-space: nowrap;
    border: none; appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8'><path d='M1 2 L4 6 L7 2' stroke='%2312151b' stroke-width='1.4' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 5px center;
  }
  .lr-tag-select:focus{ outline: 2px solid var(--brass); outline-offset: 1px; }
  .lr-leader{ flex: 1 1 auto; border-bottom: 1px dotted var(--rule); margin: 0 6px; min-width: 16px; transform: translateY(-4px);}
  .lr-btw{ flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 9px; border: 1px solid var(--brass-dim); color: var(--brass); border-radius: 20px; padding: 2px 7px; letter-spacing: .03em; }
  .lr-amt{ flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 13.5px; min-width: 76px; text-align:right; }
  .lr-amt.neg{ color: var(--teal); }
  .lr-amt.pos-income{ color: var(--teal); }

  .note-card{ font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  .note-card b{ color: var(--paper-dim); }

  .reis-jaar-header{
    font-family:'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--brass); margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .reis-jaar-header:first-child{ margin-top: 0; padding-top: 0; border-top: none; }
  .reis-plan-row{
    padding: 10px 0; border-bottom: 1px solid var(--rule);
  }
  .reis-plan-row:last-child{ border-bottom: none; }
  .rp-bestemming{
    font-family:'Inter',sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 6px;
  }
  .rp-bestemming small{ display:block; color: var(--muted); font-size: 11.5px; font-weight: 400; margin-top: 1px; }
  .rp-pills{ display:flex; gap:6px; flex-wrap:nowrap; margin-bottom: 6px; }
  .rp-pill-select{

function fmt(n){
  const neg = n < 0;
  const abs = Math.abs(n).toLocaleString('nl-NL', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg? '−€' : '€') + abs;
}
function monthOf(d){ return d.slice(0,7); }
function isUSVendor(v){ return US_VENDORS.some(k => v.toUpperCase().includes(k)); }


let selectedMonth = MONTHS[MONTHS.length-1];

function txForMonth(m){ return AMEX_ALL.filter(r => monthOf(r.date)===m && r.category!=='__PAYMENT__'); }
function totalForMonth(m){ return txForMonth(m).reduce((s,r)=>s+r.amount,0); }
function categoryTotals(m){
  const map={}; txForMonth(m).forEach(r=>{ map[r.category]=(map[r.category]||0)+r.amount; });
  return Object.entries(map).filter(([,v])=>v>0.001).sort((a,b)=>b[1]-a[1]);
}
/* ---------- Bar-list: gerangschikte lijst met proportionele balkjes (in plaats van een donutgrafiek) ---------- */
function renderBarList(sorted, total, opts={}){
  const formatAmt = opts.formatAmt || ((v)=>fmt(v));
  const rowAttrs = opts.rowAttrs || (()=>'');
  const indicator = opts.indicator || (()=>'');
  const budgetFor = opts.budgetFor || (()=>null); // (name) => begroot bedrag, of null als er geen budget is
  const showDot = opts.showDot || false; // toon een grijs/groen/rood bolletje vóór de naam
  const detailFor = opts.detailFor || (()=>''); // (name) => HTML, direct onder deze rij getoond (bv. uitgeklapte details)
  const limit = opts.limit || sorted.length;
  const rows = sorted.slice(0, limit).map(([name,val],i)=>{
    let dot = '';
    if(showDot){
      const budget = budgetFor(name);
      const magnitude = Math.abs(val);
      const dotColor = budget!=null && budget>0 ? (magnitude>budget?"var(--dot-over)":"var(--dot-ok)") : 'var(--rule)';
      dot = `<span class="cat-dot" style="background:${dotColor};"></span>`;
    }
    return `<li class="bar-row"${rowAttrs(name,i)}>
      <div class="bar-row-top"><span class="bar-name">${dot}${name}${indicator(name)}</span><span class="bar-amt">${formatAmt(val,name)}</span></div>
      ${detailFor(name)}
    </li>`;
  }).join('');
  return `<ul class="bar-list">${rows}</ul>`;
}
function renderTrendSVG(){
  const w=900,h=170,pad=10;
  const totals = MONTHS.map(totalForMonth);
  const max = Math.max(...totals)*1.15;
  const stepX=(w-pad*2)/(MONTHS.length-1);
  const pts = totals.map((t,i)=>{ const x=pad+i*stepX; const y=h-pad-(t/max)*(h-pad*2); return [x,y]; });
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const circles = pts.map((p,i)=>{
    const active = MONTHS[i]===selectedMonth;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${active?5:3}" fill="${active?'#c9a227':'#4fa89b'}" stroke="var(--panel)" stroke-width="2"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa89b" stop-opacity="0.35"/><stop offset="100%" stop-color="#4fa89b" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#areaGrad)"/>
    <path d="${linePath}" fill="none" stroke="#4fa89b" stroke-width="2"/>${circles}</svg>`;
}

function txKey(t){ return t.date+'|'+t.vendor+'|'+t.amount; }
/* Normaliseert een leveranciersnaam tot een stabiele sleutel, zodat "ALBERT HEIJN 1860 RHOON NLD" en
   "ALBERT HEIJN 1345 BARENDRECHT" allebei op "albert heijn" uitkomen — ongeacht filiaal/stad/land/store-nummer. */
function vendorKey(vendor){
  let v = vendor.toLowerCase();
  v = v.replace(/\d+/g, ' ');
  v = v.replace(/\b(nld|deu|gbr|usa|hrv|svn|aut|tur|tha|irl|cyp|ita)\b/g, ' ');
  v = v.replace(/\b(b\.?v\.?|n\.?v\.?|via [a-z]+)\b/g, ' ');
  v = v.replace(/[^a-z\s]/g, ' ');
  v = v.replace(/\s+/g, ' ').trim();
  return v.split(' ').filter(Boolean).slice(0, 2).join(' ');
}

function effectiveCategory(t){
  const key = txKey(t);
  if(categoryOverrides[key]) return categoryOverrides[key]; // uitzondering voor deze ene transactie wint altijd
  const vk = vendorOverrides[vendorKey(t.vendor)];
  if(vk) return vk; // geleerde regel voor deze leverancier, geldt voor alle (ook toekomstige) transacties
  return t.category;
}
/* ================= Live voorspelling "Dagelijks" (Volgende maand) =================
   Vervangt de vroegere aanpak (één keer handmatig een gemiddelde uitgerekend en als vaste
   getallen in de code gezet). Dit rekent nu ZELF, bij elke render, een gewogen gemiddelde uit
   over alle afgesloten maanden waarvoor we echte transacties hebben — recentere maanden wegen
   zwaarder mee (gewicht loopt lineair op: oudste maand telt voor 1, nieuwste voor N).
   Groeit vanzelf mee: zodra er straks een RABO_TX_SEP/ING_TX_SEP/etc. bijkomt, wordt die maand
   automatisch meegenomen zonder dat iemand iets hoeft te herrekenen of te hardcoden. */
function isDagelijksCategorie(cat){
  return !!cat && !JUL_VASTE_LASTEN_CATS.includes(cat) && !JUL_INCOME_CATS.includes(cat) && !JUL_INTERN_CATS.includes(cat)
    && cat!=='Sparen' && cat!=='Reizen' && cat!=='Casa 3S (project)' && cat!=='Belastingafrekening';
}
function alleBekendeTransacties(){
  const pools = [RABO_TX, ING_TX, RABO_TX_JUL, ING_TX_JUL, INGCC_TX_JUL, RABO_TX_AUG, ING_TX_AUG];
  const amexNormaal = AMEX_TX_JUL.map(r=>({...r, amount:-r.amount}));
  // RABO_TX/ING_TX (oudere mei/juni-arrays) overlappen qua datum met RABO_TX_JUL/ING_TX_JUL
  // (die beginnen al eind juni) — zonder dedupe tellen diezelfde transacties dubbel mee.
  const gezien = new Set();
  const resultaat = [];
  [...pools.flat(), ...amexNormaal].forEach(r=>{
    const k = txKey(r);
    if(gezien.has(k)) return;
    gezien.add(k);
    resultaat.push({...r, category: effectiveCategory(r)});
  });
  return resultaat;
}
function voorspellingDagelijksPerCategorie(huidigJaar, huidigMaand){
  const perMaand = {}; // "2026-6" -> {categorie: totaal (positief bedrag)}
  alleBekendeTransacties().forEach(r=>{
    if(!isDagelijksCategorie(r.category)) return;
    const [j,m] = r.date.split('-');
    const key = `${j}-${parseInt(m,10)}`;
    perMaand[key] = perMaand[key] || {};
    // Let op: NIET Math.abs() gebruiken — terugbetalingen (positief bedrag) moeten de uitgave verlagen,
    // niet als extra uitgave meetellen. Anders schiet bv. Kleding fors omhoog zodra er een retour tussen zit.
    perMaand[key][r.category] = (perMaand[key][r.category]||0) - r.amount;
  });
  const huidigeKey = `${huidigJaar}-${huidigMaand}`;
  const maanden = Object.keys(perMaand)
    .filter(k=>k!==huidigeKey) // de lopende, nog niet afgesloten maand telt niet mee
    .sort((a,b)=>{
      const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number);
      return (ay*12+am)-(by*12+bm);
    });
  const gewichten = maanden.map((_,i)=>i+1); // oudste=1, nieuwste=N: recentere maanden wegen zwaarder
  const gewichtTotaal = gewichten.reduce((a,b)=>a+b,0) || 1;
  const alleCats = new Set();
  maanden.forEach(mk=>Object.keys(perMaand[mk]).forEach(c=>alleCats.add(c)));
  const result = {};
  alleCats.forEach(cat=>{
    let som = 0;
    maanden.forEach((mk,i)=>{ som += (perMaand[mk][cat]||0) * gewichten[i]; });
    result[cat] = Math.round((som/gewichtTotaal)*100)/100;
  });
  return {perCategorie: result, aantalMaanden: maanden.length, maanden};
}
function lijktBuitenlandseBesteding(t){
  // Simpele, onderhoudsvrije heuristiek: eindigt de omschrijving op een 3-letterige landcode die niet NLD is
  // (zoals ING dat aanlevert: "... ROMA ITA", "... SIENA ITA")? Dan vrijwel zeker een buitenlandse besteding.
  // "NLD" (of geen landcode) = onduidelijk/binnenlands — die NIET automatisch aan een reis koppelen, ook al
  // valt de datum binnen de reisperiode: dat kan namelijk ook gewoon een normale NL-uitgave zijn terwijl je
  // toevallig weg bent (bv. een abonnement dat blijft doorlopen). Zulke gevallen horen thuis in "Verwerken —
  // nog te plaatsen", waar handmatig gekozen wordt: bij de reis, of toch gewoon Dagelijks.
  const m = t.vendor.trim().match(/([A-Z]{3})$/);
  return !!m && m[1]!=='NLD';
}
function autoDetectReis(t){
  if(t.category!=='Reizen' && t.category!=='__SPAREN_NAAR_REIZEN__') return null;
  // 1) Datumbereik + buitenlandse besteding: als de transactiedatum binnen de bevestigde reisperiode van
  //    precies één reis valt ÉN de omschrijving er buitenlands uitziet, is dat de sterkste (en onderhoudsvrije)
  //    aanwijzing — werkt ook voor leveranciers die niet in de keyword-lijst staan. Binnenlandse transacties
  //    tijdens diezelfde periode koppelen we bewust NIET automatisch (zie lijktBuitenlandseBesteding hierboven).
  const datumMatches = REIZEN_PLANNING.filter(p=>p.start && p.eind && t.date>=p.start && t.date<=p.eind);
  if(datumMatches.length===1 && lijktBuitenlandseBesteding(t)) return datumMatches[0].id;
  // 2) Keyword-match als er geen (eenduidig) datumbereik + buitenland-match is
  const v = t.vendor.toLowerCase();
  for(const [id, kws] of Object.entries(REIZEN_KEYWORDS)){
    if(kws.some(k=>{
      const esc = k.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      return new RegExp('(?:^|[^a-z0-9])'+esc+'(?:$|[^a-z0-9])','i').test(v);
    })) return id;
  }
  return null;
}
function effectiveReis(t){
  const key = txKey(t);
  if(key in reisOverrides) return reisOverrides[key] || null; // '' betekent: handmatig losgekoppeld
  return autoDetectReis(t);
}

function isReizenMetBudget(r){
  // true als een Reizen-transactie op een reis staat die ook echt een budget/potje heeft.
  // Reizen zonder budget (of niet-geplaatste transacties) tellen gewoon mee als normale uitgave —
  // dat is de afspraak: alleen weglaten uit de maandcijfers als het via een echt reisbudget loopt.
  if(r.category!=='Reizen') return false;
  const trip = REIZEN_PLANNING.find(p=>p.id===effectiveReis(r));
  return !!(trip && effectiveBudget(trip)!=null);
}
// Reisafwikkeling: zodra een reis (status lopend) voorbij is (einddatum verstreken) en alle uitgaven dus
// binnen zijn, wordt het werkelijke tekort of overschot (budget vs. totaal werkelijk uitgegeven over de hele
// reis) verrekend met Dagelijks van de maand waarin de reis eindigt — want dat bedrag is/wordt daadwerkelijk
// via de courante rekening verrekend, ook al vallen de losse Reizen-transacties zelf buiten de Dagelijks-cijfers
// (zie isReizenMetBudget). Bewust pas bij afloop (niet tussentijds): het budget komt in 2 termijnen op de
// rekening en pas aan het eind is duidelijk of het een tekort of overschot is geworden.
// Reisbudget onderweg: voor een reis die NU loopt (start <= vandaag <= eind) laat dit zien hoeveel van het
// budget dat al vanuit sparen naar de rekening is overgemaakt, nog "vrij" staat — daalt mee met elke
// Reizen-uitgave (zelfde Rest-bedrag als in de Reizen-tab). Amex-uitgaven komen vaak pas de maand erna in

function actieveReisBudgetten(){
  const vandaag = new Date().toISOString().slice(0,10);
  const all = buildCombinedAlles();
  const reizenSpend = all.filter(r=>r.category==='Reizen');
  return REIZEN_PLANNING
    .filter(p=>effectiveStatus(p)==='lopend' && p.start && p.eind && p.start<=vandaag && vandaag<=p.eind)
    .map(p=>{
      const budget = effectiveBudget(p);
      const uitgegeven = reizenSpend.filter(t=>effectiveReis(t)===p.id).reduce((s,t)=>s+t.amount,0);
      const rest = budget!=null ? Math.round((budget+uitgegeven+(p.borg?p.borg.bedrag:0))*100)/100 : null;
      return {trip:p, budget, rest};
    });
}
function reisAfwikkelingVoorMaand(jaar, maand){
  const vandaag = new Date().toISOString().slice(0,10);
  const all = buildCombinedAlles();
  const reizenSpend = all.filter(r=>r.category==='Reizen');
  const resultaat = [];
  REIZEN_PLANNING.forEach(p=>{
    if(effectiveStatus(p)!=='lopend' || !p.eind || p.eind >= vandaag) return;
    const ov = reisPlanOverrides[p.id];
    if(ov && ov.afgewikkeld) return; // al eerder verwerkt (in een vorige maand) — niet nog een keer
    const budget = effectiveBudget(p);
    if(budget==null) return;
    const uitgegeven = reizenSpend.filter(t=>effectiveReis(t)===p.id).reduce((s,t)=>s+t.amount,0);
    const rest = Math.round((budget + uitgegeven + (p.borg ? p.borg.bedrag : 0))*100)/100;
    if(Math.abs(rest) < 0.01) return;
    resultaat.push({trip:p, rest});
  });
  return resultaat;
}
function effectiveBucket(t){
  const key = txKey(t);
  if(bucketOverrides[key]) return bucketOverrides[key];
  const catRule = bucketCategorieOverrides[t.category];
  if(catRule && t.date >= catRule.since) return catRule.bucket; // structureel, maar alleen vanaf de datum dat de regel gezet is
  return JUL_VASTE_LASTEN_CATS.includes(t.category) ? 'vast' : 'dagelijks';
}

function applyOverridesFallback(){
  OVERRIDES_FALLBACK.forEach(r=>{
    if(r.kind==='category') categoryOverrides[r.key] = r.value;
    else if(r.kind==='reis') reisOverrides[r.key] = r.value;
    else if(r.kind==='vendor') vendorOverrides[r.key] = r.value;
    else if(r.kind==='bucket') bucketOverrides[r.key] = r.value;
    else if(r.kind==='bucket_categorie') bucketCategorieOverrides[r.key] = {bucket:r.value, since:r.since||'2026-08-05'};
    else if(r.kind==='reis_budget') reisBudgetOverrides[r.key] = r.value;
    else if(r.kind==='reis_plan') reisPlanOverrides[r.key] = JSON.parse(r.value);
    else if(r.kind==='saldo') saldoCheck[r.key] = JSON.parse(r.value);
    else if(r.kind==='c3s_subcat') c3sSubcatOverrides[r.key] = r.value;
    else if(r.kind==='c3s_voortgang') c3sVoortgangOverrides[r.key] = c3sNormaliseerVoortgang(r.value);
    else if(r.kind==='c3s_notitie') c3sNotitieOverrides[r.key] = r.value;
  });
}
async function loadOverrides(){
  applyOverridesFallback(); // altijd eerst toepassen — werkt dus ook lokaal/offline geopend
  try{
    const res = await fetch(SUPABASE_URL+'/rest/v1/overrides?select=key,kind,value,updated_at', {headers: SUPABASE_HEADERS});
    if(res.ok){
      const rows = await res.json();
      rows.forEach(r=>{
        if(r.kind==='category') categoryOverrides[r.key] = r.value;
        else if(r.kind==='reis') reisOverrides[r.key] = r.value;
        else if(r.kind==='vendor') vendorOverrides[r.key] = r.value;
        else if(r.kind==='bucket') bucketOverrides[r.key] = r.value;
        else if(r.kind==='bucket_categorie') bucketCategorieOverrides[r.key] = {bucket:r.value, since:(r.updated_at||'').slice(0,10) || '2026-08-05'};
        else if(r.kind==='reis_budget') reisBudgetOverrides[r.key] = r.value;
        else if(r.kind==='reis_plan') reisPlanOverrides[r.key] = JSON.parse(r.value);
        else if(r.kind==='saldo') saldoCheck[r.key] = JSON.parse(r.value);
        else if(r.kind==='c3s_subcat') c3sSubcatOverrides[r.key] = r.value;
        else if(r.kind==='c3s_voortgang') c3sVoortgangOverrides[r.key] = c3sNormaliseerVoortgang(r.value);
        else if(r.kind==='c3s_notitie') c3sNotitieOverrides[r.key] = r.value;
      });
      overridesSource = 'live';
    }
  }catch(e){ /* geen verbinding met Supabase — de fallback-snapshot hierboven blijft actief */ }
  overridesLoaded = true;
  render();
}
async function saveOverrideRow(kind, key, value){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/overrides?on_conflict=kind,key', {
      method: 'POST',
      headers: {...SUPABASE_HEADERS, 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify([{key, kind, value}])
    });
  }catch(e){ /* offline: verandering blijft lokaal staan tot volgende succesvolle save */ }
}
async function deleteOverrideRow(kind, key){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/overrides?kind=eq.'+encodeURIComponent(kind)+'&key=eq.'+encodeURIComponent(key), {
      method: 'DELETE', headers: SUPABASE_HEADERS
    });
  }catch(e){}
}
function exportOverrides(){
  const payload = {categorieën: categoryOverrides, reizen: reisOverrides, leveranciers: vendorOverrides, buckets: bucketOverrides};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'aanpassingen.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importOverrides(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const imported = JSON.parse(e.target.result);
      let n = 0;
      let cat = {}, reis = {}, vend = {}, buck = {};
      if(imported.categorieën || imported.reizen || imported.leveranciers || imported.buckets){
        cat = imported.categorieën||{};
        reis = imported.reizen||{};
        vend = imported.leveranciers||{};
        buck = imported.buckets||{};
      } else {
        cat = imported; // oud exportformaat: platte categorie-aanpassingen
      }
      categoryOverrides = {...categoryOverrides, ...cat};
      reisOverrides = {...reisOverrides, ...reis};
      vendorOverrides = {...vendorOverrides, ...vend};
      bucketOverrides = {...bucketOverrides, ...buck};
      n = Object.keys(cat).length + Object.keys(reis).length + Object.keys(vend).length + Object.keys(buck).length;
      Object.entries(cat).forEach(([k,v])=>saveOverrideRow('category', k, v));
      Object.entries(reis).forEach(([k,v])=>saveOverrideRow('reis', k, v));
      Object.entries(vend).forEach(([k,v])=>saveOverrideRow('vendor', k, v));
      Object.entries(buck).forEach(([k,v])=>saveOverrideRow('bucket', k, v));
      render();
      alert('Aanpassingen geïmporteerd en gesynchroniseerd: ' + n + ' regels.');
    }catch(err){
      alert('Kon het bestand niet lezen — is het een geldige export?');
    }
  };
  reader.readAsText(file);
}

async function setOverrideByKey(key, newCat){
  if(newCat && newCat.trim()){
    categoryOverrides[key] = newCat.trim();
    saveOverrideRow('category', key, categoryOverrides[key]);
    // Leer meteen ook de leverancier-regel, zodat toekomstige (en al geladen) transacties van dezelfde leverancier hetzelfde meekrijgen.
    const vendorNaam = key.split('|')[1] || '';
    const vk = vendorKey(vendorNaam);
    if(vk){
      vendorOverrides[vk] = newCat.trim();
      saveOverrideRow('vendor', vk, newCat.trim());
    }
  } else {
    delete categoryOverrides[key];
    deleteOverrideRow('category', key);
  }
  render();
}
async function setReisOverrideByKey(key, newReis){
  if(newReis === '__AUTO__'){
    delete reisOverrides[key]; // terug naar automatische herkenning
    deleteOverrideRow('reis', key);
  } else {
    reisOverrides[key] = newReis; // '' = expliciet "geen reis"
    saveOverrideRow('reis', key, newReis);
  }
  render();
}
async function setBucketOverrideByKey(key, newBucket){
  if(newBucket === '__AUTO__'){
    delete bucketOverrides[key]; // terug naar automatisch (op basis van categorie)
    deleteOverrideRow('bucket', key);
  } else {
    bucketOverrides[key] = newBucket;
    saveOverrideRow('bucket', key, newBucket);
  }
  render();
}
async function setBucketCategorieOverride(categorie, newBucket){
  const vandaag = new Date().toISOString().slice(0,10);
  bucketCategorieOverrides[categorie] = {bucket:newBucket, since:vandaag};
  try{
    await fetch(SUPABASE_URL+'/rest/v1/overrides?on_conflict=kind,key', {
      method: 'POST',
      headers: {...SUPABASE_HEADERS, 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify([{key:categorie, kind:'bucket_categorie', value:newBucket, updated_at: new Date().toISOString()}])
    });
  }catch(e){ /* offline: verandering blijft lokaal staan tot volgende succesvolle save */ }
}
async function setReisBudgetOverride(reisId, newBudget){
  reisBudgetOverrides[reisId] = String(newBudget);
  saveOverrideRow('reis_budget', reisId, String(newBudget));
  reisBudgetEditOpen = null;
  render();
}
function promptEditCategoryByKey(key, huidigeCat){
  const lijst = ALLE_CATEGORIEEN.join(', ');
  const parts = key.split('|');
  const naam = parts[1] || key;
  const nieuw = window.prompt('Categorie voor "' + naam + '"\n\nKies uit: ' + lijst, huidigeCat);
  if(nieuw !== null) setOverrideByKey(key, nieuw);
}


function buildCombinedJul(){
  const rabo = RABO_TX_JUL.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'RABO'}));
  const ing = ING_TX_JUL.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'ING'}));
  const amex = AMEX_TX_JUL.map(r=>{ const neg = {...r, amount:-r.amount}; return {...neg, category: effectiveCategory(neg), _orig: neg, source:'AMEX'}; });
  const ingcc = INGCC_TX_JUL.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'ING CC'}));
  return [...rabo, ...ing, ...amex, ...ingcc];
}
// Cumulatief over ALLE bekende maanden (juli + lopende maand, straks + nieuwe maanden) — voor tabs die niet per
// kalendermaand werken maar het complete plaatje nodig hebben: Reizen (een reis loopt dwars door maandgrenzen
// heen) en Casa 3S (project). buildCombinedJul() zelf blijft bewust juli-only, want die voedt de juli-specifieke
// samenvattingen (berekenVorigeMaandSamenvatting e.d.), die niet met latere maanden vermengd mogen worden.
// Bij een nieuwe lopende maand: voeg de nieuwe RABO_TX_<mnd>/ING_TX_<mnd> ook hieronder toe.
function buildCombinedAlles(){
  const augRabo = RABO_TX_AUG.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'RABO'}));
  const augIng = ING_TX_AUG.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'ING'}));
  const amexHistorisch = AMEX_ALL.filter(r=>r.category!=='__PAYMENT__').map(r=>{ const neg = {...r, amount:-r.amount}; return {...neg, category: effectiveCategory(neg), _orig: neg, source:'AMEX'}; });
  const ingHistorisch = ING_TX_HIST_2026.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'ING'}));
  return [...buildCombinedJul(), ...augRabo, ...augIng, ...amexHistorisch, ...ingHistorisch];
}
// Vorige maand (juli): hoeveel bleef er over (na vast spaardoel, vaste lasten, dagelijks), en is dat bedrag
// daadwerkelijk naar de algemene Oranje Spaarrekening overgemaakt? Automatisch afgeleid uit de echte data —
// geen handmatige vlag nodig. Als het niet gebeurd is, moet dit bedrag meetellen bij de eerstvolgende keer sparen.
function berekenVorigeMaandSamenvatting(){
  const periodeBronnen = [...RABO_TX_JUL, ...ING_TX_JUL, ...AMEX_TX_JUL];
  const periodeStart = periodeBronnen.reduce((min,r)=>r.date<min?r.date:min, periodeBronnen[0].date);
  const all = buildCombinedJul().filter(r=>r.date>=periodeStart);
  const ROB_SPAREN_VAST = 2000.00, LINDY_SPAREN_VAST = 2398.03, DEURWAARDER_SPAREN_VAST = 0;
  const SPAREN_VAST_DOEL = ROB_SPAREN_VAST + LINDY_SPAREN_VAST + DEURWAARDER_SPAREN_VAST;
  const income = all.filter(r=>JUL_INCOME_CATS.includes(r.category));
  const spend = all.filter(r=>!JUL_INCOME_CATS.includes(r.category) && !JUL_INTERN_CATS.includes(r.category) && r.category!=='Sparen' && !isReizenMetBudget(r) && r.category!=='Casa 3S (project)' && r.category!=='Belastingafrekening');
  const incomeTotal = income.reduce((s,r)=>s+r.amount,0);
  const vast = spend.filter(r=>effectiveBucket(r)==='vast');
  const dagelijks = spend.filter(r=>effectiveBucket(r)==='dagelijks');
  const vastTotaal = vast.reduce((s,r)=>s+r.amount,0);
  const dagelijksTotaal = dagelijks.reduce((s,r)=>s+r.amount,0);
  const blijftOver = incomeTotal + vastTotaal + dagelijksTotaal - SPAREN_VAST_DOEL;
  const sparenGedaan = all.some(r=>{
    if(r.category!=='__INTERN_SPAREN__' || r.vendor!=='Oranje Spaarrekening' || r.amount>=0) return false;
    const periodeEind = periodeBronnen.reduce((max,rr)=>rr.date>max?rr.date:max, periodeBronnen[0].date);
    const dagenVoorEind = (new Date(periodeEind)-new Date(r.date))/86400000;
    return dagenVoorEind>=0 && dagenVoorEind<=10; // alleen een overboeking dicht bij het einde van de maand telt als de systematische sweep
  });
  return {blijftOver, sparenGedaan};
}

function renderLopendeMaandView(){
  // Periode = de daadwerkelijke lopende maand, afgeleid uit RABO/ING/AMEX (die zijn altijd al tot die maand beperkt).
  // ING Creditcard bevat meerdere jaren geschiedenis; die willen we hier NIET laten meetellen (wel bruikbaar voor patroonherkenning/Reizen).
  const periodeBronnen = [...RABO_TX_JUL, ...ING_TX_JUL, ...AMEX_TX_JUL];
  const periodeStart = periodeBronnen.reduce((min,r)=>r.date<min?r.date:min, periodeBronnen[0].date);
  const periodeEind = periodeBronnen.reduce((max,r)=>r.date>max?r.date:max, periodeBronnen[0].date);
  const DUTCH_MAAND3 = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const maandenInPeriode = new Set([DUTCH_MAAND3[new Date(periodeStart).getUTCMonth()], DUTCH_MAAND3[new Date(periodeEind).getUTCMonth()]]);
  const casa3sEnel = [...maandenInPeriode].some(m=>ENEL_MAANDEN.has(m)) ? ENEL_BEDRAG : 0;
  const casa3sImu = [...maandenInPeriode].some(m=>IMU_MAANDEN.has(m)) ? IMU_BEDRAG : 0;
  const casa3sBudget = CASA_LENING + casa3sEnel + casa3sImu;
  const muziekActief = [...maandenInPeriode].some(m=>MUZIEK_MAANDEN.has(m));
  const budgetMap = {...BUDGET_CATEGORIE_MAP, 'Casa 3S': casa3sBudget, 'Muziek': muziekActief ? MUZIEK_BEDRAG : 0};

  // Sparen: vast maandelijks doel (niet de werkelijke overboeking, die kan afwijken/samengevoegd zijn met Kado/Maud).
  const ROB_SPAREN_VAST = 2000.00, LINDY_SPAREN_VAST = 2398.03, DEURWAARDER_SPAREN_VAST = 0; // Velthoven De Koning, nu gepauzeerd
  const SPAREN_VAST_DOEL = ROB_SPAREN_VAST + LINDY_SPAREN_VAST + DEURWAARDER_SPAREN_VAST;

  const all = buildCombinedJul().filter(r=>r.date>=periodeStart);
  const inkomenRabo = all.filter(r=>JUL_INCOME_CATS.includes(r.category) && r.source==='RABO').reduce((s,r)=>s+r.amount,0);
  const vasteLastenRabo = all.filter(r=>JUL_VASTE_LASTEN_CATS.includes(r.category) && r.source==='RABO').reduce((s,r)=>s+r.amount,0);
  const vasteLastenIng = all.filter(r=>JUL_VASTE_LASTEN_CATS.includes(r.category) && r.source==='ING').reduce((s,r)=>s+r.amount,0);
  const restNaarIng = inkomenRabo + vasteLastenRabo - SPAREN_VAST_DOEL; // vasteLastenRabo is al negatief
  const ingFlow = all.filter(r=>r.source==='ING' && r.category!=='__INTERN_RABO__' && r.category!=='__INTERN_ING__').reduce((s,r)=>s+r.amount,0);
  const ingTekort = ingFlow < 0 ? -ingFlow : 0;
  const ingOverschot = ingFlow > 0 ? ingFlow : 0;
  const income = all.filter(r=>JUL_INCOME_CATS.includes(r.category));
  const spend = all.filter(r=>!JUL_INCOME_CATS.includes(r.category) && !JUL_INTERN_CATS.includes(r.category) && r.category!=='Sparen' && !isReizenMetBudget(r) && r.category!=='Casa 3S (project)' && r.category!=='Belastingafrekening');
  const belastingafrekeningRegels = all.filter(r=>r.category==='Belastingafrekening');
  const belastingafrekeningTotaal = belastingafrekeningRegels.reduce((s,r)=>s+r.amount,0);
  const sparenRegels = all.filter(r=>r.category==='Sparen');
  const reizenRegels = all.filter(r=>r.category==='Reizen');
  const casaProjectRegels = all.filter(r=>r.category==='Casa 3S (project)');

  const incomeTotal = income.reduce((s,r)=>s+r.amount,0);
  const vasteLastenSet = new Set(JUL_VASTE_LASTEN_CATS);
  const vast = spend.filter(r=>effectiveBucket(r)==='vast');
  const dagelijks = spend.filter(r=>effectiveBucket(r)==='dagelijks');
  const vastTotaal = vast.reduce((s,r)=>s+r.amount,0);
  const dagelijksTotaal = dagelijks.reduce((s,r)=>s+r.amount,0);
  function budgetTotaalVoor(rowsGroep){
    const perCat = {};
    rowsGroep.forEach(r=>{ perCat[r.category] = (perCat[r.category]||0) + Math.abs(r.amount); });
    let totaal = 0, volledig = true;
    Object.entries(perCat).forEach(([cat,actual])=>{
      const b = budgetMap[cat];
      if(b!=null) totaal += b; else { totaal += actual; volledig = false; }
    });
    return {totaal, volledig};
  }
  const vastBudget = budgetTotaalVoor(vast);
  const dagelijksBudget = budgetTotaalVoor(dagelijks);
  const reizenTotaal = reizenRegels.reduce((s,r)=>s+r.amount,0);
  const casaProjectTotaal = casaProjectRegels.reduce((s,r)=>s+r.amount,0);

  const sparenStructureel = SPAREN_VAST_DOEL;
  const sparenTransfer = -sparenRegels.filter(r=>r.vendor.includes('Casa Tre Sorelle')).reduce((s,r)=>s+r.amount,0); // werkelijke overboeking, ter info

  const netto = incomeTotal + vastTotaal + dagelijksTotaal - sparenStructureel;

  function donutFor(rows){
    const map={};
    rows.forEach(r=>{ map[r.category]=(map[r.category]||0)+r.amount; });
    // Bewust het echte, tekengevoelige nettobedrag per categorie bewaren (niet Math.abs'en):
    // anders telt een categorie die per saldo een meevaller is (bv. een terugbetaling) hier
    // toch als uitgave mee, en klopt het TOTAAL van deze kaart niet meer met de koptegel.
    const sorted = Object.entries(map).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
    const total = sorted.reduce((s,[,v])=>s+v,0);
    return {sorted, total};
  }
  const vastDonut = donutFor(vast);
  const dagDonut = donutFor(dagelijks);

  function matchesFilterJul(r){
    if(!selectedFilter) return true;
    if(selectedFilter.type==='category') return r.category===selectedFilter.value;
    if(selectedFilter.value==='INKOMEN') return JUL_INCOME_CATS.includes(r.category);
    if(selectedFilter.value==='VAST') return effectiveBucket(r)==='vast' && !JUL_INCOME_CATS.includes(r.category) && r.category!=='Sparen';
    if(selectedFilter.value==='DAGELIJKS') return effectiveBucket(r)==='dagelijks' && !JUL_INCOME_CATS.includes(r.category) && !JUL_INTERN_CATS.includes(r.category) && r.category!=='Sparen' && !isReizenMetBudget(r) && r.category!=='Casa 3S (project)' && r.category!=='Belastingafrekening';
    if(selectedFilter.value==='BELASTINGAFREKENING') return r.category==='Belastingafrekening';
    if(selectedFilter.value==='CASA_PROJECT') return r.category==='Casa 3S (project)';
    if(selectedFilter.value==='SPAREN') return r.category==='Sparen' && r.vendor.includes('Casa Tre Sorelle');
    if(selectedFilter.value==='REIZEN') return r.category==='Reizen';
    return r.source===selectedFilter.value;
  }
  const ledgerRowsAll = all.filter(r=>!JUL_INTERN_CATS.includes(r.category) && !isReizenMetBudget(r)).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const ledgerRows = ledgerRowsAll.filter(matchesFilterJul);
  const srcColor = {RABO:'var(--brass)', ING:'var(--teal)', AMEX:'var(--rose)', 'ING CC':'var(--ingcc)'};
  const filterChip = selectedFilter ? `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);">Gefilterd op:</span>

      <button data-clear-filter="1" style="background:none;border:1px solid var(--rule);color:var(--muted);border-radius:20px;padding:2px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;">× wis filter</button>
    </div>` : '';

  const incomeDonut = donutFor(income);
  const sparenDonutRows = [
    {category:'Rob — vast', amount:-ROB_SPAREN_VAST},
    {category:'Lindy — volledig salaris', amount:-LINDY_SPAREN_VAST},
    {category:'Deurwaarder (Velthoven)', amount:-DEURWAARDER_SPAREN_VAST},
  ];
  const sparenDonut = donutFor(sparenDonutRows);

  function txRowHtml(t){
    const d=new Date(t.date); const dd=String(d.getUTCDate()).padStart(2,'0'); const mm=String(d.getUTCMonth()+1).padStart(2,'0');
    const btw = isUSVendor(t.vendor) ? '<span class="lr-btw">BTW verlegd</span>' : '';

      <span class="lr-date">${dd}-${mm}</span>

      <select class="lr-tag-select" data-edit-cat="${txKeyAttr}" style="background:${CATEGORY_COLORS[t.category]||'var(--c-overig)'};"${overridden}>
        ${ALLE_CATEGORIEEN.map(c=>`<option value="${c}" ${c===t.category?'selected':''}>${c}</option>`).join('')}

      <span class="lr-vendor">${t.vendor}</span><span class="lr-leader"></span>${btw}
      <span class="lr-amt ${isIncome?'pos-income':(t.amount<0?'':'neg')}">${fmt(t.amount)}</span></li>`;
  }


  function accordionTile(label, bedrag, sub, expandKey, cls, donut, rows, budgetInfo){

const srcColorReis = {RABO:'var(--brass)', ING:'var(--teal)', AMEX:'var(--rose)', 'ING CC':'var(--ingcc)'};

function reisSelectHtml(t, currentRid){
  const key = txKey(t._orig);
  const txKeyAttr = key.replace(/"/g,'&quot;');
  let selectedValue;
  if(currentRid !== null){
    selectedValue = currentRid; // al resolved doorgegeven (toegewezen aan een reis)
  } else if(key in reisOverrides){
    selectedValue = reisOverrides[key] || ''; // echte opgeslagen waarde tonen; '' = expliciet geen reis
  } else {
    selectedValue = '__AUTO__';
  }
  const bg = (selectedValue && selectedValue!=='__AUTO__') ? 'var(--brass)' : 'var(--rose)';
  const options = [
    `<option value="__AUTO__" ${selectedValue==='__AUTO__'?'selected':''}>— automatisch —</option>`,
    `<option value="" ${selectedValue===''?'selected':''}>— geen reis —</option>`
  ];
  REIZEN_PLANNING.forEach(p=>{
    options.push(`<option value="${p.id}" ${selectedValue===p.id?'selected':''}>${p.jaar} · ${p.naam} (${p.timing})</option>`);
  });
  return `<select class="lr-tag-select" data-edit-reis="${txKeyAttr}" style="background:${bg};">${options.join('')}</select>`;
}

function reisLedgerRow(t, currentRid){
  const d=new Date(t.date); const dd=String(d.getUTCDate()).padStart(2,'0'); const mm=String(d.getUTCMonth()+1).padStart(2,'0');
  const txKeyAttr = txKey(t).replace(/"/g,'&quot;');
  const overridden = categoryOverrides[txKey(t)] ? ' title="handmatig aangepast"' : '';
  return `<li class="tx-row2">
    <div class="tx-row2-meta">
      <span>${dd}-${mm}</span>
      ${reisSelectHtml(t, currentRid)}
      <select data-edit-cat="${txKeyAttr}" style="background:${CATEGORY_COLORS[t.category]||'var(--c-overig)'};"${overridden}>
        ${ALLE_CATEGORIEEN.map(c=>`<option value="${c}" ${c===t.category?'selected':''}>${c}</option>`).join('')}
      </select>
      <span style="color:${srcColorReis[t.source]};">${t.source}</span>
    </div>
    <div class="tx-row2-content">
      <span class="tx-row2-vendor">${t.vendor}</span>
      <span class="tx-row2-amt" style="color:var(--paper);">${fmt(t.amount)}</span>
    </div>
  </li>`;
}

function renderReizenView(){
  const all = buildCombinedAlles();
  const reizenSpend = all.filter(r=>r.category==='Reizen');

  const perReis = {};
  REIZEN_PLANNING.forEach(p=>{ perReis[p.id] = {uitgegeven:0, tx:[]}; });
  const nietToegewezen = [];
  reizenSpend.forEach(t=>{
    const rid = effectiveReis(t);
    const key = txKey(t._orig);
    const expliciteGeenReis = reisOverrides[key] === ''; // je hebt zelf al "— geen reis —" gekozen: opgelost, hoeft niet meer in de wachtrij
    if(rid && perReis[rid]){ perReis[rid].uitgegeven += t.amount; perReis[rid].tx.push(t); }
    else if(!expliciteGeenReis && t.date >= '2026-06-01'){ nietToegewezen.push(t); } // ouder, ongematcht = geschiedenis zonder functie, niet tonen
  });
  nietToegewezen.sort((a,b)=>b.date.localeCompare(a.date));

  const reizenSparen = all.filter(r=>r.category==='__SPAREN_NAAR_REIZEN__');
  const perReisSparen = {};
  REIZEN_PLANNING.forEach(p=>{ perReisSparen[p.id] = []; });
  const sparenNietToegewezen = [];
  reizenSparen.forEach(t=>{
    const rid = effectiveReis(t);
    if(rid && perReisSparen[rid]) perReisSparen[rid].push(t);
    else sparenNietToegewezen.push(t);
  });

  const alleToegewezen = REIZEN_PLANNING.flatMap(p=>perReis[p.id].tx);
  const alleReisTx = [...alleToegewezen, ...nietToegewezen].sort((a,b)=>b.date.localeCompare(a.date));

  const jaren = [...new Set(REIZEN_PLANNING.filter(p=>effectiveStatus(p)==='idee').map(p=>effectiveJaar(p)))].sort((a,b)=>a-b);
  const lopendeReizen = REIZEN_PLANNING.filter(p=>effectiveStatus(p)==='lopend' || effectiveStatus(p)==='planning');

  const reisFilterActief = selectedFilter && selectedFilter.type==='reis';
  const gefilterdeReis = reisFilterActief ? REIZEN_PLANNING.find(p=>p.id===selectedFilter.value) : null;
  const filterChip = reisFilterActief ? `
    <div style="display:flex;align-items:center;gap:8px;margin:-6px 0 14px;">
      <span style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;">Gefilterd op:</span>
      <span class="lr-tag" style="background:var(--brass);">${gefilterdeReis?gefilterdeReis.jaar+' · '+gefilterdeReis.naam:selectedFilter.value}</span>
      <button data-clear-filter="1" style="background:none;border:1px solid var(--rule);color:var(--muted);border-radius:20px;padding:2px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;">× wis filter</button>
    </div>` : '';
  const alleGetoond = reisFilterActief ? alleReisTx.filter(t=>effectiveReis(t)===selectedFilter.value) : alleReisTx;

  return `
    <div class="note-card card">
      <b>Model:</b> een reis staat eerst in <b>planning</b> (budget kan nog wijzigen) → zodra het budget vastligt wordt er gespaard tot dat bedrag → betalingen vóór en tijdens de reis lopen via een rekening (Rabo/ING/AMEX), maar tellen tegen het budget/potje → bij afsluiting: overschot gaat terug naar sparen, een tekort komt op de balans van het gewone huishoudbudget.
      <br><br><i>Transacties worden automatisch aan een reis gekoppeld op trefwoord in de omschrijving (bv. "Ravello" → Italië). Klopt dat niet — zoals koffie op Schiphol — wijs de reis dan hieronder handmatig toe via de dropdown. Tik op een reis-tegel om 'm open te klappen; tik nog een keer om 'm weer dicht te klappen.</i>
    </div>

    ${(() => {
      const open = reisTileExpand==='nietToegewezen';
      const totaalNT = nietToegewezen.reduce((s,r)=>s+r.amount,0);
      return `
      <div class="card" data-reis-tile-toggle="nietToegewezen" style="cursor:pointer;margin-bottom:12px;">
        <div class="card-label">Verwerken — nog te plaatsen${open?' ▾':' ▸'}</div>
        <div class="stat-figure neg">${fmt(totaalNT)}</div>
        <div class="stat-sub">${nietToegewezen.length} transactie${nietToegewezen.length===1?'':'s'} — geen geplande reis herkend, tik om toe te wijzen</div>
        ${open ? `<div class="cat-detail-tile" style="margin-top:14px;">
          <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
            ${nietToegewezen.map(t=>reisLedgerRow(t, null)).join('')}
          </ul>
        </div>` : ''}
      </div>`;
    })()}

    ${lopendeReizen.map(p=>{
      const isOpen = reisTripExpand===p.id;
      const timingLabel = REIZEN_TIMING_OPTIES.includes(effectiveTiming(p)) ? REIZEN_TIMING_LABEL[effectiveTiming(p)] : effectiveTiming(p);
      const tile = `<div class="card" data-reis-trip-toggle="${p.id}" style="cursor:pointer;margin-bottom:${isOpen?'12px':'12px'};">
        <div class="card-label">${effectiveJaar(p)}</div>
        <div class="stat-figure pos">${p.naam} <span style="font-size:12px;font-weight:400;color:var(--muted);">· ${timingLabel}</span>${isOpen?' ▾':' ▸'}</div>
      </div>`;
      const detail = isOpen ? renderReisDetailCard(p, perReis[p.id], perReisSparen[p.id]) : '';
      return tile + detail;
    }).join('')}

    <div style="color:var(--brass);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin:18px 0 8px;">Meerjarenplanning (2026–2036)</div>
    <div style="color:var(--muted);font-size:11px;margin:-4px 0 10px;">Ideeën/richtbedragen zonder vaste planning. Zodra een reis op "wordt gepland" of "lopend" gezet wordt, krijgt hij een eigen tegel hierboven en verdwijnt hij uit dit overzicht.</div>
    ${jaren.map(j=>{
      const trips = REIZEN_PLANNING.filter(p=>effectiveJaar(p)===j && effectiveStatus(p)==='idee');
      if(trips.length===0) return '';
      const budgetSom = trips.reduce((s,p)=>{ const b=effectiveBudget(p); return s+(b||0); },0);
      const header = `<div class="reis-jaar-header">${j} <span style="color:var(--muted);font-weight:400;font-size:12.5px;">· totaal ${fmt(budgetSom)}</span></div>`;
      const detail = `<div class="card" style="margin-bottom:10px;padding-top:12px;padding-bottom:4px;">
        ${trips.map(p=>{
          const budget = effectiveBudget(p);
          const actief = reisFilterActief && selectedFilter.value===p.id;
          const timing = effectiveTiming(p);
          const status = effectiveStatus(p);
          const timingIsAnders = reisTimingCustomFor===p.id || !REIZEN_TIMING_OPTIES.includes(timing);
          const budgetEditing = reisRowEditOpen === (p.id+'|budget');
          return `<div class="reis-plan-row" data-trip-id="${p.id}" style="${actief?'background:rgba(224,180,41,0.1);':''}">
            <div class="rp-bestemming" data-filter-reis="${p.id}">${p.naam}${p.notitie?`<small>${p.notitie}</small>`:''}</div>
            <div class="rp-pills">
              <select data-jaar-select="${p.id}" class="rp-pill-select rp-pill-jaar">
                ${REIZEN_JAAR_OPTIES.map(y=>`<option value="${y}" ${y===j?'selected':''}>${y}</option>`).join('')}
              </select>
              <select data-timing-select="${p.id}" class="rp-pill-select rp-pill-periode">
                ${REIZEN_TIMING_OPTIES.map(o=>`<option value="${o}" ${(!timingIsAnders && timing===o)?'selected':''}>${REIZEN_TIMING_LABEL[o]}</option>`).join('')}
                <option value="anders" ${timingIsAnders?'selected':''}>${REIZEN_TIMING_LABEL.anders}</option>
              </select>
              <span data-promote-status="${p.id}" class="rp-pill-select rp-pill-status" style="color:${REIZEN_STATUS_COLOR.idee};border-color:${REIZEN_STATUS_COLOR.idee};cursor:pointer;">Idee ▸ plannen</span>
            </div>
            ${timingIsAnders ? `<input type="text" data-timing-custom-input="${p.id}" value="${REIZEN_TIMING_OPTIES.includes(timing)?'':(timing||'')}" placeholder="eigen omschrijving voor periode" class="rp-timing-custom-input" />` : ''}
            <div class="rp-line">
              <span class="rp-label">Budget</span>
              <span class="rp-value">${budgetEditing
                ? `<input type="number" inputmode="decimal" data-budget-row-input="${p.id}" value="${budget!=null?budget:''}" class="rp-budget-input" />`
                : `<span data-edit-budget-row="${p.id}" style="cursor:text;text-decoration:underline dotted;">${budget!=null?fmt(budget):'n.t.b.'}</span>`}</span>
            </div>
          </div>`;
        }).join('')}
      </div>`;
      return header + detail;
    }).join('')}

    <div class="card ledger-card" id="reis-toegewezen-ledger">
      <div class="card-label"><span>Alle reistransacties</span><span class="ledger-count">${alleGetoond.length} regels</span></div>
      ${filterChip}
      <div style="color:var(--muted);font-size:11.5px;margin:-4px 0 10px;">${nietToegewezen.length} daarvan zijn <b>geschiedenis</b> (geen match met de meerjarenplanning, geen actie nodig) · ${alleToegewezen.length} zijn gekoppeld aan een geplande reis.</div>
      <ul class="ledger-list">
        ${alleGetoond.map(t=>reisLedgerRow(t, effectiveReis(t))).join('')}
      </ul>
    </div>
    <footer>Statuskleuren bij de dropdown: <b>goud</b> = gekoppeld aan een geplande reis · <b>rose</b> = geschiedenis / geen match — dat hoeft niet aangepast te worden, tenzij je 'm alsnog aan een geplande reis wil hangen. Statuskleuren bij de reizen zelf: <b>lopend</b> (teal) = echt budget, sparen loopt · <b>wordt gepland</b> (brass) = budget nog niet definitief · <b>idee</b> (grijs) = richtbedrag, kan nog volledig wijzigen. Handmatige reis-koppelingen blijven bewaard in Supabase.</footer>
  `;
}

function c3sIsAkkoordEffectief(p){
  const manual = c3sVoortgangOverrides[p.id];
  if(manual) return ['akkoord','gestart','klaar'].includes(manual);
  return p.akkoord!=null; // oude fallback voor posten zonder eigen override

function c3sBudgetNetto(p){
  if(p.categorie==='werkzaamheid' && !c3sIsAkkoordEffectief(p)) return 0; // Bouw: contractor-offerte, telt pas mee na akkoord
  // Afwerking (materiaal) telt altijd mee als richtprijs, ook zonder akkoord — anders geen totale begroting.
  if(p.eenheid_aantal!=null && p.eenheid_prijs!=null) return p.eenheid_aantal*p.eenheid_prijs;
  return (p.akkoord!=null ? p.akkoord : p.begroot) || 0;
}
function c3sIndicatiefNetto(p){ return p.begroot||0; } // offerte-richtprijs voor niet-akkoord posten, ter info

function c3sInclIva(p){ return c3sBudget(p); }
function c3sFacturenVoorPost(id){ return C3S_FACTUREN.filter(f=>f.post_ids && f.post_ids.includes(id)); }
function c3sHeuristicGestartIds(){
  // De twee generieke Lanzillotti-voorschotten (geen specifieke posten genoemd) zijn een lumpsum.
  // Alleen het al BETAALDE deel (€5.500) tellen we mee als "waarschijnlijk gestart" — het nog openstaande
  // voorschot (€11.000) zegt niets over uitgevoerd werk, dus dat negeren we bewust.
  // We lopen strikt in offerte-volgorde (= bouwvolgorde) en STOPPEN bij het eerste item dat niet meer past —
  // niet doorzoeken naar kleinere latere items die toevallig nog wel passen, dat zou een willekeurige
  // greedy-selectie geven die niets met de werkelijke bouwvolgorde te maken heeft.
  const genericPaidBudget = C3S_FACTUREN.filter(f=>f.betaald && (!f.post_ids || f.post_ids.length===0) && f.aannemer==='Lanzillotti Domenico').reduce((s,f)=>s+f.bedrag,0);
  let cum = 0;
  const ids = [];
  const kandidaten = C3S_POSTEN.filter(p=>p.categorie==='werkzaamheid' && p.akkoord!=null && c3sFacturenVoorPost(p.id).length===0 && !c3sVoortgangOverrides[p.id])
    .sort((a,b)=>a.volgorde-b.volgorde);
  for(const p of kandidaten){
    const budget = c3sBudget(p);
    if(cum + budget > genericPaidBudget + 0.5) break; // eerste die niet meer past: stop, geen latere items overslaan
    cum += budget;
    ids.push(p.id);
  }
  return ids;
}
function c3sEffectieveStatus(p, heuristicGestartIds){
  const manual = c3sVoortgangOverrides[p.id];
  if(manual) return {value:manual, auto:false, reden:''};

  if(st==='betaald') return {value:'klaar', auto:true, reden:'auto: betaald'};
  if(st==='deels') return {value:'gestart', auto:true, reden:'auto: deels betaald'};
  if(heuristicGestartIds.includes(p.id)) return {value:'gestart', auto:true, reden:'indicatief: uit voorschot Lanzillotti'};
