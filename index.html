<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Uitgavenoverzicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12151b;
    --panel: #1b2029;
    --rule: #2e3541;
    --paper: #edeae2;
    --paper-dim: #a8adaf;
    --muted: #8b93a3;
    --brass: #c9a66b;
    --brass-dim: #a8875e;
    --teal: #6fac9e;
    --rose: #ba7a90;
    --ingcc: #868ebd;
    --dot-ok: #5cb37e;
    --dot-over: #cf7089;

    --c-abonnementen: #6fac9e;
    --c-reizen: #c99a5c;
    --c-vervoer: #7a94c0;
    --c-shopping: #c48a70;
    --c-kleding: #9b81b0;
    --c-wonen: #74a684;
    --c-entertainment: #c3ab6e;
    --c-bankkosten: #8b93a3;
    --c-persoonlijk: #ba7a90;
    --c-zakelijk: #7188b5;
    --c-eten: #c19d61;
    --c-goededoelen: #6bab97;
    --c-overig: #93897f;
    --c-hypotheek: #b68a5f;
    --c-verzekeringen: #7599c0;
    --c-nuts: #6bab8a;
    --c-telecom: #a689bd;
    --c-auto: #c08f60;
    --c-italie: #bd7f70;
    --c-vakbond: #93aa6e;
    --c-educatie: #bf9ab0;
    --c-verzorging: #c1a86e;
    --c-kids: #74a3bd;
    --c-boodschappen: #9bb072;
    --c-familie: #b98cae;
    --c-cadeaus: #c3a35f;
    --c-sparen: #6ea6b6;
    --c-onbekend: #bd7a63;
  }

  *{ box-sizing: border-box; }
  html,body{ overflow-x: clip; max-width: 100vw; }
  html,body{ margin:0; padding:0; background: var(--ink); }
  body{
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  .app{ max-width: 1000px; margin: 0 auto; min-width: 0; overflow-x: clip; }

  header{
    display:flex; align-items:flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 20px;
    margin-bottom: 20px;
    padding-bottom: 20px;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 8px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 40px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .view-toggle{ display:flex; gap:4px; margin-bottom: 28px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .view-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 15px;
    background: transparent; border: none;
    color: var(--muted);
    padding: 12px 6px; margin-right: 26px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transform: translateY(1px);
  }
  .view-btn.active{ color: var(--paper); border-bottom-color: var(--brass); }

  .tile-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .app-tile{
    background: var(--panel); border: 1px solid var(--rule); border-radius: 16px;
    padding: 20px 18px; display:flex; flex-direction:column; align-items:flex-start; gap: 16px;
    cursor:pointer; text-align:left; font: inherit; color:inherit;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
    min-height: 106px;
  }
  .app-tile:active{ transform: scale(0.95); border-color: var(--brass-dim); background: #202632; }
  .app-tile.empty{ border-style: dashed; opacity: 0.35; cursor: default; }
  .app-tile-icon{
    width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.05); flex-shrink:0;
  }
  .app-tile-icon svg{ width:22px; height:22px; }
  .app-tile-icon.txt{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; }
  .app-tile-label{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; line-height:1.25; }

  .detail-header{ display:flex; align-items:center; gap:10px; margin-bottom:22px; position:sticky; top:0; z-index:25; background: var(--ink); padding: 14px 0 12px; }
  .back-btn{ background:none;border:1px solid var(--rule); color:var(--paper); border-radius:9px; width:40px;height:40px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; }
  .back-btn:active{ background: rgba(255,255,255,0.07); }
  .back-btn svg{ width:20px; height:20px; }
  .detail-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:21px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .switch-btn{ background:none;border:1px solid var(--rule); color:var(--muted); border-radius:9px; width:40px;height:40px; display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; }
  .switch-btn:active{ background: rgba(255,255,255,0.07); }
  .switch-btn svg{ width:18px; height:18px; }
  .switch-menu{ position:absolute; top:48px; right:0; background:var(--panel); border:1px solid var(--rule); border-radius:12px; overflow:hidden; z-index:30; min-width:210px; box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
  .switch-menu button{ display:block; width:100%; text-align:left; background:none;border:none; color:var(--paper); padding:13px 16px; font-family:'IBM Plex Mono',monospace; font-size:13px; cursor:pointer; border-bottom:1px solid var(--rule); }
  .switch-menu button:last-child{ border-bottom:none; }
  .switch-menu button:active{ background: rgba(255,255,255,0.07); }
  .switch-menu button.active{ color: var(--brass); }
  [data-filter-cat]:active, [data-filter-src]:active, [data-filter-reis]:active{ background: rgba(201,162,39,0.15) !important; transform: scale(0.98); }
  .card[data-filter-cat], .card[data-filter-src], .card[data-filter-reis]{ transition: background .1s ease, transform .1s ease; }
  li[data-filter-cat], li[data-filter-src]{ transition: background .1s ease; border-radius: 4px; padding-left: 4px; margin-left: -4px; }
  .reis-plan-row[data-filter-reis]{ transition: background .1s ease, transform .1s ease; border-radius: 4px; padding-left: 4px; margin-left: -4px; }

  .month-tabs{ display:flex; gap: 4px; flex-wrap: wrap; }
  .month-tab{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    padding: 8px 13px;
    border-radius: 3px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .month-tab:hover{ border-color: var(--brass-dim); color: var(--paper); }
  .month-tab.active{ background: var(--brass); border-color: var(--brass); color: #1a1608; font-weight: 500; }

  .hero{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; min-width: 0; }
  .hero4{ display:grid; grid-template-columns: repeat(5,1fr); gap: 14px; margin-bottom: 20px; min-width: 0; }
  @media (max-width: 900px){ .hero4{ grid-template-columns: 1fr 1fr 1fr; } }
  @media (max-width: 720px){ .hero{ grid-template-columns: 1fr; } .hero4{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px){
    body{ padding: 16px 10px 50px; }
    h1{ font-size: 24px; }
    .brand-eyebrow{ font-size: 9px; }
    .hero4{ grid-template-columns: 1fr; gap: 8px; }
    .card{ padding: 14px; }
    .card-label{ font-size: 10px; letter-spacing: 0.08em; }
    .total-figure{ font-size: 28px; }
    .stat-figure{ font-size: 24px; white-space: normal; }
    .stat-sub{ font-size: 10px; }
    .view-toggle{ overflow-x: auto; white-space: nowrap; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; margin-bottom: 20px; }
    .view-btn{ margin-right: 16px; font-size: 13.5px; padding: 10px 3px; }
    .month-tabs{ overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .donut-wrap{ flex-direction: column; align-items: flex-start; gap: 14px; }
    .donut{ width: 100px; height: 100px; }
    .legend .name{ font-size: 12px; }
    .legend .amt{ font-size: 11px; }
    .ledger-row{ flex-wrap: wrap; row-gap: 4px; font-size: 12.5px; align-items: baseline; }
    .lr-date{ flex: 0 0 auto; order: 1; font-size: 10px; margin-right: 6px; }
    .lr-tag{ order: 2; font-size: 9px; padding: 2px 5px; }
    .lr-tag-select{ order: 2; font-size: 9px; padding: 2px 16px 2px 6px; max-width: 150px; flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lr-amt{ order: 3; margin-left: auto; min-width: auto; font-size: 13px; font-weight: 600; }
    .lr-vendor{ flex: 1 1 100%; order: 4; white-space: normal; font-size: 12.5px; margin-top: 2px; }
    .lr-leader{ display: none; }
    .lr-src{ order: 5; font-size: 8.5px; margin-top: 2px; }
    .lr-btw{ order: 6; font-size: 8px; margin-top: 2px; }
    .card-label{ flex-wrap: wrap; gap: 4px; }
    .note-card{ font-size: 11.5px; }
    footer{ font-size: 11px; }
  }

  .card{ background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 24px; min-width: 0; overflow-x: hidden; }
  .card-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px;
  }
  .stat-figure{ font-family:'Space Grotesk', sans-serif; font-weight: 500; font-size: 30px; line-height:1; }
  .stat-figure.pos{ color: var(--teal); }
  .stat-figure.neg{ color: var(--rose); }
  .stat-sub{ margin-top:8px; font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); }

  .total-card{ display:flex; flex-direction:column; justify-content: space-between; }
  .total-figure{ font-family:'Space Grotesk', sans-serif; font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: -0.01em; }
  .total-delta{ margin-top: 10px; font-family:'IBM Plex Mono', monospace; font-size: 13px; }
  .total-delta.up{ color: var(--rose); }
  .total-delta.down{ color: var(--teal); }
  .total-sub{
    margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--rule);
    display:flex; justify-content: space-between;
    font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted);
  }
  .total-sub b{ color: var(--paper); font-weight: 500; }

  .donut-wrap{ display:flex; align-items:center; gap: 22px; }
  .donut{ position: relative; width: 132px; height: 132px; flex: 0 0 auto; border-radius: 50%; }
  .donut-hole{ position:absolute; inset: 20px; background: var(--panel); border-radius: 50%; display:flex; align-items:center; justify-content:center; flex-direction: column; }
  .donut-hole span{ font-family:'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--muted); text-transform:uppercase; letter-spacing: .08em;}
  .donut-hole b{ font-family:'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; margin-top:2px; }

  .bar-total{ display:flex; justify-content:space-between; align-items:baseline; font-family:'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }
  .bar-total b{ font-family:'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; color: var(--paper); text-transform: none; letter-spacing: 0; }
  .bar-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap: 11px; }
  .bar-row{ display:flex; flex-direction:column; gap: 4px; }
  .bar-row-top{ display:flex; justify-content:space-between; align-items:baseline; gap: 10px; font-size: 13px; }
  .bar-name{ color: var(--paper); min-width: 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-amt{ font-family:'IBM Plex Mono', monospace; font-size: 13px; color: var(--paper); white-space:nowrap; flex: 0 0 auto; }
  .bar-track{ height: 7px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow:visible; position:relative; }
  .bar-fill{ height: 100%; border-radius: 4px; min-width: 2px; transition: width .2s ease; }
  .bar-marker{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--paper-dim); opacity:0.55; border-radius:1px; }
  .bar-row[data-cat-toggle], .bar-row[data-filter-cat]{ transition: background .1s ease, transform .1s ease; border-radius: 4px; padding: 3px 4px; margin: -3px -4px; }
  .bar-row[data-cat-toggle]:active, .bar-row[data-filter-cat]:active{ background: rgba(201,162,39,0.15); transform: scale(0.98); }
  .cat-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:8px; flex:0 0 auto; }
  .cat-detail-tile{ margin: 10px 0 2px; padding: 12px 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; max-width: 100%; overflow: hidden; }
  .cdt-total{ font-family:'Space Grotesk', sans-serif; font-size: 19px; font-weight: 500; color: var(--paper); }
  .cdt-budget{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cdt-divider{ height:1px; background: var(--rule); margin: 12px 0; border-top: 1px dashed var(--rule); background: none; }
  .cdt-sum{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); text-align: right; }
  .tx-row2{ padding: 8px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
  .tx-row2:last-child{ border-bottom: none; }
  .tx-row2-meta{ display:flex; align-items:center; gap:8px; font-size:10.5px; color: var(--muted); font-family:'IBM Plex Mono', monospace; margin-bottom: 4px; min-width: 0; }
  .tx-row2-meta select{
    appearance:none; -webkit-appearance:none; border: none; color: var(--ink); font-weight: 600;
    border-radius: 4px; padding: 1px 16px 1px 6px; font-size: 10.5px; font-family:'IBM Plex Mono', monospace; max-width: 110px; min-width: 0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8'><path d='M1 2 L4 6 L7 2' stroke='%2312151b' stroke-width='1.4' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 5px center;
  }
  .tx-row2-content{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12.5px; min-width: 0; }
  .tx-row2-vendor{ flex: 1 1 auto; min-width: 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color: var(--paper-dim); }
  .tx-row2-amt{ flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-weight:600; font-size: 13px; }

  .legend{ list-style:none; margin:0; padding:0; flex:1; min-width:0; }
  .legend li{ display:flex; align-items:center; gap: 9px; font-size: 12.5px; padding: 4px 0; }
  .legend .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .legend .name{ color: var(--paper); flex: 1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend .amt{ font-family:'IBM Plex Mono', monospace; color: var(--muted); font-size: 11.5px;}

  .trend-card{ margin-bottom: 20px; }
  .trend-card svg{ display:block; width:100%; height:auto; overflow: visible; }
  .trend-labels{ display:flex; justify-content: space-between; font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 6px; padding: 0 4px; }

  .ledger-card .card-label{ display:flex; justify-content: space-between; align-items: baseline;}
  .ledger-count{ color: var(--paper-dim); }
  .ledger-list{ list-style:none; margin:0; padding:0; }
  .ledger-row{ display:flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .ledger-row:last-child{ border-bottom: none; }
  .lr-date{ font-family:'IBM Plex Mono', monospace; color: var(--muted); font-size: 11.5px; flex: 0 0 56px; }
  .lr-src{
    flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 9px; letter-spacing:.05em;
    padding: 2px 5px; border-radius: 2px; border:1px solid var(--rule); color: var(--muted);
  }
  .lr-vendor{ flex: 0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lr-tag{
    flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 10px; letter-spacing:.04em;
    padding: 2px 6px; border-radius: 2px; color: var(--ink); font-weight: 600; white-space: nowrap;
  }
  .lr-tag-select{
    flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 10px; letter-spacing:.04em;
    padding: 2px 18px 2px 6px; border-radius: 2px; color: var(--ink); font-weight: 600; white-space: nowrap;
    border: none; appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8'><path d='M1 2 L4 6 L7 2' stroke='%2312151b' stroke-width='1.4' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 5px center;
  }
  .lr-tag-select:focus{ outline: 2px solid var(--brass); outline-offset: 1px; }
  .lr-leader{ flex: 1 1 auto; border-bottom: 1px dotted var(--rule); margin: 0 6px; min-width: 16px; transform: translateY(-4px);}
  .lr-btw{ flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 9px; border: 1px solid var(--brass-dim); color: var(--brass); border-radius: 20px; padding: 2px 7px; letter-spacing: .03em; }
  .lr-amt{ flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 13.5px; min-width: 76px; text-align:right; }
  .lr-amt.neg{ color: var(--teal); }
  .lr-amt.pos-income{ color: var(--teal); }

  .note-card{ font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  .budget-compare-header, .budget-compare-row{
    display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 6px; align-items: baseline;
    padding: 8px 0; border-bottom: 1px solid var(--rule);
  }
  .budget-compare-header{
    font-family:'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
  }
  .budget-compare-header span:not(:first-child), .bc-val{ text-align: right; font-family:'IBM Plex Mono', monospace; font-size: 12.5px; }
  .bc-naam{ font-size: 13px; }
  @media (max-width: 480px){
    .budget-compare-header, .budget-compare-row{ grid-template-columns: 1fr; gap: 2px; padding: 8px 0; }
    .budget-compare-header span:not(:first-child){ display: none; }
    .bc-naam{ font-weight: 600; margin-bottom: 2px; }
    .bc-val{ text-align: left; font-size: 12px; color: var(--muted); }
    .bc-val::before{ margin-right: 6px; }
    .bc-budget::before{ content: "Budget: "; }
    .bc-voorspelling::before{ content: "Voorspelling: "; }
    .bc-verschil::before{ content: "Verschil: "; }
  }
  .note-card b{ color: var(--paper-dim); }

  .reis-jaar-header{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--brass); margin: 18px 0 6px; padding-top: 10px; border-top: 1px solid var(--rule);
  }
  .reis-jaar-header:first-child{ margin-top: 0; padding-top: 0; border-top: none; }
  .reis-plan-row{
    display: grid; grid-template-columns: 1.8fr 0.9fr 1fr 1fr 1fr; gap: 8px; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13px;
  }
  .reis-plan-row:last-child{ border-bottom: none; }
  .reis-plan-header{
    display: grid; grid-template-columns: 1.8fr 0.9fr 1fr 1fr 1fr; gap: 8px;
    font-family:'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    padding-bottom: 6px; border-bottom: 1px solid var(--rule);
  }
  .reis-plan-header span, .reis-plan-row .rp-val{ text-align: right; font-family:'IBM Plex Mono', monospace; font-size: 12.5px; }
  .reis-plan-header span:first-child, .rp-naam{ text-align: left; font-family:'Inter',sans-serif; }
  .rp-naam small{ display:block; color: var(--muted); font-size: 10.5px; font-weight: 400; }
  .reis-status-pill{
    font-family:'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 20px; border: 1px solid; white-space: nowrap; text-align: center;
  }
  @media (max-width: 720px){
    .reis-plan-header{ display:none; }
    .reis-plan-row{ grid-template-columns: 1fr 1fr; row-gap: 4px; }
    .rp-naam{ grid-column: 1 / -1; }
    .rp-val{ text-align: left; font-size: 11.5px; color: var(--muted); }
    .rp-budget::before{ content: "Budget: "; }
    .rp-uitgegeven::before{ content: "Uitgegeven: "; }
    .rp-rest::before{ content: "Rest: "; }
  }

  footer{ margin-top: 30px; font-size: 12.5px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--rule); padding-top: 18px; }

function txForMonth(m){ return AMEX_ALL.filter(r => monthOf(r.date)===m && r.category!=='__PAYMENT__'); }
function totalForMonth(m){ return txForMonth(m).reduce((s,r)=>s+r.amount,0); }
function categoryTotals(m){
  const map={}; txForMonth(m).forEach(r=>{ map[r.category]=(map[r.category]||0)+r.amount; });
  return Object.entries(map).filter(([,v])=>v>0.001).sort((a,b)=>b[1]-a[1]);
}
/* ---------- Bar-list: gerangschikte lijst met proportionele balkjes (in plaats van een donutgrafiek) ---------- */
function renderBarList(sorted, total, opts={}){
  const formatAmt = opts.formatAmt || ((v)=>fmt(v));
  const rowAttrs = opts.rowAttrs || (()=>'');
  const indicator = opts.indicator || (()=>'');
  const budgetFor = opts.budgetFor || (()=>null); // (name) => begroot bedrag, of null als er geen budget is
  const showDot = opts.showDot || false; // toon een grijs/groen/rood bolletje vóór de naam
  const detailFor = opts.detailFor || (()=>''); // (name) => HTML, direct onder deze rij getoond (bv. uitgeklapte details)
  const limit = opts.limit || sorted.length;
  const rows = sorted.slice(0, limit).map(([name,val],i)=>{
    let dot = '';
    if(showDot){
      const budget = budgetFor(name);
      const dotColor = budget!=null && budget>0 ? (val>budget?"var(--dot-over)":"var(--dot-ok)") : 'var(--rule)';
      dot = `<span class="cat-dot" style="background:${dotColor};"></span>`;
    }
    return `<li class="bar-row"${rowAttrs(name,i)}>
      <div class="bar-row-top"><span class="bar-name">${dot}${name}${indicator(name)}</span><span class="bar-amt">${formatAmt(val,name)}</span></div>
      ${detailFor(name)}
    </li>`;
  }).join('');
  return `<ul class="bar-list">${rows}</ul>`;
}
function renderTrendSVG(){
  const w=900,h=170,pad=10;
  const totals = MONTHS.map(totalForMonth);
  const max = Math.max(...totals)*1.15;
  const stepX=(w-pad*2)/(MONTHS.length-1);
  const pts = totals.map((t,i)=>{ const x=pad+i*stepX; const y=h-pad-(t/max)*(h-pad*2); return [x,y]; });
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const circles = pts.map((p,i)=>{
    const active = MONTHS[i]===selectedMonth;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${active?5:3}" fill="${active?'#c9a227':'#4fa89b'}" stroke="var(--panel)" stroke-width="2"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa89b" stop-opacity="0.35"/><stop offset="100%" stop-color="#4fa89b" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#areaGrad)"/>
    <path d="${linePath}" fill="none" stroke="#4fa89b" stroke-width="2"/>${circles}</svg>`;
}

/* Bron voor deze en toekomstige vaste-lasten-patronen: Supabase-tabel 'vendor_patronen'
   (project apleozatyqmqtzofxbky). Nieuwe/bijgestelde patronen (bv. Muziek-zomerstop, tariefswijzigingen)
   worden daar eerst bevestigd met Rob voordat ze hier hardcoded worden. */
const ENEL_MAANDEN = new Set(["feb","apr","jun","aug","okt","dec"]);
const IMU_MAANDEN = new Set(["mei","nov"]);
const MUZIEK_MAANDEN = new Set(["jan","feb","mrt","apr","mei","jun","okt","nov","dec"]); // zomerstop jul/aug/sep
const MUZIEK_BEDRAG = 182.73; // nieuw tarief sinds okt (was €77,88/89)
const BKW_VAST_EXCL_ENERGIE = 2597.40+896.53+163.33+26.00+94.99+28.63+2.00+4.65; // hypotheek, auto, verzekeringen, water, telecom, media, goede doelen, bankkosten
const CASA_LENING = 415.28;
const ENEL_BEDRAG = 61.00;
const IMU_BEDRAG = 166.60;
const ROB_BASIS = 11154.92;
const ROB_MEI = 18991.18;   // incl. vakantiegeld
const ROB_DEC = 26154.23;   // incl. eindejaarsuitkering
const LINDY_BASIS = 2398.03; // SARO, sinds mei 2026
const BELASTING_STRUCTUREEL = 313.00; // voorlopige teruggaaf, maandelijks

function buildForecast(){
  return FORECAST_MONTHS.map(({m,jaar})=>{
    const rob = m==="mei" ? ROB_MEI : (m==="dec" ? ROB_DEC : ROB_BASIS);
    const inkomen = rob + LINDY_BASIS + BELASTING_STRUCTUREEL;
    const energie = ENERGIE_VOORSPELLING[m];
    const bkw = BKW_VAST_EXCL_ENERGIE + energie;
    const enel = ENEL_MAANDEN.has(m) ? ENEL_BEDRAG : 0;
    const imu = IMU_MAANDEN.has(m) ? IMU_BEDRAG : 0;
    const casa = CASA_LENING + enel + imu;
    const netto = inkomen - bkw - casa;
    const bijzonderheden = [];
    if(m==="mei") bijzonderheden.push("Rob: vakantiegeld");
    if(m==="dec") bijzonderheden.push("Rob: eindejaarsuitkering");
    if(enel) bijzonderheden.push("Enel (2-mnd)");
    if(imu) bijzonderheden.push("IMU");
    return {m, jaar, inkomen, bkw, casa, netto, energie, bijzonderheden};
  });
}

function renderBudgetView(){

  const w=900,h=170,pad=10;
  const max = Math.max(...rows.map(r=>r.netto))*1.1;
  const min = Math.min(0, Math.min(...rows.map(r=>r.netto))*1.1);
  const range = max-min;
  const stepX=(w-pad*2)/(rows.length-1);
  const pts = rows.map((r,i)=>{ const x=pad+i*stepX; const y=h-pad-((r.netto-min)/range)*(h-pad*2); return [x,y]; });
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const circles = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#c9a227" stroke="var(--panel)" stroke-width="2"/>`).join('');
  const trendSVG = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="fcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.3"/><stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#fcGrad)"/><path d="${linePath}" fill="none" stroke="#c9a227" stroke-width="2"/>${circles}</svg>`;

  return `
    <div class="hero4">
      <div class="card">
        <div class="card-label">Inkomen (12 mnd)</div>
        <div class="stat-figure pos">${fmt(jaarInkomen)}</div>
        <div class="stat-sub">Rob (LVNL) + Lindy (SARO) + belastingteruggave</div>
      </div>
      <div class="card">
        <div class="card-label">Vast — Bakkersparkweg</div>
        <div class="stat-figure neg">${fmt(-jaarBkw)}</div>
        <div class="stat-sub">incl. energie-voorspelling per maand</div>
      </div>
      <div class="card">
        <div class="card-label">Vast — Casa 3S</div>
        <div class="stat-figure neg">${fmt(-jaarCasa)}</div>
        <div class="stat-sub">lening + Enel (2-mnd) + IMU (mei/nov)</div>
      </div>
      <div class="card">
        <div class="card-label">Netto (12 mnd)</div>
        <div class="stat-figure pos">${fmt(jaarNetto)}</div>
        <div class="stat-sub">na vaste lasten, vóór dagelijkse uitgaven</div>
      </div>
    </div>

    <div class="note-card card">
      Vooruitblik <b>augustus 2026 t/m juli 2027</b>, op basis van de vastgestelde patronen: energie NL per kalendermaand (seizoensgemiddelde uit je eigen sheet), Casa 3S-lening vast, Enel elke 2 maanden, IMU in mei en november.
      <b>Niet meegenomen:</b> dagelijkse ING/AMEX-uitgaven, en alles incidenteel (Reizen, Casa-verbouwing, Kado, belastingafrekeningen) — dat loopt via de spaarrekening, niet via dit maandbudget.
    </div>

    <div class="card trend-card">
      <div class="card-label">Netto per maand — vaste lasten vs. inkomen</div>
      ${trendSVG}
      <div class="trend-labels">${rows.map(r=>`<span>${MAAND_LABEL[r.m]} '${String(r.jaar).slice(2)}</span>`).join('')}</div>
    </div>

    <div class="card ledger-card">
      <div class="card-label"><span>Maandkalender</span></div>
      <ul class="ledger-list">
        <li class="ledger-row" style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;">
          <span style="flex:0 0 70px;">Maand</span><span class="lr-leader" style="border:none;"></span>
          <span style="min-width:95px;text-align:right;">Inkomen</span>
          <span style="min-width:95px;text-align:right;">Bakkersparkweg</span>
          <span style="min-width:85px;text-align:right;">Casa 3S</span>
          <span style="min-width:95px;text-align:right;">Netto</span>
          <span style="flex:0 0 190px;padding-left:10px;">Bijzonderheden</span>
        </li>
        ${rows.map(r=>`<li class="ledger-row">
          <span class="lr-vendor" style="flex:0 0 70px;">${MAAND_LABEL[r.m]} '${String(r.jaar).slice(2)}</span><span class="lr-leader"></span>
          <span class="lr-amt pos-income" style="min-width:95px;">${fmt(r.inkomen)}</span>
          <span class="lr-amt" style="min-width:95px;">${fmt(-r.bkw)}</span>
          <span class="lr-amt" style="min-width:85px;">${fmt(-r.casa)}</span>
          <span class="lr-amt pos-income" style="min-width:95px;">${fmt(r.netto)}</span>
          <span style="flex:0 0 190px;padding-left:10px;font-size:11.5px;color:var(--muted);">${r.bijzonderheden.join(', ')}</span>
        </li>`).join('')}
      </ul>
    </div>
    <footer>Energie NL is een seizoensgemiddelde uit jouw eigen Energie-sheet (2024/2025/2026) — bij de echte factuur bijstellen. Enel-maanden (elke 2 mnd) zijn gebaseerd op het waargenomen patroon okt/dec/feb/apr/jun; kan iets schuiven. IMU is verplaatst naar mei en november op jouw verzoek (ruim op tijd betalen).</footer>
  `;
}

function vendorKey(vendor){
  let v = vendor.toLowerCase();
  v = v.replace(/\d+/g, ' ');
  v = v.replace(/\b(nld|deu|gbr|usa|hrv|svn|aut|tur|tha|irl|cyp|ita)\b/g, ' ');
  v = v.replace(/\b(b\.?v\.?|n\.?v\.?|via [a-z]+)\b/g, ' ');
  v = v.replace(/[^a-z\s]/g, ' ');
  v = v.replace(/\s+/g, ' ').trim();
  return v.split(' ').filter(Boolean).slice(0, 2).join(' ');
}

  if(categoryOverrides[key]) return categoryOverrides[key]; // uitzondering voor deze ene transactie wint altijd
  const vk = vendorOverrides[vendorKey(t.vendor)];
  if(vk) return vk; // geleerde regel voor deze leverancier, geldt voor alle (ook toekomstige) transacties
  return t.category;
}
function autoDetectReis(t){
  if(t.category!=='Reizen' && t.category!=='__SPAREN_NAAR_REIZEN__') return null;
  const v = t.vendor.toLowerCase();
  for(const [id, kws] of Object.entries(REIZEN_KEYWORDS)){
    if(kws.some(k=>{
      const esc = k.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      return new RegExp('(?:^|[^a-z0-9])'+esc+'(?:$|[^a-z0-9])','i').test(v);
    })) return id;
  }
  return null;
}
function effectiveReis(t){
  const key = txKey(t);
  if(key in reisOverrides) return reisOverrides[key] || null; // '' betekent: handmatig losgekoppeld

}

}

  OVERRIDES_FALLBACK.forEach(r=>{

    else if(r.kind==='reis') reisOverrides[r.key] = r.value;

  });

async function loadOverrides(){
  applyOverridesFallback(); // altijd eerst toepassen — werkt dus ook lokaal/offline geopend
  try{
    const res = await fetch(SUPABASE_URL+'/rest/v1/overrides?select=key,kind,value', {headers: SUPABASE_HEADERS});
    if(res.ok){
      const rows = await res.json();
      rows.forEach(r=>{
        if(r.kind==='category') categoryOverrides[r.key] = r.value;
        else if(r.kind==='reis') reisOverrides[r.key] = r.value;
        else if(r.kind==='vendor') vendorOverrides[r.key] = r.value;
        else if(r.kind==='bucket') bucketOverrides[r.key] = r.value;
      });
      overridesSource = 'live';
    }
  }catch(e){ /* geen verbinding met Supabase — de fallback-snapshot hierboven blijft actief */ }
  overridesLoaded = true;
  render();
}
async function saveOverrideRow(kind, key, value){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/overrides?on_conflict=kind,key', {
      method: 'POST',
      headers: {...SUPABASE_HEADERS, 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify([{key, kind, value}])
    });
  }catch(e){ /* offline: verandering blijft lokaal staan tot volgende succesvolle save */ }
}
async function deleteOverrideRow(kind, key){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/overrides?kind=eq.'+encodeURIComponent(kind)+'&key=eq.'+encodeURIComponent(key), {
      method: 'DELETE', headers: SUPABASE_HEADERS
    });
  }catch(e){}
}
function exportOverrides(){
  const payload = {categorieën: categoryOverrides, reizen: reisOverrides, leveranciers: vendorOverrides, buckets: bucketOverrides};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'aanpassingen.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importOverrides(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const imported = JSON.parse(e.target.result);
      let n = 0;
      let cat = {}, reis = {}, vend = {}, buck = {};
      if(imported.categorieën || imported.reizen || imported.leveranciers || imported.buckets){
        cat = imported.categorieën||{};
        reis = imported.reizen||{};
        vend = imported.leveranciers||{};
        buck = imported.buckets||{};
      } else {
        cat = imported; // oud exportformaat: platte categorie-aanpassingen
      }
      categoryOverrides = {...categoryOverrides, ...cat};
      reisOverrides = {...reisOverrides, ...reis};
      vendorOverrides = {...vendorOverrides, ...vend};
      bucketOverrides = {...bucketOverrides, ...buck};
      n = Object.keys(cat).length + Object.keys(reis).length + Object.keys(vend).length + Object.keys(buck).length;
      Object.entries(cat).forEach(([k,v])=>saveOverrideRow('category', k, v));
      Object.entries(reis).forEach(([k,v])=>saveOverrideRow('reis', k, v));
      Object.entries(vend).forEach(([k,v])=>saveOverrideRow('vendor', k, v));
      Object.entries(buck).forEach(([k,v])=>saveOverrideRow('bucket', k, v));
      render();
      alert('Aanpassingen geïmporteerd en gesynchroniseerd: ' + n + ' regels.');
    }catch(err){
      alert('Kon het bestand niet lezen — is het een geldige export?');
    }
  };
  reader.readAsText(file);
}
async function setOverrideByKey(key, newCat){
  if(newCat && newCat.trim()){
    categoryOverrides[key] = newCat.trim();
    saveOverrideRow('category', key, categoryOverrides[key]);
    // Leer meteen ook de leverancier-regel, zodat toekomstige (en al geladen) transacties van dezelfde leverancier hetzelfde meekrijgen.
    const vendorNaam = key.split('|')[1] || '';
    const vk = vendorKey(vendorNaam);
    if(vk){
      vendorOverrides[vk] = newCat.trim();
      saveOverrideRow('vendor', vk, newCat.trim());
    }
  } else {
    delete categoryOverrides[key];
    deleteOverrideRow('category', key);
  }
  render();
}
async function setReisOverrideByKey(key, newReis){
  if(newReis === '__AUTO__'){
    delete reisOverrides[key]; // terug naar automatische herkenning
    deleteOverrideRow('reis', key);
  } else {
    reisOverrides[key] = newReis; // '' = expliciet "geen reis"
    saveOverrideRow('reis', key, newReis);
  }
  render();
}
async function setBucketOverrideByKey(key, newBucket){
  if(newBucket === '__AUTO__'){
    delete bucketOverrides[key]; // terug naar automatisch (op basis van categorie)
    deleteOverrideRow('bucket', key);
  } else {
    bucketOverrides[key] = newBucket;
    saveOverrideRow('bucket', key, newBucket);
  }
  render();
}

function buildCombinedJul(){
  const rabo = RABO_TX_JUL.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'RABO'}));
  const ing = ING_TX_JUL.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'ING'}));
  const amex = AMEX_TX_JUL.map(r=>{ const neg = {...r, amount:-r.amount}; return {...neg, category: effectiveCategory(neg), _orig: neg, source:'AMEX'}; });
  const ingcc = INGCC_TX_JUL.map(r=>({...r, category: effectiveCategory(r), _orig: r, source:'ING CC'}));
  return [...rabo, ...ing, ...amex, ...ingcc];
}

    const isIncomeLike = (expandKey==='inkomen'||expandKey==='sparen');
    const toonBolletjes = (expandKey==='vast'||expandKey==='dagelijks');
    const barHtml = renderBarList(donut.sorted, donut.total, {
      showDot: toonBolletjes,
      budgetFor: (name)=> toonBolletjes ? budgetMap[name] : null,
      formatAmt: (val)=> fmt(isIncomeLike?val:-val),
      rowAttrs: (name)=>{ const catKey=expandKey+'|'+name; return ` data-cat-toggle="${catKey}" style="cursor:pointer;${categoryExpand===catKey?'font-weight:600;':''}"`; },
      indicator: (name)=>{ const catKey=expandKey+'|'+name; return categoryExpand===catKey?' ▾':''; },
      detailFor: (name)=>{
        const catKey = expandKey+'|'+name;
        if(categoryExpand!==catKey) return '';
        const matching = (expandKey==='sparen') ? rows.slice() : rows.filter(r=>r.category===name);
        matching.sort((a,b)=>b.date.localeCompare(a.date));
        const catTotal = matching.reduce((s,r)=>s+r.amount,0);
        const displayTotal = isIncomeLike ? Math.abs(catTotal) : -Math.abs(catTotal);
        const budget = toonBolletjes ? budgetMap[name] : null;
        const overBudget = budget!=null && Math.abs(catTotal) > budget;
        const budgetKleur = budget!=null ? (overBudget?'var(--dot-over)':'var(--dot-ok)') : 'var(--muted)';
        const geselecteerdInDezeTegel = toonBolletjes ? matching.filter(r=>bucketSelection.has(txKey(r))).length : 0;
        const targetBucket = (expandKey==='vast') ? 'dagelijks' : 'vast';
        const verplaatsKnop = geselecteerdInDezeTegel>0 ? `
          <div class="cdt-divider"></div>
          <button data-move-bucket="${targetBucket}" style="width:100%;background:var(--rule);border:none;color:var(--paper);border-radius:6px;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;">
            Verplaats ${geselecteerdInDezeTegel} geselecteerde${geselecteerdInDezeTegel===1?'':'n'} naar ${targetBucket}
          </button>` : '';
        return `<div class="cat-detail-tile">
          <div class="cdt-total">${fmt(displayTotal)}</div>
          <div class="cdt-budget" style="color:${budgetKleur};">${budget!=null ? 'begroot '+fmt(budget).replace('€','€ ') : 'geen budget bekend'}</div>
          <div class="cdt-divider"></div>
          <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">${matching.map(t=>txRow2Html(t, {showBucketToggle: toonBolletjes})).join('')}</ul>
          ${verplaatsKnop}
        </div>`;
      },
    });
    const detail = isOpen ? `<div class="card" style="grid-column: 1 / -1;">
      <div class="card-label">${label} — samenstelling</div>
      <div class="bar-total"><span>Totaal</span><b>${fmt(isIncomeLike?donut.total:-donut.total).replace('€','€ ')}</b></div>
      ${barHtml}
    </div>` : '';
    const actueelVoorBudget = rows.reduce((s,r)=>s+Math.abs(r.amount),0);
    const budgetRegel = budgetInfo ? (()=>{
      const over = actueelVoorBudget > budgetInfo.totaal;
      const kleur = over ? 'var(--dot-over)' : 'var(--dot-ok)';
      const label2 = budgetInfo.volledig ? 'begroot' : 'begroot/voorspeld';
      return `<div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:${kleur};margin-top:2px;">${label2} ${fmt(budgetInfo.totaal).replace('€','€ ')}</div>`;
    })() : '';
    return `<div class="card" data-expand="${expandKey}" style="cursor:pointer;">
        <div class="card-label">${label}${isOpen?' ▾':' ▸'}</div>
        <div class="stat-figure ${cls}">${bedrag}</div>
        <div class="stat-sub">${sub}</div>
        ${budgetRegel}
      </div>${detail}`;
  }

  return `
    <div class="note-card card">
      <b>25 juni – 24 juli 2026</b> — dag 22 van 30. Werkelijke cijfers Rabo, ING én AMEX t/m 21 juli.
      Het salaris dat deze periode financiert, viel al op <b>24 juni</b>.
      <br><br><b>Let op — boekhouding vs. echt saldo:</b> AMEX-uitgaven staan hier al toegerekend, maar worden pas rond <b>5 augustus</b> van ING afgeschreven. Je actuele ING-saldo ligt tot die tijd dus hoger dan dit overzicht suggereert. Zodra jij de AMEX-maandafrekening deelt (die wordt al enkele dagen vóór de afschrijfdatum opgemaakt), weten we het exacte bedrag en dus meteen het restant — daar hoeft niet voor gewacht te worden tot de afschrijving zelf plaatsvindt.
      <br><br><i>Tik op een tegel voor de samenstelling — nog een keer tikken klapt 'm weer dicht.</i>
    </div>
    <div class="card" style="${restNaarIng>=0?'border-color:var(--dot-ok);':'border-color:var(--dot-over);'}">
      <div class="card-label">Na salaris: Rabo → ING</div>
      <div class="stat-figure" style="color:${restNaarIng>=0?'var(--dot-ok)':'var(--dot-over)'};">${fmt(restNaarIng)}</div>
      <div class="stat-sub">over te maken naar ING (dekt ING-vaste lasten + dagelijks)</div>
      <div class="cdt-divider"></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;">
        <div style="display:flex;justify-content:space-between;"><span>Salaris/inkomen (Rabo)</span><span style="color:var(--paper);">${fmt(inkomenRabo)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Blijft in Rabo — vaste lasten</span><span style="color:var(--paper);">${fmt(vasteLastenRabo)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Naar sparen (vast doel)</span><span style="color:var(--paper);">${fmt(-SPAREN_VAST_DOEL)}</span></div>
        <div style="display:flex;justify-content:space-between;border-top:1px dashed var(--rule);padding-top:4px;margin-top:2px;"><span>Rest → ING</span><span style="color:${restNaarIng>=0?'var(--dot-ok)':'var(--dot-over)'};font-weight:600;">${fmt(restNaarIng)}</span></div>
      </div>
      <div class="stat-sub" style="margin-top:10px;color:var(--muted);font-size:11px;">Ter controle: ING zelf staat deze periode tot nu toe op ${ingTekort>0?'een tekort van '+fmt(-ingTekort).replace('-',''):(ingOverschot>0?'een overschot van '+fmt(ingOverschot):'precies in balans')} t.o.v. wat er al binnen/uit is — verschil met bovenstaand "rest" komt doordat dit de tot-nu-toe-stand is, niet de volledige maand vooruit (incl. nog te reserveren AMEX-afschrijving ~5 augustus).</div>
    </div>
    <div class="hero4">
      ${accordionTile('Inkomen', fmt(incomeTotal), 'Salaris (24 juni) + belastingteruggave + vergoeding', 'inkomen', 'pos', incomeDonut, income)}
      ${accordionTile('Vaste lasten', fmt(vastTotaal), 'incl. Casa 3S (structureel)', 'vast', 'neg', vastDonut, vast, vastBudget)}
      ${accordionTile('Dagelijks', fmt(dagelijksTotaal), 'excl. reizen &amp; Casa 3S-project', 'dagelijks', 'neg', dagDonut, dagelijks, dagelijksBudget)}
      ${accordionTile('Sparen', fmt(sparenStructureel), 'vast doel: Rob + Lindy + deurwaarder (nu €0)', 'sparen', 'pos', sparenDonut, sparenRegels)}
      <div class="card">
        <div class="card-label">Blijft over</div>
        <div class="stat-figure ${netto>=0?'pos':'neg'}">${fmt(netto)}</div>
        <div class="stat-sub">${netto>=0 ? 'kan extra naar sparen' : 'moet van spaargeld naar ING'}</div>
      </div>
      <div class="card" data-filter-cat="Belastingafrekening" style="cursor:pointer;">
        <div class="card-label">Belastingafrekening (uit sparen)</div>
        <div class="stat-figure neg">${fmt(belastingafrekeningTotaal)}</div>
        <div class="stat-sub">IB-afrekening 2025 — telt niet mee in vast/dagelijks/netto</div>
      </div>
    </div>
    <div class="note-card card">
      <b>Blijft over</b> = inkomen min het vaste spaardoel (Rob €2.000 + Lindy €2.398,03 + deurwaarder €0) min vaste lasten min dagelijkse uitgaven — dus ná de vaste sparen-afdracht. Positief: dat kan er nog eens extra bij naar sparen. Negatief: dat tekort moet vanuit spaargeld naar ING bijgevuld worden. Reizen, Casa 3S-project en de belastingafrekening 2025 staan er los van — allemaal gefinancierd uit spaargeld, niet uit het lopende budget.
    </div>
    <div class="card ledger-card">
      <div class="card-label"><span>Alle transacties — 25 juni t/m 21 juli</span><span class="ledger-count">${ledgerRows.length} regels</span></div>
      ${filterChip}
      <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
        ${ledgerRows.map(t=>txRow2Html(t)).join('')}
      </ul>
    </div>
    <footer>Categorieën zijn aanpasbaar — tik op het dropdown-vakje bij een transactie. Wijzigingen blijven bewaard voor volgend bezoek.</footer>
  `;
}

const srcColorReis = {RABO:'var(--brass)', ING:'var(--teal)', AMEX:'var(--rose)', 'ING CC':'var(--ingcc)'};

function reisSelectHtml(t, currentRid){
  const key = txKey(t._orig);
  const txKeyAttr = key.replace(/"/g,'&quot;');
  let selectedValue;
  if(currentRid !== null){
    selectedValue = currentRid; // al resolved doorgegeven (toegewezen aan een reis)
  } else if(key in reisOverrides){
    selectedValue = reisOverrides[key] || ''; // echte opgeslagen waarde tonen; '' = expliciet geen reis
  } else {
    selectedValue = '__AUTO__';
  }
  const bg = (selectedValue && selectedValue!=='__AUTO__') ? 'var(--brass)' : 'var(--rose)';
  const options = [
    `<option value="__AUTO__" ${selectedValue==='__AUTO__'?'selected':''}>— automatisch —</option>`,
    `<option value="" ${selectedValue===''?'selected':''}>— geen reis —</option>`
  ];
  REIZEN_PLANNING.forEach(p=>{
    options.push(`<option value="${p.id}" ${selectedValue===p.id?'selected':''}>${p.jaar} · ${p.naam} (${p.timing})</option>`);
  });
  return `<select class="lr-tag-select" data-edit-reis="${txKeyAttr}" style="background:${bg};">${options.join('')}</select>`;
}

function reisLedgerRow(t, currentRid){
  const d=new Date(t.date); const dd=String(d.getUTCDate()).padStart(2,'0'); const mm=String(d.getUTCMonth()+1).padStart(2,'0');
  const txKeyAttr = txKey(t).replace(/"/g,'&quot;');
  const overridden = categoryOverrides[txKey(t)] ? ' title="handmatig aangepast"' : '';
  return `<li class="tx-row2">
    <div class="tx-row2-meta">
      <span>${dd}-${mm}</span>
      ${reisSelectHtml(t, currentRid)}
      <select data-edit-cat="${txKeyAttr}" style="background:${CATEGORY_COLORS[t.category]||'var(--c-overig)'};"${overridden}>
        ${ALLE_CATEGORIEEN.map(c=>`<option value="${c}" ${c===t.category?'selected':''}>${c}</option>`).join('')}
      </select>
      <span style="color:${srcColorReis[t.source]};">${t.source}</span>
    </div>
    <div class="tx-row2-content">
      <span class="tx-row2-vendor">${t.vendor}</span>
      <span class="tx-row2-amt" style="color:var(--paper);">${fmt(t.amount)}</span>
    </div>
  </li>`;
}

function renderReisDetailCard(p, data, sparenActies){
  sparenActies = sparenActies || [];
  const gespaard = p.potje ? (SPAAR_POTJES[p.potje]||0) : 0;
  const uitgegeven = data.uitgegeven; // al negatief
  const restBudget = p.budget!=null ? p.budget + uitgegeven + (p.borg ? p.borg.bedrag : 0) : null;
  const sparenTotaal = sparenActies.reduce((s,r)=>s+r.amount,0);

  const budgetOpen = reisTileExpand===(p.id+'|budget');
  const gespaardOpen = reisTileExpand===(p.id+'|gespaard');
  const uitgegevenOpen = reisTileExpand===(p.id+'|uitgegeven');

  const budgetDetail = budgetOpen ? `<div class="cat-detail-tile" style="grid-column:1/-1;">
    ${p.handmatig ? `<div class="cdt-budget" style="color:var(--muted);">eigen begroting (${p.handmatig.bron}): betaald ${fmt(p.handmatig.betaald)} · nog te betalen ${fmt(p.handmatig.saldo)}</div>` : `<div class="cdt-budget" style="color:var(--muted);">vastgesteld richtbedrag, geen verdere onderverdeling bekend</div>`}
  </div>` : '';

  const gespaardDetail = gespaardOpen ? `<div class="cat-detail-tile" style="grid-column:1/-1;">
    ${sparenActies.length ? `<ul class="ledger-list" style="list-style:none;margin:0;padding:0;">${sparenActies.map(t=>txRow2Html(t)).join('')}</ul>` : `<div style="color:var(--muted);font-size:12px;">Geen aparte spaaracties gevonden voor deze reis (mogelijk gefinancierd uit een al bestaand potje).</div>`}
  </div>` : '';

  const uitgegevenDetail = uitgegevenOpen ? `<div class="cat-detail-tile" style="grid-column:1/-1;">
    <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">${data.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>txRow2Html(t)).join('')}</ul>
  </div>` : '';

  return `
    <div class="hero4">
      <div class="card" data-reis-tile-toggle="${p.id}|budget" style="cursor:pointer;">
        <div class="card-label">Budget${budgetOpen?' ▾':' ▸'}</div>
        <div class="stat-figure pos">${p.budget!=null?fmt(p.budget):'n.t.b.'}</div>
        <div class="stat-sub">vastgesteld richtbedrag</div>
      </div>
      ${budgetDetail}
      <div class="card" data-reis-tile-toggle="${p.id}|gespaard" style="cursor:pointer;">
        <div class="card-label">Gespaard (potje)${gespaardOpen?' ▾':' ▸'}</div>
        <div class="stat-figure pos">${fmt(gespaard)}</div>
        <div class="stat-sub">${p.potje || 'nog geen eigen potje'}${gespaard===0 && p.budget>0 ? ' — leeg, verplaatst naar rekening' : ''}</div>
      </div>
      ${gespaardDetail}
      <div class="card" data-reis-tile-toggle="${p.id}|uitgegeven" style="cursor:pointer;">
        <div class="card-label">Uitgegeven tot nu toe${uitgegevenOpen?' ▾':' ▸'}</div>
        <div class="stat-figure neg">${fmt(uitgegeven)}</div>
        <div class="stat-sub">${data.tx.length} transactie${data.tx.length===1?'':'s'}, via rekening (excl. nog te verwerken AMEX/creditcard)</div>
      </div>
      ${uitgegevenDetail}
      <div class="card">
        <div class="card-label">Rest van budget</div>
        <div class="stat-figure ${restBudget==null?'':(restBudget>=0?'pos':'neg')}">${restBudget!=null?fmt(restBudget):'—'}</div>
        <div class="stat-sub">${restBudget==null?'geen budget bekend':(restBudget>=0?'nog beschikbaar binnen het budget':'budget al overschreden')}</div>
      </div>
    </div>
    ${p.borg ? `<div class="note-card card" style="margin-bottom:12px;">
      <span style="color:var(--muted);font-size:12px;">🔒 <b>Bevat nog ${fmt(p.borg.bedrag)} borg (${p.borg.vendor})</b> die na afloop terugkomt — "Rest van budget" hierboven is hier al voor gecorrigeerd (dus dat is je écht besteedbare bedrag). Alleen je bankrekening klopt tijdelijk niet 1-op-1 hiermee, tot de borg terug is.</span>
    </div>` : ''}
    ${p.opmerking ? `<div class="note-card card" style="margin-bottom:12px;"><span style="color:var(--muted);font-size:12px;">${p.opmerking}</span></div>` : ''}
  `;
}

function renderReizenView(){
  const all = buildCombinedJul();
  const reizenSpend = all.filter(r=>r.category==='Reizen');

  const perReis = {};
  REIZEN_PLANNING.forEach(p=>{ perReis[p.id] = {uitgegeven:0, tx:[]}; });
  const nietToegewezen = [];
  reizenSpend.forEach(t=>{
    const rid = effectiveReis(t);
    if(rid && perReis[rid]){ perReis[rid].uitgegeven += t.amount; perReis[rid].tx.push(t); }
    else if(t.date >= '2026-06-01'){ nietToegewezen.push(t); } // ouder, ongematcht = geschiedenis zonder functie, niet tonen
  });
  nietToegewezen.sort((a,b)=>b.date.localeCompare(a.date));

  const reizenSparen = all.filter(r=>r.category==='__SPAREN_NAAR_REIZEN__');
  const perReisSparen = {};
  REIZEN_PLANNING.forEach(p=>{ perReisSparen[p.id] = []; });
  const sparenNietToegewezen = [];
  reizenSparen.forEach(t=>{
    const rid = effectiveReis(t);
    if(rid && perReisSparen[rid]) perReisSparen[rid].push(t);
    else sparenNietToegewezen.push(t);
  });

  const alleToegewezen = REIZEN_PLANNING.flatMap(p=>perReis[p.id].tx);
  const alleReisTx = [...alleToegewezen, ...nietToegewezen].sort((a,b)=>b.date.localeCompare(a.date));

  const jaren = [...new Set(REIZEN_PLANNING.map(p=>p.jaar))];
  const lopendeReizen = REIZEN_PLANNING.filter(p=>p.status==='lopend' || p.status==='planning');

  const reisFilterActief = selectedFilter && selectedFilter.type==='reis';
  const gefilterdeReis = reisFilterActief ? REIZEN_PLANNING.find(p=>p.id===selectedFilter.value) : null;
  const filterChip = reisFilterActief ? `
    <div style="display:flex;align-items:center;gap:8px;margin:-6px 0 14px;">

      <span class="lr-tag" style="background:var(--brass);">${gefilterdeReis?gefilterdeReis.jaar+' · '+gefilterdeReis.naam:selectedFilter.value}</span>

  return `

      <br><br><i>Transacties worden automatisch aan een reis gekoppeld op trefwoord in de omschrijving (bv. "Ravello" → Italië). Klopt dat niet — zoals koffie op Schiphol — wijs de reis dan hieronder handmatig toe via de dropdown. Tik op een reis-tegel om 'm open te klappen; tik nog een keer om 'm weer dicht te klappen.</i>
    </div>

    ${(() => {
      const open = reisTileExpand==='nietToegewezen';
      const totaalNT = nietToegewezen.reduce((s,r)=>s+r.amount,0);
      return `
      <div class="card" data-reis-tile-toggle="nietToegewezen" style="cursor:pointer;margin-bottom:12px;">
        <div class="card-label">Verwerken — nog te plaatsen${open?' ▾':' ▸'}</div>
        <div class="stat-figure neg">${fmt(totaalNT)}</div>
        <div class="stat-sub">${nietToegewezen.length} transactie${nietToegewezen.length===1?'':'s'} — geen geplande reis herkend, tik om toe te wijzen</div>
        ${open ? `<div class="cat-detail-tile" style="margin-top:14px;">
          <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
            ${nietToegewezen.map(t=>reisLedgerRow(t, null)).join('')}

    })()}

    ${lopendeReizen.map(p=>{
      const isOpen = reisTripExpand===p.id;
      const tile = `<div class="card" data-reis-trip-toggle="${p.id}" style="cursor:pointer;margin-bottom:${isOpen?'12px':'12px'};">
        <div class="card-label">${p.jaar}</div>

    <div class="card">

      ${jaren.map(j=>`

function reisMomentenLijst(){
  return REIZEN_PLANNING.filter(t=>t.jaar>=2026).map(t=>({type:'reis', label:t.naam+(t.timing?' ('+t.timing+')':''), jaar:String(t.jaar), bedrag:-t.budget}));
}
const MAAND_NAMEN_NL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function timingNaarMaandNummer(timing){
  const t = (timing||'').toLowerCase();
  if(t.includes('zomer')) return 8;
  if(t.includes('kerst')) return 12;
  if(t.includes('lente')) return 4;
  if(t.includes('winter')) return 1;
  for(let i=0;i<12;i++){ if(t.includes(MAAND_NAMEN_NL[i].slice(0,3))) return i+1; }
  return 8; // fallback: zomer/augustus
}
function maandVerschuiven(jaar, maandNum, delta){
  let m = maandNum-1+delta, y = jaar;
  while(m<0){ m+=12; y--; } while(m>11){ m-=12; y++; }
  return {jaar:y, label:MAAND_NAMEN_NL[m]+' '+y};
}
function reisBetalingenPerMaand(){
  // per reis: half jaar ervoor wordt de pot gevuld en gelijk de helft van het budget echt uitgegeven (eerste kosten), de rest de maand voor de reismaand
  // Thailand 2026 loopt al (al correct/geboekt) — die laten we hier buiten beschouwing
  const map = new Map(); // key "maandnaam jaar" -> [{naam,bedrag}]
  REIZEN_PLANNING.filter(t=>t.jaar>=2026 && t.id!=='thailand-2026').forEach(t=>{
    const maandNum = timingNaarMaandNummer(t.timing);
    const helft = -(t.budget/2);
    const m6 = maandVerschuiven(t.jaar, maandNum, -6);
    const m1 = maandVerschuiven(t.jaar, maandNum, -1);
    [{...m6, fase:'aanbetaling'}, {...m1, fase:'restbetaling'}].forEach(pt=>{
      if(!map.has(pt.label)) map.set(pt.label, []);
      map.get(pt.label).push({naam:t.naam+' — '+pt.fase, bedrag:helft});
    });
  });
  return map;
}
function renderVermogenChart(series, idLabel){
  const w=900,h=200,pad=10;
  const n = series.length;
  const max = Math.max(...series)*1.05;
  const min = Math.min(0, Math.min(...series)*1.05);
  const stepX = (w-pad*2)/(n-1);
  const pts = series.map((v,i)=>{ const x=pad+i*stepX; const y=h-pad-((v-min)/(max-min||1))*(h-pad*2); return [x,y]; });
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[n-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const zeroY = h-pad-((0-min)/(max-min||1))*(h-pad*2);
  const zeroLine = (min<0) ? `<line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${idLabel}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.3"/><stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#${idLabel})"/>${zeroLine}<path d="${linePath}" fill="none" stroke="#c9a227" stroke-width="2"/></svg>`;
}

function renderVermogenIkv(){
  const periodesData = IKV_JAREN.slice(2); // juli 2027 t/m juli 2035 — juli2025/2026 (oude aanloop) laten we los
  const reisBetalingen = reisBetalingenPerMaand();
  // Rob's precieze salarismotor (zelfde als de Salaris-tegel) — gebruikt als correctie bovenop de oudere IKV-aannames,
  // additief en zichtbaar in de opbouw, zodat 'm nooit stilzwijgend in de Overig/afronding-plug verdwijnt.
  const robPeriodesNieuw = berekenSalarisPeriodes(2035);
  const robJarenNieuw = salarisJaarOverzicht(2035);
  const robNettoOp = (datum)=>{ const p = robPeriodesNieuw.filter(x=>x.vanaf<=datum).slice(-1)[0]; return p ? p.netto : null; };
  const robJaarNieuw = (jaar)=> robJarenNieuw.find(y=>y.jaar===jaar);
  let saldo = VERMOGEN_NU_BEDRAG;
  const alleMaanden = [];
  periodesData.forEach((j,idx)=>{
    const prev = IKV_JAREN[idx+1]; // periode ervoor (voor de "oude tarieven" aug-dec, cao gaat pas in per januari)
    const baselineVan = (jr)=> (vermogenAflos==='ja') ? (jr.totaalAflos!=null?jr.totaalAflos:jr.totaal) : jr.totaal;
    const baselineOud = baselineVan(prev);
    const baselineNieuw = baselineVan(j);
    const maandVoordeel = (j.totaalAflos!=null) ? (j.totaalAflos-j.totaal)*12 : 0;
    // reizen halen we niet meer uit de IKV-cijfers (die staan al in de Reizen-tab/Bijzondere posten) — dus het eigen reisbudget van de IKV-sheet rekenen we hier terug de pot in
    const restZonderReis = j.restJaarSaldo - (j.reisSpaardoel||0);
    const delta = (vermogenAflos==='ja') ? restZonderReis : (restZonderReis-(j.aflosHyp||0)-maandVoordeel);
    const maandBuffer = (j.extraUitgBasis||0)/12; // bv. -1.000/mnd — ruimte voor incidentele grote aankopen
    const named = [];
    if(j.italieEenmalig) named.push({naam:'Casa 3S — eenmalig', bedrag:j.italieEenmalig});
    if(vermogenAflos==='ja' && j.aflosHyp) named.push({naam:'Aflossing hypotheek', bedrag:j.aflosHyp});
    if(j.extraBijzInk) named.push({naam:'Bijzondere inkomst', bedrag:j.extraBijzInk});
    if(j.extraLindy) named.push({naam:'Extra Lindy', bedrag:j.extraLindy});
    const namedSum = named.reduce((a,b)=>a+b.bedrag,0);
    // som van 12 maandbaselines: aug-dec (5 mnd) op oud tarief, jan-jul (7 mnd) op nieuw tarief — cao gaat in per januari
    const somBaselines = baselineOud*5 + baselineNieuw*7 + maandBuffer*12;
    const overig = delta - somBaselines - namedSum;
    if(Math.abs(overig)>1) named.push({naam:'Overig/afronding', bedrag:overig});
    const eindJaarNum = parseInt(j.jaar.match(/\d{4}/)[0],10);
    const labels = maandenVoorPeriode(eindJaarNum);
    // Rob-salaris-correctie: verschil tussen het precieze model (Salaris-tegel) en de oudere inkLVNL-aanname in IKV_JAREN,
    // apart berekend voor de aug-dec-helft (oud tarief) en jan-jul-helft (nieuw tarief) van dit IKV-jaar.
    // vanaf pensionering (ROB_PENSIOEN_JAAR) is inkLVNL geen salaris meer maar ABP/AOW — dat blijft ongemoeid.
    // in het pensioenjaar zelf is aug-dec (oud tarief) nog gewoon salaris, jan-jul (nieuw tarief) is al pensioen.
    // exacte pensioenmaand nog te bevestigen door Rob (nu aangenomen: overgang per 1 januari).
    const robNettoOud = ((eindJaarNum-1) < ROB_PENSIOEN_JAAR) ? robNettoOp((eindJaarNum-1)+'-07-01') : null;
    const robNettoNieuw = (eindJaarNum < ROB_PENSIOEN_JAAR) ? robNettoOp(eindJaarNum+'-01-01') : null;
    const robDeltaOud = (robNettoOud!=null) ? robNettoOud - (prev.inkLVNL||0) : 0;
    const robDeltaNieuw = (robNettoNieuw!=null) ? robNettoNieuw - (j.inkLVNL||0) : 0;
    for(let m=0;m<12;m++){
      const nieuwTarief = m>=5; // index 0-4 = aug-dec (oud tarief), 5-11 = jan-jul (nieuw tarief per cao-datum)
      const bron = nieuwTarief ? j : prev;
      const baseline = nieuwTarief ? baselineNieuw : baselineOud;
      const robDelta = nieuwTarief ? robDeltaNieuw : robDeltaOud;
      const label = labels[m];
      const reisPosten = reisBetalingen.get(label) || [];
      const reisTotaal = reisPosten.reduce((a,b)=>a+b.bedrag,0);
      const eenmaligPosten = VERMOGEN_EENMALIGE_POSTEN[label] || [];
      const eenmaligTotaal = eenmaligPosten.reduce((a,b)=>a+b.bedrag,0);
      const bonusPosten = IKV_SALARIS_BONUSSEN[label] || [];
      const bonusTotaal = bonusPosten.reduce((a,b)=>a+b.bedrag,0);
      // vakantiegeld/13e maand-correctie t.o.v. het precieze model, zelfde principe als robDelta hierboven — niet meer na pensionering
      let bonusCorrectie = 0; const bonusCorrectiePosten = [];
      const maandNaam = label.split(' ')[0];
      if(eindJaarNum < ROB_PENSIOEN_JAAR && maandNaam==='juni'){
        const rj = robJaarNieuw(eindJaarNum);
        const oudVak = (bonusPosten.find(p=>p.naam==='Vakantiegeld')||{}).bedrag || 0;
        if(rj){ bonusCorrectie = rj.vakantiegeld - oudVak; bonusCorrectiePosten.push({naam:'Vakantiegeld — herrekend (nieuw model)', bedrag:bonusCorrectie}); }
      } else if(eindJaarNum < ROB_PENSIOEN_JAAR && maandNaam==='januari'){
        const rj = robJaarNieuw(eindJaarNum-1); // mijn model kent 13e maand toe aan december vorig jaar, oude tabel aan januari dit jaar
        const oud13e = (bonusPosten.find(p=>p.naam==='13e maand')||{}).bedrag || 0;
        if(rj){ bonusCorrectie = rj.dertiende - oud13e; bonusCorrectiePosten.push({naam:'13e maand — herrekend (nieuw model)', bedrag:bonusCorrectie}); }
      }
      saldo += baseline + maandBuffer + reisTotaal + eenmaligTotaal + bonusTotaal + robDelta + bonusCorrectie + (m===11 ? namedSum+overig : 0);
      const breakdown = [{naam:'Inkomsten (Rob)', bedrag:bron.inkLVNL||0}, {naam:'Rob (extra)', bedrag:bron.rob||0}, {naam:'Lindy', bedrag:bron.lindy||0}, {naam:'Deurwaarder', bedrag:bron.heks||0}, {naam:'Lasten', bedrag:bron.uitgaven||0}, {naam:'Buffer extra uitgaven (max €1.000/mnd)', bedrag:maandBuffer}, ...reisPosten, ...eenmaligPosten, ...bonusPosten];
      if(robDelta) breakdown.push({naam:'Rob salaris — herrekend (nieuw model)', bedrag:robDelta});
      breakdown.push(...bonusCorrectiePosten);
      if(m===11) breakdown.push(...named);
      const jaarVanMaand = parseInt(label.match(/\d{4}/)[0],10);
      alleMaanden.push({label, jaar:jaarVanMaand, waarde:saldo, breakdown});
    }
  });

  // hergroeperen op kalenderjaar (i.p.v. juli-juli), zodat de tegels aansluiten op Nominaal
  const periodesMap = new Map();
  alleMaanden.forEach(mo=>{
    if(!periodesMap.has(mo.jaar)) periodesMap.set(mo.jaar, []);
    periodesMap.get(mo.jaar).push(mo);
  });
  const periodes = [...periodesMap.entries()].map(([jaar,maanden])=>({jaarLabel:String(jaar), saldoEind:maanden[maanden.length-1].waarde, maanden}));

  const chartSerie = [VERMOGEN_NU_BEDRAG, ...alleMaanden.map(m=>m.waarde)];

  const c3sMomenten = [];
  Object.entries(VERMOGEN_EENMALIGE_POSTEN).forEach(([label,posten])=>{
    posten.forEach(p=>c3sMomenten.push({type:'c3s', label:p.naam, jaar:label, bedrag:p.bedrag}));
  });
  periodesData.forEach(j=>{
    if(j.extraUitgBasis) c3sMomenten.push({type:'c3s', label:'Buffer extra uitgaven (max '+fmt(-(j.extraUitgBasis||0))+'/jr)', jaar:j.jaar, bedrag:j.extraUitgBasis});
    if(j.italieEenmalig) c3sMomenten.push({type:'c3s', label:'Casa 3S — eenmalig', jaar:j.jaar, bedrag:j.italieEenmalig});
    if(vermogenAflos==='ja' && j.aflosHyp) c3sMomenten.push({type:'c3s', label:'Aflossing hypotheek', jaar:j.jaar, bedrag:j.aflosHyp});
    if(j.extraBijzInk) c3sMomenten.push({type:'inkomst', label:'Bijzondere inkomst', jaar:j.jaar, bedrag:j.extraBijzInk});
    if(j.extraLindy) c3sMomenten.push({type:'inkomst', label:'Extra Lindy', jaar:j.jaar, bedrag:j.extraLindy});
  });
  const momenten = [...reisMomentenLijst(), ...c3sMomenten];

  return `
    <div class="card trend-card">
      <div class="card-label">Vermogensopbouw — vanaf ${VERMOGEN_NU_LABEL}, geïnterpoleerd uit je IKV-jaarcijfers</div>
      ${renderVermogenChart(chartSerie,'vGradIkv')}
    </div>
    <div class="card-label" style="margin:18px 0 8px;">Per jaar (tik voor de maanden, tik een maand voor de opbouw)</div>

/* ================= Salaris (Rob — LVNL, CAO schaal 351) =================
   Bron: Supabase-tabel 'salaris_parameters' (project apleozatyqmqtzofxbky) + Rob's eigen sheet.
   Ankerpunt: kolom 1-7-2026 uit de sheet, geverifieerd tegen de echte Rabo-salarisbetaling van

const ROB_PENSIOEN_JAAR = 2035; // AOW-leeftijd bereikt op 15-12-2034 (geboren 15-9-1967, 67j+3mnd) — valt in het aug-dec-blok van de "juli 2035"-periode, dat blok blijft "nog in dienst" (4 van de 5 maanden nog salaris)

const SALARIS_AP_PREMIE_PCT = 0.33; // vast contractueel percentage — benadering van de grondslag (Salaris+TOD+WG+ZK)

function salarisStapWaarde(stappen, datum){
  let val=null, aanname=false;
  for(const s of stappen){ if(s.vanaf<=datum){ val = (s.bedrag!==undefined)?s.bedrag:s.pct; aanname=!!s.aanname; } }
  return {val, aanname};
}
function salarisOmslagData(totJaar){
  const alle = new Set([SALARIS_ANCHOR_DATUM]);
  [SALARIS_CAO_STAPPEN, SALARIS_DEELTIJD_STAPPEN, SALARIS_PENSIOEN_WG, SALARIS_PENSIOEN_WN, SALARIS_IKV_KORTING, SALARIS_COMPENSATIE_ZK]
    .forEach(lijst=>lijst.forEach(s=>{ if(s.vanaf>=SALARIS_ANCHOR_DATUM && parseInt(s.vanaf.slice(0,4),10)<=totJaar) alle.add(s.vanaf); }));
  return [...alle].sort();
}
function berekenSalarisPeriodes(totJaar){
  const data = salarisOmslagData(totJaar);
  let salaris = SALARIS_ANCHOR_BEDRAG;
  return data.map(datum=>{
    const caoStap = SALARIS_CAO_STAPPEN.find(s=>s.vanaf===datum);
    // Salaris groeit alleen met cao — deeltijd werkt niet hier nogmaals door, die zit al verwerkt in Korting IKV
    // (bevestigd door Rob: "ikv korting is dat deeltijd percentage"). Salaris moet dus nooit dalen.
    if(datum>SALARIS_ANCHOR_DATUM && caoStap) salaris = salaris*(1+caoStap.pct/100);
    const tod = salaris*SALARIS_TOD_PCT/100;
    const wg = salarisStapWaarde(SALARIS_PENSIOEN_WG, datum).val;
    const zk = salarisStapWaarde(SALARIS_COMPENSATIE_ZK, datum).val;
    const apPremie = -(salaris+tod+wg+zk)*SALARIS_AP_PREMIE_PCT/100;
    const brutoTotaal = salaris+tod+wg+zk+apPremie;
    const wn = salarisStapWaarde(SALARIS_PENSIOEN_WN, datum);
    const ikv = salarisStapWaarde(SALARIS_IKV_KORTING, datum);
    const fiscaalBruto = brutoTotaal + wn.val + ikv.val;
    const zvw = salarisStapWaarde(SALARIS_ZVW_WN, datum);
    const netto = fiscaalBruto * SALARIS_NETTO_EFFECTIEF_PCT/100 + (zvw.val||0);
    const caoAanname = caoStap ? !!caoStap.aanname : (SALARIS_CAO_STAPPEN.filter(s=>s.vanaf<=datum).slice(-1)[0]||{}).aanname;
    return {vanaf:datum, salaris,tod,wg,zk,apPremie,brutoTotaal,pensioenWN:wn.val,ikvKorting:ikv.val,fiscaalBruto,netto,
      zvw: zvw.val||0, aannameZvw: !!zvw.aanname, aannameCao: !!caoAanname, aannamePensioenWN: !!wn.aanname};
  });
}
function salarisJaarOverzicht(totJaar){
  const periodes = berekenSalarisPeriodes(totJaar);
  const jaren = [];
  const VAKANTIEGELD_ANCHOR = 8163.43, DERTIENDE_ANCHOR = 8500.17; // sheet-anker 2026, kolom J
  for(let j=2026; j<=totJaar; j++){
    const janDatum = j+'-01-01', julDatum = j+'-07-01';
    const actief = (d)=> periodes.filter(p=>p.vanaf<=d).slice(-1)[0] || periodes[0];
    const eersteHelft = actief(j===2026 ? SALARIS_ANCHOR_DATUM : janDatum); // 2026: pas vanaf juli data
    const tweedeHelft = actief(julDatum);
    const nettoMaanden = j===2026 ? tweedeHelft.netto*6 : (eersteHelft.netto*6 + tweedeHelft.netto*6); // 2026 begint pas in juli
    let vakantiegeld, dertiende, bonusAanname;
    if(j===2026){
      vakantiegeld = VAKANTIEGELD_ANCHOR; dertiende = DERTIENDE_ANCHOR; bonusAanname = false; // sheet-anker, exacte kolom-J-bedragen
    } else {
      // geen apart cijfer bekend voor vakantiegeld/13e maand in latere jaren — schaal mee met dezelfde salarisgroei
      // die we ook voor de rest van dit model gebruiken (dus zelfde cao/inflatie-aannames), i.p.v. een losstaande tabel
      vakantiegeld = VAKANTIEGELD_ANCHOR * (eersteHelft.salaris / SALARIS_ANCHOR_BEDRAG);
      dertiende = DERTIENDE_ANCHOR * (tweedeHelft.salaris / SALARIS_ANCHOR_BEDRAG);
      bonusAanname = true;
    }
    const nettoJaar = nettoMaanden + vakantiegeld + dertiende;
    const caoStapDitJaar = SALARIS_CAO_STAPPEN.find(s=>s.vanaf===julDatum); // groeistap die dit jaar (juli) is toegepast
    jaren.push({jaar:j, eersteHelft, tweedeHelft, nettoJaar, vakantiegeld, dertiende, bonusAanname, caoStapDitJaar});
  }
  return jaren;
}

  return `
    <div class="detail-header">
      <button class="back-btn" data-go-home="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <div class="detail-title">${sec.label}</div>
      <button class="switch-btn" data-toggle-switch="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      ${quickSwitchOpen ? `<div class="switch-menu">${SECTIONS.map(s=>`<button data-goto-section="${s.id}" class="${s.id===view?'active':''}">${s.label}</button>`).join('')}</div>` : ''}
    </div>
    ${bodyHtml}
  `;
}
function renderBuildFooter(){
  return `<div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);opacity:0.6;text-align:center;margin:40px 0 10px;">
    build ${DASHBOARD_VERSION} · overrides: ${overridesLoaded ? (overridesSource==='live'?'✓ live (Supabase)':'⚠ fallback-snapshot') : 'laden…'}
  </div>`;
}
function render(){
  if(screen==='home'){
    document.getElementById('app').innerHTML = renderHomeScreen() + renderBuildFooter();
  } else {
    const body = view==='afgelopen' ? renderVolgendeMaandView() : (view==='vorige' ? renderLopendeMaandView() : (view==='reizen' ? renderReizenView() : (view==='casaproject' ? renderCasaProjectView() : (view==='volgende' ? renderVolgendeMaandSepView() : (view==='salaris' ? renderSalarisView() : (view==='salaris-rob' ? renderSalarisRobView() : (view==='salaris-lindy' ? renderSalarisLindyView() : renderVermogenView())))))));
    document.getElementById('app').innerHTML = renderDetailShell(body) + renderBuildFooter();
  }
  document.querySelectorAll('[data-goto-section]').forEach(el=>el.addEventListener('click',()=>{ view=el.dataset.gotoSection; screen='detail'; quickSwitchOpen=false; selectedFilter=null; render(); }));
  document.querySelectorAll('[data-go-home]').forEach(el=>el.addEventListener('click',()=>{ if(view==='salaris-rob'||view==='salaris-lindy'){ view='salaris'; } else { screen='home'; } quickSwitchOpen=false; render(); }));
  document.querySelectorAll('[data-toggle-switch]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); quickSwitchOpen=!quickSwitchOpen; render(); }));
  document.querySelectorAll('.month-tab').forEach(b=>b.addEventListener('click',()=>{ selectedMonth=b.dataset.month; render(); }));
  document.querySelectorAll('[data-filter-cat]').forEach(el=>el.addEventListener('click',()=>{ selectedFilter={type:'category', value:el.dataset.filterCat}; render(); scrollToLedger(); }));
  document.querySelectorAll('[data-filter-src]').forEach(el=>el.addEventListener('click',()=>{ selectedFilter={type:'source', value:el.dataset.filterSrc}; render(); scrollToLedger(); }));
  document.querySelectorAll('[data-filter-reis]').forEach(el=>el.addEventListener('click',()=>{ selectedFilter={type:'reis', value:el.dataset.filterReis}; render(); scrollToReisLedger(); }));
  document.querySelectorAll('[data-clear-filter]').forEach(el=>el.addEventListener('click',()=>{ selectedFilter=null; render(); }));
  document.querySelectorAll('[data-reis-tile-toggle]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); reisTileExpand = (reisTileExpand===el.dataset.reisTileToggle) ? null : el.dataset.reisTileToggle; render(); }));
  document.querySelectorAll('[data-reis-trip-toggle]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); reisTripExpand = (reisTripExpand===el.dataset.reisTripToggle) ? null : el.dataset.reisTripToggle; reisTileExpand=null; render(); }));
  document.querySelectorAll('[data-select-bucket]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); }));
  document.querySelectorAll('[data-select-bucket]').forEach(el=>el.addEventListener('change',(e)=>{
    e.stopPropagation();
    const key = el.dataset.selectBucket;
    if(el.checked) bucketSelection.add(key); else bucketSelection.delete(key);
    render();
  }));
  document.querySelectorAll('[data-move-bucket]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const target = el.dataset.moveBucket;
    [...bucketSelection].forEach(key=>setBucketOverrideByKey(key, target));
    bucketSelection.clear();
  }));
  document.querySelectorAll('[data-goto-view]').forEach(el=>el.addEventListener('click',()=>{ view=el.dataset.gotoView; selectedFilter=null; render(); }));
  document.querySelectorAll('[data-scroll-to]').forEach(el=>el.addEventListener('click',()=>{ scrollToSelector('#'+el.dataset.scrollTo); }));
  document.querySelectorAll('[data-expand]').forEach(el=>el.addEventListener('click',()=>{ volgendeExpand = (volgendeExpand===el.dataset.expand) ? null : el.dataset.expand; categoryExpand=null; render(); }));
  document.querySelectorAll('[data-cat-toggle]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); categoryExpand = (categoryExpand===el.dataset.catToggle) ? null : el.dataset.catToggle; bucketSelection.clear(); render(); }));
  document.querySelectorAll('[data-vermogen-inflatie]').forEach(el=>el.addEventListener('click',()=>{ vermogenInflatie = el.dataset.vermogenInflatie; render(); }));
  document.querySelectorAll('[data-vermogen-aflos]').forEach(el=>el.addEventListener('click',()=>{ vermogenAflos = el.dataset.vermogenAflos; render(); }));
  document.querySelectorAll('[data-jaar-toggle]').forEach(el=>el.addEventListener('click',()=>{ vermogenJaarExpand = (vermogenJaarExpand===el.dataset.jaarToggle) ? null : el.dataset.jaarToggle; render(); }));
  document.querySelectorAll('[data-sal-jaar-toggle]').forEach(el=>el.addEventListener('click',()=>{ salarisJaarExpand = (salarisJaarExpand===el.dataset.salJaarToggle) ? null : el.dataset.salJaarToggle; render(); }));
  document.querySelectorAll('[data-maand-toggle]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); vermogenMaandExpand = (vermogenMaandExpand===el.dataset.maandToggle) ? null : el.dataset.maandToggle; render(); }));
  const exportBtn = document.querySelector('[data-export-overrides]');
  if(exportBtn) exportBtn.addEventListener('click', exportOverrides);
  const importInput = document.querySelector('[data-import-overrides]');
  if(importInput) importInput.addEventListener('change', (e)=>{ if(e.target.files[0]) importOverrides(e.target.files[0]); });
  document.querySelectorAll('[data-edit-cat]').forEach(el=>el.addEventListener('change',(e)=>{ e.stopPropagation(); setOverrideByKey(el.dataset.editCat, el.value); }));
  document.querySelectorAll('[data-edit-cat]').forEach(el=>el.addEventListener('click',(e)=>e.stopPropagation()));
  document.querySelectorAll('[data-edit-reis]').forEach(el=>el.addEventListener('change',(e)=>{ e.stopPropagation(); setReisOverrideByKey(el.dataset.editReis, el.value); }));
  document.querySelectorAll('[data-edit-reis]').forEach(el=>el.addEventListener('click',(e)=>e.stopPropagation()));
}
function scrollToLedger(){
  scrollToSelector('.ledger-card');
}
function scrollToReisLedger(){
  scrollToSelector('#reis-toegewezen-ledger');
}
function scrollToSelector(sel){
  setTimeout(()=>{
    try{
      const el = document.querySelector(sel);
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'start'});
    }catch(e){}
  }, 30);
}
function _unused_old(){}
loadOverrides();
</script>
</body>
</html>
