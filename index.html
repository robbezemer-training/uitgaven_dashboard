  'nog-geen-factuur':{label:'Akkoord', color:'#9b7fbf'},
  'niet-akkoord':{label:'Nog niet akkoord', color:'var(--muted)'},
  'open':{label:'Open', color:'var(--muted)'}
};

function renderCasaProjectView(){
  const all = buildCombinedAlles();
  const project = all.filter(r=>r.category==='Casa 3S (project)').slice().sort((a,b)=>b.date.localeCompare(a.date));
  const totaal = project.reduce((s,r)=>s+r.amount,0);
  const onttrokken = all.filter(r=>r.category==='__SPAREN_NAAR_C3S__').reduce((s,r)=>s+r.amount,0);
  const balans = onttrokken + totaal;

  const perVendor = {};
  project.forEach(r=>{ perVendor[r.vendor]=(perVendor[r.vendor]||0)+r.amount; });
  const vendorSorted = Object.entries(perVendor).map(([k,v])=>[k,-v]).sort((a,b)=>b[1]-a[1]);
  const vendorTotal = vendorSorted.reduce((s,[,v])=>s+v,0);

  const perBron = {RABO:0, ING:0, AMEX:0};
  project.forEach(r=>{ perBron[r.source]+=r.amount; });
  const srcColor = {RABO:'var(--brass)', ING:'var(--teal)', AMEX:'var(--rose)', 'ING CC':'var(--ingcc)'};

  // Budget-overzicht uit c3s_posten (bron: offerte-Excel + Supabase-tabellen c3s_posten/c3s_facturen)
  // Betaald per post: voor aankoop rechtstreeks uit p.betaald; voor werkzaamheid/materiaal via gekoppelde betaalde facturen
  // (bedrag verdeeld over gekoppelde posten naar rato akkoordbedrag)
  function betaaldVoorPost(p){
    if(p.categorie==='aankoop') return p.betaald||0;
    const facturen = c3sFacturenVoorPost(p.id).filter(f=>f.betaald);
    if(facturen.length===0) return 0;
    let som = 0;
    facturen.forEach(f=>{
      const gekoppeld = f.post_ids.map(id=>C3S_POSTEN.find(x=>x.id===id)).filter(Boolean);
      const totaalAkkoord = gekoppeld.reduce((s,x)=>s+c3sBudget(x),0) || gekoppeld.length;
      const aandeel = totaalAkkoord ? c3sBudget(p)/totaalAkkoord : 1/gekoppeld.length;
      som += f.bedrag*aandeel;
    });
    return som;
  }
  const totaalBegroot = C3S_POSTEN.reduce((s,p)=>s+c3sBudget(p),0); // incl. IVA
  const totaalBegrootNetto = C3S_POSTEN.reduce((s,p)=>s+c3sBudgetNetto(p),0); // excl. IVA
  const totaalBetaaldPosten = C3S_POSTEN.reduce((s,p)=>s+betaaldVoorPost(p),0);
  const totaalFacturenBetaald = C3S_FACTUREN.filter(f=>f.betaald).reduce((s,f)=>s+f.bedrag,0);
  const totaalFacturenOpen = C3S_FACTUREN.filter(f=>!f.betaald).reduce((s,f)=>s+f.bedrag,0);
  const nogNietGefactureerd = C3S_POSTEN.filter(p=>p.categorie==='werkzaamheid' && c3sBudget(p)>0 && c3sFacturenVoorPost(p.id).length===0);
  const heuristicGestartIds = c3sHeuristicGestartIds();

  function postItemHtml(p, subOrderList){
    const st = c3sPostStatus(p);
    const statusUnified = c3sEffectieveStatus(p, heuristicGestartIds);
    const meta = C3S_STATUS4_META[statusUnified.value];
    const betaaldP = betaaldVoorPost(p);
    const budget = c3sBudget(p); // incl. IVA — primair, telt alleen mee als akkoord
    const netto = c3sBudgetNetto(p);
    const indicatief = c3sIndicatiefNetto(p);
    const isNietAkkoord = ['niet_akkoord','nog_niet_bepaald'].includes(statusUnified.value);
    // Voor niet-akkoord posten tonen we de offerte-richtprijs (nog geen echt bedrag); voor de rest het echte bedrag.
    const gebruiktRichtprijs = p.categorie==='werkzaamheid' && isNietAkkoord;
    const toonNetto = gebruiktRichtprijs ? indicatief : netto;
    const toonBedrag = gebruiktRichtprijs ? (p.iva_pct ? indicatief*(1+p.iva_pct/100) : indicatief) : budget;
    const eenheidLine = (p.eenheid_aantal!=null && p.eenheid_prijs!=null) ? `<div style="font-size:11px;color:var(--muted);margin-top:4px;">${p.eenheid_aantal} ${p.eenheid_label||''} × ${fmt(p.eenheid_prijs)}</div>` : '';
    // Gekoppelde facturen in een eigen kader, i.p.v. het gokken dat de losse notities-tekst opriep. Betaald/open komt puur hieruit — niet uit de statusdropdown.
    const gekoppeldeFacturen = c3sFacturenVoorPost(p.id);
    const facturenBlok = gekoppeldeFacturen.length ? `<div style="margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;">
      ${gekoppeldeFacturen.map(f=>
        `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding:2px 0;">
          <span>${f.aannemer}${f.factuurnr?` · nr. ${f.factuurnr}`:''} · ${f.datum}</span>
          <span style="white-space:nowrap;">${fmt(f.bedrag)}${f.betaald?' · betaald':' · open'}</span>
        </div>`
      ).join('')}
    </div>` : '';
    const huidigeSc = c3sSubcatOverrides[p.id]||p.subcategorie||(subOrderList?subOrderList[0]:'Overig');
    const catPicker = subOrderList ? `<select data-c3s-cat="${p.id}" class="c3s-select" style="background-color:#3a4152;color:var(--paper);border:1.5px solid var(--muted);font-weight:600;">
      ${subOrderList.map(sc=>`<option value="${sc}" ${sc===huidigeSc?'selected':''}>${sc}</option>`).join('')}
    </select>` : '';
    const statusPillStyle = `background-color:transparent;color:${meta.color};border:1.5px solid ${meta.color};font-weight:600;`;
    const statusPicker = `<select data-c3s-voortgang="${p.id}" class="c3s-select" style="${statusPillStyle}">
      <option value="nog_niet_bepaald" ${statusUnified.value==='nog_niet_bepaald'?'selected':''}>Nog niet bepaald</option>
      <option value="niet_akkoord" ${statusUnified.value==='niet_akkoord'?'selected':''}>Niet akkoord</option>
      <option value="akkoord" ${statusUnified.value==='akkoord'?'selected':''}>Akkoord</option>
      <option value="gestart" ${statusUnified.value==='gestart'?'selected':''}>Gestart</option>
      <option value="klaar" ${statusUnified.value==='klaar'?'selected':''}>Klaar</option>
    </select>`;
    const openBedrag = toonBedrag - betaaldP;
    const notitie = c3sNotitieOverrides[p.id] || '';
    const notitieRows = Math.max(1, Math.ceil((notitie.length||0)/38));
    const notitieVeld = `<textarea data-c3s-notitie="${p.id}" placeholder="Opmerking toevoegen…" rows="${notitieRows}" style="width:100%;margin-top:8px;background:var(--card2);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;box-sizing:border-box;font-family:inherit;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;resize:vertical;min-height:32px;" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';">${notitie.replace(/</g,'&lt;')}</textarea>`;
    const cijfer = (label,val,kleur)=>`<div style="min-width:80px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);">${label}</div><div style="font-size:15px;font-weight:700;${kleur?`color:${kleur};`:''}">${val?fmt(val):'—'}</div></div>`;
    return `<li style="padding:12px 0;border-bottom:1px solid var(--line);${isNietAkkoord?'opacity:0.75;':''}">
      <div style="font-size:14px;font-weight:600;margin-bottom:8px;">${p.omschrijving}</div>
      <div style="margin-bottom:4px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;">${statusPicker}${catPicker}</div>
      <div style="margin-bottom:8px;"></div>
      <div style="display:flex;gap:16px;margin-bottom:10px;">
        ${p.iva_pct
          ? cijfer('Excl. IVA'+(gebruiktRichtprijs?' (richtprijs)':''), toonNetto) + cijfer(`Incl. IVA (${p.iva_pct}%)`, toonBedrag)
          : cijfer('Bedrag'+(gebruiktRichtprijs?' (richtprijs)':''), toonBedrag)}
      </div>
      <div style="display:flex;gap:16px;">
        ${cijfer('Betaald', betaaldP, betaaldP>0?'var(--teal)':null)}
        ${isNietAkkoord
          ? cijfer('Open', null)
          : openBedrag<0
            ? cijfer('Te veel betaald', Math.abs(openBedrag), '#e08a9e')
            : cijfer('Open', openBedrag, openBedrag>0?'var(--brass)':null)}
      </div>
      ${eenheidLine}
      ${facturenBlok}
      ${notitieVeld}
    </li>`;
  }

  const C3S_SUBORDER = {
    aankoop: ['Koopkosten','Project'],
    werkzaamheid: ['Ruwbouw & sloop','Cisterna','Imhoff','Zwembad','Opbouw','Installaties','Nog te bepalen'],
    materiaal: ['Materialen'],
  };
  function postenLijstHtml(cat, filterSubcat){
    let posten = C3S_POSTEN.filter(p=>p.categorie===cat).sort((a,b)=>a.volgorde-b.volgorde);
    const subOrder = C3S_SUBORDER[cat];
    if(filterSubcat) posten = posten.filter(p=>(c3sSubcatOverrides[p.id]||p.subcategorie||subOrder[0])===filterSubcat);
    const begrootTot = posten.reduce((s,p)=>s+c3sBudget(p),0);
    const begrootTotNetto = posten.reduce((s,p)=>s+c3sBudgetNetto(p),0);
    const betaaldTot = posten.reduce((s,p)=>s+betaaldVoorPost(p),0);
    const bySubcat = {};
    posten.forEach(p=>{ const sc=c3sSubcatOverrides[p.id]||p.subcategorie||subOrder[0]; (bySubcat[sc]=bySubcat[sc]||[]).push(p); });
    const extraCats = Object.keys(bySubcat).filter(sc=>!subOrder.includes(sc));
    const openTot = Math.max(0, begrootTot-betaaldTot);
    return `
    <div class="card">
      ${(()=>{
        const zichtbareGroepen = [...subOrder,...extraCats].filter(sc=>bySubcat[sc]);
        const enkeleGroep = filterSubcat || zichtbareGroepen.length===1;
        return zichtbareGroepen.map(sc=>{
          const items = bySubcat[sc];
          if(enkeleGroep){
            // Al aangekondigd via card-label hierboven — geen dubbele kop, gewoon de posten.
            return `<ul class="ledger-list" style="list-style:none;margin:12px 0 0;padding:0;">
              ${items.map(p=>postItemHtml(p, subOrder)).join('')}
            </ul>`;
          }
          const subBegroot = items.reduce((s,p)=>s+c3sBudget(p),0);
          const groepKey = cat+'|'+sc;
          const open = c3sGroepenOpen[groepKey] !== false; // standaard open
          return `
          <div data-c3s-groep-toggle="${groepKey}" style="margin-top:18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;">
            <b style="font-size:17px;font-weight:700;color:var(--brass);">${open?'▾':'▸'} ${sc}</b>
            <span style="font-size:13px;color:var(--muted);">${fmt(subBegroot)}</span>
          </div>
          ${open ? `<ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
            ${items.map(p=>postItemHtml(p, subOrder)).join('')}
          </ul>` : ''}`;
        }).join('');
      })()}
    </div>`;
  }

  return `
    <div class="note-card card">
      <b>Casa 3S (project)</b> — begroting, akkoord-bedragen en facturen van de aannemers uit je offerte-Excel, gekoppeld aan wat er via de bank binnenkomt. Structurele lasten (lening, Enel, IMU) staan bij Vaste Lasten, dit gaat alleen over de eenmalige verbouwing.
    </div>
    <div class="hero4">
      <div class="card">
        <div class="card-label">Begroot</div>
        <div class="stat-figure">${fmt(totaalBegroot)}</div>
      </div>
      <div class="card">
        <div class="card-label">Betaald</div>
        <div class="stat-figure pos">${fmt(totaalBetaaldPosten)}</div>
      </div>
      <div class="card">
        <div class="card-label">Open</div>
        <div class="stat-figure ${(totaalBegroot-totaalBetaaldPosten)>0?'neg':''}">${fmt(totaalBegroot-totaalBetaaldPosten)}</div>
      </div>
    </div>
    ${(()=>{
      // Reconciliatie facturen <-> begroting: Lanzillotti is de hoofdaannemer, dekt in principe alle Bouw-posten
      // behalve losse specialistische onderdelen die apart gefactureerd worden (bv. zwembadinstallatie via Impiantisca Ruggiero).
      const bouwPosten = C3S_POSTEN.filter(p=>p.categorie==='werkzaamheid');
      const perAannemer = {};
      C3S_FACTUREN.forEach(f=>{
        perAannemer[f.aannemer] = perAannemer[f.aannemer] || {betaald:0, open:0, posten:new Set()};
        if(f.betaald) perAannemer[f.aannemer].betaald += f.bedrag; else perAannemer[f.aannemer].open += f.bedrag;
        (f.post_ids||[]).forEach(id=>perAannemer[f.aannemer].posten.add(id));
      });
      const specialistischeIds = new Set();
      Object.entries(perAannemer).forEach(([naam, v])=>{ if(naam!=='Lanzillotti Domenico') v.posten.forEach(id=>specialistischeIds.add(id)); });
      const lanzillottiScope = bouwPosten.filter(p=>!specialistischeIds.has(p.id));
      const lanzillottiScopeBegroot = lanzillottiScope.reduce((s,p)=>s+c3sBudget(p),0);
      const lanzillottiGefactureerd = (perAannemer['Lanzillotti Domenico']?.betaald||0) + (perAannemer['Lanzillotti Domenico']?.open||0);

      const facturenContent = `
      <div class="card">
        <div class="card-label">Dekking Lanzillotti (hoofdaannemer)</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Lanzillotti Domenico doet standaard alle Bouw-werkzaamheden, behalve losse specialistische onderdelen die apart gefactureerd worden (zoals de zwembadinstallatie via Impiantisca Ruggiero). Onderstaande vergelijkt zijn totale facturen met de begroting van al het Bouw-werk dat níet apart aan een andere aannemer is toegewezen.</div>
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid var(--line);">
          <span>Begroot (Bouw, exclusief specialistisch)</span><span>${fmt(lanzillottiScopeBegroot)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;">
          <span>Lanzillotti gefactureerd (betaald + open)</span><span>${fmt(lanzillottiGefactureerd)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--muted);">
          <span>Nog te factureren (indicatief)</span><span>${fmt(lanzillottiScopeBegroot-lanzillottiGefactureerd)}</span>
        </div>
      </div>
      <div class="card">
        <div class="card-label">Per aannemer</div>
        <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
          ${Object.entries(perAannemer).map(([naam,v])=>`
            <li style="padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;">
              <span style="font-size:13px;">${naam}${v.posten.size?` · ${v.posten.size} post${v.posten.size===1?'':'en'} gekoppeld`:' · algemeen, niet gekoppeld'}</span>
              <span style="font-size:13px;">${fmt(v.betaald+v.open)}${v.open>0?` (${fmt(v.open)} open)`:''}</span>
            </li>
          `).join('')}
        </ul>
      </div>
      <div class="card">
        <div class="card-label"><span>Facturenlog aannemers</span><span class="ledger-count">${C3S_FACTUREN.length} facturen</span></div>
        <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
          ${C3S_FACTUREN.slice().sort((a,b)=>b.datum.localeCompare(a.datum)).map(f=>`
            <li style="padding:8px 0;border-bottom:1px solid var(--line);">
              <div style="display:flex;justify-content:space-between;gap:8px;">
                <span style="font-size:13px;"><b>${f.aannemer}</b> ${f.factuurnr?`· nr. ${f.factuurnr}`:''}</span>
                <span style="font-size:13px;">${fmt(f.bedrag)}</span>
              </div>
              <div style="display:flex;justify-content:space-between;gap:8px;margin-top:2px;">
                <span style="font-size:11px;color:var(--muted);">${f.datum} · ${f.post_ids.length ? f.post_ids.length+' post'+(f.post_ids.length===1?'':'en')+' gekoppeld' : 'niet gekoppeld aan posten'}</span>
                <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:${f.betaald?'var(--teal)':'var(--brass)'};color:#fff;">${f.betaald?'Betaald':'Open'}</span>
              </div>
              ${f.bedrag_netto?`<div style="font-size:11px;color:var(--muted);margin-top:2px;">excl. IVA: ${fmt(f.bedrag_netto)} + ${f.iva_pct}% IVA = ${fmt(f.bedrag)}</div>`:''}
              ${f.omschrijving?`<div style="font-size:11px;color:var(--muted);margin-top:2px;">${f.omschrijving}</div>`:''}
              ${f.notities?`<div style="font-size:11px;color:var(--muted);margin-top:4px;font-style:italic;">${f.notities}</div>`:''}
            </li>
          `).join('')}
        </ul>
      </div>
      ${nogNietGefactureerd.length?`
      <div class="card">
        <div class="card-label">Akkoord, nog geen factuur ontvangen</div>
        <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
          ${nogNietGefactureerd.map(p=>`<li style="padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;">
            <span style="font-size:13px;">${p.omschrijving}</span><span style="font-size:13px;">${fmt(c3sBudget(p))}</span>
          </li>`).join('')}
        </ul>
      </div>`:''}`;

      function groepTotalen(cat, filterSubcat){
        let posten = C3S_POSTEN.filter(p=>p.categorie===cat);
        if(filterSubcat) posten = posten.filter(p=>(c3sSubcatOverrides[p.id]||p.subcategorie||C3S_SUBORDER[cat][0])===filterSubcat);
        const begroot = posten.reduce((s,p)=>s+c3sBudget(p),0);
        const betaald = posten.reduce((s,p)=>s+betaaldVoorPost(p),0);
        return {begroot, betaald, open: Math.max(0, begroot-betaald)};
      }
      const secties = [
        ['koop','Koop', groepTotalen('aankoop','Koopkosten'), ()=>postenLijstHtml('aankoop','Koopkosten')],
        ['project','Project', groepTotalen('aankoop','Project'), ()=>postenLijstHtml('aankoop','Project')],
        ['bouw','Bouw', groepTotalen('werkzaamheid'), ()=>postenLijstHtml('werkzaamheid')],
        ['afwerking','Afwerking', groepTotalen('materiaal'), ()=>postenLijstHtml('materiaal')],
        ['facturen','Facturen', {begroot:totaalFacturenBetaald+totaalFacturenOpen, betaald:totaalFacturenBetaald, open:totaalFacturenOpen}, ()=>facturenContent],
      ];
      return `<div style="margin-top:18px;">
        ${secties.map(([key,label,tot,contentFn])=>{
          const open = c3sSectiesOpen[key] !== false;
          return `<button class="c3s-sectie-tegel ${open?'active':''}" data-c3s-sectie="${key}" style="text-align:left;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span>${open?'▾':'▸'} ${label}</span>
            </div>
            <div style="display:flex;gap:16px;margin-top:8px;">
              <div style="min-width:70px;"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;">Begroot</div><div style="font-size:14px;font-weight:700;color:var(--paper);">${fmt(tot.begroot)}</div></div>
              <div style="min-width:70px;"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;">Betaald</div><div style="font-size:14px;font-weight:700;color:var(--teal);">${fmt(tot.betaald)}</div></div>
              <div style="min-width:70px;"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;">Open</div><div style="font-size:14px;font-weight:700;color:var(--brass);">${fmt(tot.open)}</div></div>
            </div>
          </button>
          ${open ? contentFn() : ''}`;
        }).join('')}
      </div>`;
    })()}
    <div class="hero4">
      <div class="card">
        <div class="card-label">Onttrokken uit sparen</div>
        <div class="stat-figure pos">${fmt(onttrokken)}</div>
        <div class="stat-sub">gemarkeerd als "C3S project" bij overboeking</div>
      </div>
      <div class="card">
        <div class="card-label">Uitgegeven (bank-ledger)</div>
        <div class="stat-figure neg">${fmt(totaal)}</div>
        <div class="stat-sub">${project.length} transacties</div>
      </div>
      <div class="card">
        <div class="card-label">Balans</div>
        <div class="stat-figure ${Math.abs(balans)<1?'pos':'neg'}">${fmt(balans)}</div>
        <div class="stat-sub">${Math.abs(balans)<1?'klopt — onttrokken = uitgegeven':'nog niet in balans'}</div>
      </div>
      <div class="card">
        <div class="card-label">Per rekening</div>
        <div class="stat-sub" style="margin-top:8px;">Rabo ${fmt(perBron.RABO)} · ING ${fmt(perBron.ING)} · AMEX ${fmt(perBron.AMEX)}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Verdeling per aannemer/post (bank-ledger)</div>
      <div class="bar-total"><span>Totaal</span><b>${fmt(vendorTotal).replace('€','€ ')}</b></div>
      ${renderBarList(vendorSorted, vendorTotal, {
        colorFor: (name,i)=>['#c9a227','#4fa89b','#7c93c9','#b3735c','#9b7fbf','#6fa37a','#d9b04c','#c97b94'][i%8],
        formatAmt: (val)=>fmt(-val),
        limit: 8,
      })}
    </div>
    <div class="card ledger-card">
      <div class="card-label"><span>Alle projecttransacties (bank-ledger)</span><span class="ledger-count">${project.length} regels</span></div>
      <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
        ${project.map(t=>txRow2Html(t)).join('')}
      </ul>
    </div>

   project-kosten.

   categorie "Cadeaus" (een cadeau is daadwerkelijk gekocht), vendor "Kado" zelf uitgesloten om de

const C3S_STORTINGEN = [
  // {datum:'2026-09-24', bedrag:4490.00, bron:'bevestigd door Rob'},

const C3S_NOG_TE_BETALEN_OFFICIEEL = 189058; // bron: Rob's "Begroting piccolo"-sheet, rij "Nog te betalen" (incl. IVA-kolom) — leidend boven de eigen C3S_POSTEN-optelling hieronder, die onvolledig blijkt (gaf eerder ten onrechte ±270k)
function c3sProjectNogTeBetalen(){
  const totaalBegroot = C3S_POSTEN.reduce((s,p)=>s+c3sBudget(p),0);
  const totaalBetaald = C3S_FACTUREN.filter(f=>f.betaald).reduce((s,f)=>s+f.bedrag,0);
  return {totaalBegroot, totaalBetaald, nogTeBetalen: C3S_NOG_TE_BETALEN_OFFICIEEL};

function berekenC3SGeschatSaldo(){
  const anker = saldoCheck['C3S'];
  if(!anker) return null;
  const facturenBetaald = C3S_FACTUREN.filter(f=>f.betaald && f.betaald_datum && f.betaald_datum>anker.anchor_datum);
  const uitgegeven = facturenBetaald.reduce((s,f)=>s+f.bedrag,0);
  const stortingenBevestigd = C3S_STORTINGEN.filter(s=>s.datum>anker.anchor_datum);
  const gestort = stortingenBevestigd.reduce((s,t)=>s+t.bedrag,0);
  const geschat = anker.anchor_bedrag + gestort - uitgegeven;
  const data = [...facturenBetaald.map(f=>f.betaald_datum), ...stortingenBevestigd.map(s=>s.datum)];
  const laatsteBekend = data.length ? data.sort().slice(-1)[0] : anker.anchor_datum;
  const project = c3sProjectNogTeBetalen();
  return {anker_bedrag:anker.anchor_bedrag, anker_datum:anker.anchor_datum, uitgegeven, gestort, geschat, laatsteBekend, aantalMutaties: facturenBetaald.length+stortingenBevestigd.length, project, verschilMetProject: geschat-project.nogTeBetalen};

function berekenKadoGeschatSaldo(){

  const gekocht = alleTx.filter(t=>t.category==='Cadeaus' && t.vendor!=='Kado' && t.date>anker.anchor_datum);
  const uitgegeven = gekocht.reduce((s,t)=>s+Math.abs(t.amount),0);

  const data = [...stortingen.map(t=>t.date), ...gekocht.map(t=>t.date)];
  const laatsteBekend = data.length ? data.sort().slice(-1)[0] : anker.anchor_datum;
  return {anker_bedrag:anker.anchor_bedrag, anker_datum:anker.anchor_datum, gestort, uitgegeven, geschat, laatsteBekend, aantalMutaties: stortingen.length+gekocht.length};

function renderVolgendeMaandView(){

  const hypotheekBegrootLM = hypotheekLM ? hypotheekLM.bruto : 2597.40; // fallback als maand ontbreekt
  const VAST_COMPONENTEN = {
    "Hypotheek": hypotheekBegrootLM, "Auto": 896.53, "Verzekeringen": 163.33+347.20,

  const isSpendRow = (r)=> !JUL_INCOME_CATS.includes(r.category) && !JUL_INTERN_CATS.includes(r.category) && r.category!=='Sparen' && !isReizenMetBudget(r) && r.category!=='Casa 3S (project)' && r.category!=='Belastingafrekening';
  const augTxAll = [

  const SUB_COMPONENTEN_MAP = {"Salaris": SALARIS_SUBCOMPONENTEN};
  function expandCard(titel, componenten, expandKey){
    const d = donutFor(componenten);
    const barHtml = renderBarList(d.sorted, d.total, {
      rowAttrs: (name)=>{ if(!SUB_COMPONENTEN_MAP[name]) return ''; const catKey=expandKey+'|'+name; return ` data-cat-toggle="${catKey}" style="cursor:pointer;${categoryExpand===catKey?'font-weight:600;':''}"`; },
      indicator: (name)=>{ if(!SUB_COMPONENTEN_MAP[name]) return ''; const catKey=expandKey+'|'+name; return categoryExpand===catKey?' ▾':' ▸'; },
    });
    return `<div class="card" style="grid-column: 1 / -1;">
      <div class="card-label">${titel} — samenstelling (voorspelling)</div>
      <div class="bar-total"><span>Totaal</span><b>${fmt(d.total).replace('€','€ ')}</b></div>
      ${barHtml}
      ${(()=>{
        if(!categoryExpand || !categoryExpand.startsWith(expandKey+'|')) return '';
        const catName = categoryExpand.slice(expandKey.length+1);
        const sub = SUB_COMPONENTEN_MAP[catName];
        if(!sub) return '';
        const sd = donutFor(sub);
        return `<div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule);">
          <div class="card-label">${catName} — uitsplitsing</div>
          ${renderBarList(sd.sorted, sd.total, {})}
        </div>`;
      })()}
    </div>`;
  }

  // Vaste lasten & Dagelijks: bij uitklappen tonen we de WERKELIJKE transacties van deze maand tot nu toe
  // (LM_RABO_TX + LM_ING_TX, met effectiveCategory + effectiveBucket), niet de voorspelling — die staat al
  // in het bovenste cijfer. Budget-bolletje moet altijd een kleur hebben: val terug op de eigen voorspelling/
  // vaste-lastenbedrag als er geen Excel-budget bekend is voor die categorie.
  const casa3sBudgetAug = CASA_LENING + (ENEL_MAANDEN.has(LM_MAAND_KORT)?ENEL_BEDRAG:0) + (IMU_MAANDEN.has(LM_MAAND_KORT)?IMU_BEDRAG:0);
  const muziekBudgetAug = MUZIEK_MAANDEN.has(LM_MAAND_KORT) ? MUZIEK_BEDRAG : 0;
  const budgetMapAug = {...VAST_COMPONENTEN, ...DAGELIJKS_COMPONENTEN, ...BUDGET_CATEGORIE_MAP, 'Casa 3S': casa3sBudgetAug, 'Muziek': muziekBudgetAug};
  function actueelDetail(titel, rowsActueel, expandKey){
    const perCat = {};
    rowsActueel.forEach(r=>{ perCat[r.category] = (perCat[r.category]||0) + Math.abs(r.amount); });
    const sorted = Object.entries(perCat).filter(([,v])=>v>0.001).sort((a,b)=>b[1]-a[1]);
    const total = sorted.reduce((s,[,v])=>s+v,0);
    const targetBucket = (expandKey==='vast') ? 'dagelijks' : 'vast';
    const barHtml = renderBarList(sorted, total, {
      showDot: true,
      budgetFor: (name)=> budgetMapAug[name],
      rowAttrs: (name)=>{ const catKey=expandKey+'|'+name; return ` data-cat-toggle="${catKey}" style="cursor:pointer;${categoryExpand===catKey?'font-weight:600;':''}"`; },
      indicator: (name)=>{ const catKey=expandKey+'|'+name; return categoryExpand===catKey?' ▾':' ▸'; },
      detailFor: (name)=>{
        const catKey = expandKey+'|'+name;
        if(categoryExpand!==catKey) return '';
        const matching = rowsActueel.filter(r=>r.category===name).slice().sort((a,b)=>b.date.localeCompare(a.date));
        const catTotal = matching.reduce((s,r)=>s+Math.abs(r.amount),0);
        const budget = budgetMapAug[name];
        const overBudget = budget!=null && catTotal > budget;
        const budgetKleur = budget!=null ? (overBudget?'var(--dot-over)':'var(--dot-ok)') : 'var(--muted)';
        const geselecteerdInDezeTegel = matching.filter(r=>bucketSelection.has(txKey(r))).length;
        const verplaatsKnop = geselecteerdInDezeTegel>0 ? `
          <div class="cdt-divider"></div>
          <button data-move-bucket="${targetBucket}" style="width:100%;background:var(--rule);border:none;color:var(--paper);border-radius:6px;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;">
            Verplaats naar ${targetBucket} (geldt voortaan voor deze hele categorie)
          </button>` : '';
        return `<div class="cat-detail-tile">
          <div class="cdt-total">${fmt(catTotal)}</div>
          <div class="cdt-budget" style="color:${budgetKleur};">${budget!=null ? 'begroot '+fmt(budget).replace('€','€ ') : 'geen budget bekend'}</div>
          <div class="cdt-divider"></div>
          <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">${matching.map(t=>txRow2Html(t, {showBucketToggle:true})).join('')}</ul>
          ${verplaatsKnop}
        </div>`;
      },
    });
    return `<div class="card" style="grid-column: 1 / -1;">
      <div class="card-label">${titel} — samenstelling (werkelijk, tot nu toe)</div>
      <div class="bar-total"><span>Totaal</span><b>${fmt(total).replace('€','€ ')}</b></div>
      ${total>0 ? barHtml : `<div style="font-size:12px;color:var(--muted);padding:8px 0;">Nog geen transacties in deze categorie deze maand.</div>`}
    </div>`;
  }

  function tile(label, bedrag, sub, expandKey, cls, voortgang){
    const isOpen = volgendeExpand===expandKey;
    const map = {inkomen:INKOMEN_COMPONENTEN, vast:VAST_COMPONENTEN, dagelijks:DAGELIJKS_COMPONENTEN, sparen:SPAREN_COMPONENTEN};
    const detail = !isOpen ? '' : (
      expandKey==='vast' ? actueelDetail(label, vastRowsActueel, expandKey) :
      expandKey==='dagelijks' ? actueelDetail(label, dagelijksRowsActueel, expandKey) :
      expandCard(label, map[expandKey], expandKey)
    );
    const pct = voortgang ? Math.min(100, Math.round(voortgang.uitgegeven/voortgang.verwacht*100)) : null;
    const figuur = voortgang
      ? `<div class="stat-figure ${cls}">${fmt(-voortgang.uitgegeven)}</div><div class="stat-sub">van verwacht ${fmt(-voortgang.verwacht)} (${pct}%)</div>`
      : `<div class="stat-figure ${cls}">${bedrag}</div><div class="stat-sub">${sub}</div>`;
    return `<div class="card" data-expand="${expandKey}" style="cursor:pointer;">
        <div class="card-label">${label}${isOpen?' ▾':' ▸'}</div>
        ${figuur}
      </div>${detail}`;
  }

  return `
    ${renderSaldoCheckCard()}
    ${(()=>{
      const isOpen = volgendeExpand==='na-salaris';
      const kleur = restNaarIng>=0?'var(--dot-ok)':'var(--dot-over)';
      return `<div class="card" data-expand="na-salaris" style="cursor:pointer;border-color:${kleur};">
        <div class="card-label">Overmaken naar ING${isOpen?' ▾':' ▸'}</div>
        <div class="stat-figure" style="color:${kleur};">${fmt(restNaarIng)}</div>
        <div class="stat-sub">na salaris: Rabo → ING</div>
        ${isOpen?`<div class="cdt-divider"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;">
          <div style="display:flex;justify-content:space-between;"><span>Salaris (Rabo)</span><span style="color:var(--paper);">${fmt(inkomenRabo)}</span></div>
          <div style="display:flex;justify-content:space-between;"><span>Vaste lasten (verwacht +${VAST_LASTEN_BUFFER_PCT}%)</span><span style="color:var(--paper);">${fmt(-vastRaboVerwachtMetBuffer)}</span></div>
          <div style="display:flex;justify-content:space-between;"><span>Sparen (vast doel)</span><span style="color:var(--paper);">${fmt(-sparenBasis)}</span></div>
          <div style="display:flex;justify-content:space-between;border-top:1px dashed var(--rule);padding-top:4px;margin-top:2px;"><span>Rest → ING</span><span style="color:${kleur};font-weight:600;">${fmt(restNaarIng)}</span></div>
        </div>`:''}
      </div>`;
    })()}
    ${!vorigeMaandSparen.sparenGedaan ? (()=>{
      const kleur = vorigeMaandSparen.blijftOver>=0?'var(--dot-ok)':'var(--dot-over)';
      const isOpen = volgendeExpand==='vorigeMaandSparen';
      return `<div class="card" data-expand="vorigeMaandSparen" style="cursor:pointer;border-color:${kleur};margin-top:10px;">
        <div class="card-label">Vorige maand — sparen${isOpen?' ▾':' ▸'}</div>
        <div class="stat-figure" style="color:${kleur};">${fmt(vorigeMaandSparen.blijftOver)}</div>
        <div class="stat-sub">nog niet overgemaakt naar sparen</div>
        ${isOpen?`<div class="stat-sub" style="margin-top:6px;">geen overboeking naar Oranje Spaarrekening gevonden in juli — dit bedrag telt mee bij de eerstvolgende keer sparen (samen met wat deze maand overblijft)</div>`:''}
      </div>`;
    })() : ''}
    ${actieveReisBudgetten().map(r=>{
      const kleur = r.rest!=null && r.rest<0 ? 'var(--dot-over)' : 'var(--rule)';
      return `<div class="card" data-goto-reis-trip="${r.trip.id}" style="cursor:pointer;margin-top:10px;border-color:${kleur};">
        <div class="card-label">Onderweg: ${r.trip.naam} ›</div>
        <div class="stat-figure ${r.rest!=null && r.rest<0?'neg':'pos'}">${r.rest!=null?fmt(r.rest):'—'}</div>
        <div class="stat-sub">nog vrij van €${r.budget!=null?Math.round(r.budget):'?'} reisbudget</div>
      </div>`;
    }).join('')}
    ${reisAfwikkeling.map(r=>`<div class="card" style="margin-top:10px;border-color:${r.rest<0?'var(--dot-over)':'var(--dot-ok)'};">
      <div class="card-label">${r.trip.naam} is afgelopen — ${r.rest<0?'tekort':'overschot'} verwerkt in Dagelijks</div>
      <div class="stat-figure ${r.rest<0?'neg':'pos'}">${fmt(r.rest)}</div>
      <div class="stat-sub">Klopt dit bedrag (staat alle Amex al in${r.trip.borg?`, en is de €${r.trip.borg.bedrag} borg (${r.trip.borg.vendor}) al terug of hier al voor gecorrigeerd`:''})? Bevestig dan, anders telt dit elke maand opnieuw mee totdat het klopt.</div>
      <div class="cdt-divider"></div>
      <span data-bevestig-afwikkeling="${r.trip.id}" style="cursor:pointer;display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--dot-ok);border:1px solid var(--dot-ok);border-radius:20px;padding:6px 14px;">✓ Bevestig, is definitief</span>
    </div>`).join('')}
    <div class="hero4">
      ${tile('Inkomen', fmt(inkomenTotaal), 'Rob + Lindy + belastingteruggave + deurwaarder (€0)', 'inkomen', 'pos')}
      ${tile('Vaste lasten', null, null, 'vast', 'neg', {uitgegeven:vastUitgegevenTotaal, verwacht:vastTotaal})}
      ${tile('Dagelijks', null, null, 'dagelijks', 'neg', {uitgegeven:dagelijksUitgegevenTotaal, verwacht:variabel})}
      ${tile('Sparen', fmt(sparenBasis), 'Rob €2.000 + Lindy volledig — vaste eerste afspraak', 'sparen', 'pos')}
      ${(()=>{
        const isOpen = volgendeExpand==='besteding';
        const hoofd = nettoSaldoGecorrigeerd;
        const reisRegels = [
          ...actieveReisBudgetten().filter(r=>r.rest!=null && r.rest<0).map(r=>({naam:r.trip.naam, bedrag:r.rest})),
          ...reisAfwikkeling.map(r=>({naam:r.trip.naam, bedrag:r.rest})),
        ];
        const row = (label, bedrag, kleur)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--rule);">
          <span style="color:var(--muted);">${label}</span><span style="color:${kleur || (bedrag>=0?'var(--dot-ok)':'var(--dot-over)')};white-space:nowrap;">${fmt(bedrag)}</span>
        </div>`;
        const detail = !isOpen ? '' : `<div class="card" style="grid-column: 1 / -1;">
          <div class="card-label">Bestedingsruimte — samenstelling</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;">
            ${vorigeMaandComponent!==0 ? row('Vorige maand (juli)', vorigeMaandComponent) : ''}
            ${reisRegels.map(r=>row(`Reis — ${r.naam}`, r.bedrag)).join('')}
            ${row('Lopende maand', netto)}
            ${heeftSaldo && Math.abs(saldoAfwijkingTotaal)>=0.01 ? row('Saldo-afwijking (bank)', saldoAfwijkingTotaal, 'var(--dot-afwijking)') : ''}
            ${kaartReservering>0 ? row('Openstaand AMEX/CC', -kaartReservering, 'var(--dot-afwijking)') : ''}
            <div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--paper-dim);margin-top:2px;">
              <span style="font-weight:600;">Totaal</span><span style="font-weight:600;font-size:1.1em;color:${hoofd>=0?'var(--dot-ok)':'var(--dot-over)'};">${fmt(hoofd)}</span>
            </div>
          </div>
        </div>`;
        return `<div class="card" data-expand="besteding" style="cursor:pointer;">
          <div class="card-label">Bestedingsruimte${isOpen?' ▾':' ▸'}</div>
          <div class="stat-figure ${hoofd>=0?'pos':'neg'}">${fmt(hoofd)}</div>
          <div class="stat-sub">${(vorigeMaandComponent!==0||reisAfwikkeling.length>0||(heeftSaldo && (Math.abs(saldoAfwijkingTotaal)>=0.01))||kaartReservering>0) ?'verwacht bij einde maand, incl. vorige maand/reis/saldo':'verwacht bij einde maand (systeem)'}</div>
        </div>${detail}`;
      })()}
    </div>
    <div class="card ledger-card">
      <div class="card-label"><span>Alle transacties tot nu toe</span><span class="ledger-count">${augTxAll.filter(t=>!JUL_INTERN_CATS.includes(t.category)).length}</span></div>
      <ul class="ledger-list" style="list-style:none;margin:0;padding:0;">
        ${augTxAll.filter(t=>!JUL_INTERN_CATS.includes(t.category))
          .slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>txRow2Html(t)).join('')}
      </ul>
    </div>

    <footer>Dagelijks is gebaseerd op het gemiddelde van 7-8 maanden echte ING/AMEX-data (na categorie-correcties), niet meer op een losse schatting. Enel valt in augustus (even maand); IMU niet (mei/november). Lindy's salaris is bijgewerkt naar €2.489,66 (vergoedingen zijn variabel, dus niet in deze voorspelling meegenomen).</footer>
  `;
}

function renderVolgendeMaandSepView(){
  // Live berekend uit de eigen salaris- en hypotheekengines (zelfde bron als de Salaris- en Hypotheek-tabs),
  // niet meer met de hand overgetypte cijfers. Groeit dus vanzelf mee bij een nieuwe cao-stap, deeltijdwissel
  // of hypotheekmaand — geen los onderhoud meer nodig bij de maandovergang.
  const VM_JAAR = 2026, VM_MAAND = 9; // "volgende maand" t.o.v. lopende maand (LM_JAAR/LM_MAAND hierboven)
  const robPeriodeVM = berekenSalarisPeriodes(VM_JAAR).filter(p=>p.vanaf<=`${VM_JAAR}-${String(VM_MAAND).padStart(2,'0')}-01`).slice(-1)[0];
  const lindyPeriodeVM = berekenLindyPeriodes(VM_JAAR).filter(p=>p.vanaf<=`${VM_JAAR}-${String(VM_MAAND).padStart(2,'0')}-01`).slice(-1)[0];
  const hypotheekVM = hypotheekVindMaand(VM_JAAR, VM_MAAND);
  const ROB_BASIS = robPeriodeVM.netto;
  const LINDY = lindyPeriodeVM.netto;
  const LINDY_TOESLAGEN = lindyPeriodeVM.toeslagen;
  const hypotheekSchoonVM = hypotheekVM ? hypotheekSchoon(hypotheekVM) : null;
  // Let op: NIET hypotheekVM.belastingteruggave gebruiken — dat is het ruwe Excel-cijfer waarin de
  // Casa 3S-rente (niet-aftrekbaar, Box 3) per ongeluk wordt meegeteld als aftrekbaar. hypotheekSchoon()
  // is de gecorrigeerde versie (C3S-rente uitgesloten), zelfde bron als de Hypotheek-tab.
  const BELASTING = hypotheekSchoonVM ? hypotheekSchoonVM.belastingAftrek : 313.00; // fallback als maand ontbreekt
  const HYPOTHEEK_BEGROOT = hypotheekVM ? hypotheekVM.bruto : 2597.40;
  const ROB_SPAREN=2000.00;
  const INKOMEN_COMPONENTEN = {"Salaris": ROB_BASIS+LINDY, "Belastingteruggave": BELASTING, "Overig inkomen": LINDY_TOESLAGEN};
  const SALARIS_SUBCOMPONENTEN = {"Rob — LVNL (basis)": ROB_BASIS, "Lindy — SARO": LINDY};
  const SPAREN_COMPONENTEN = {"Rob — vast": ROB_SPAREN, "Lindy — volledig salaris": LINDY, "Deurwaarder (Velthoven)": 0};
  const VAST_COMPONENTEN = {
    "Hypotheek": HYPOTHEEK_BEGROOT, "Auto": 896.53, "Verzekeringen": 163.33+347.20,
    "Nutsvoorzieningen": 26.00+227.42, "Telecom": 94.99, "Abonnementen": 28.63+39.30+89.78,
    "Goede doelen": 2.00, "Bankkosten": 4.65+4.53+20.00, "Casa 3S": 415.28,
    "Medisch": 157.92, "Vakbond": 25.60, "Muziek": 0.00, "Paardrijden": 325.00+143.18, "Zakelijk": 117.45,
    /* Muziek (CultuurLocaal) op €0: 25 jul-24 aug valt volledig in de bevestigde zomerstop (geen incasso's jul/aug/sep).
       Actieve maanden (jan-jun, okt-dec): €182,73/mnd — nieuw tarief sinds okt, zie vendor_patronen in Supabase. */
  };
  const vastTotaal = Object.values(VAST_COMPONENTEN).reduce((a,b)=>a+b,0);
  // Live berekend (zie voorspellingDagelijksPerCategorie): gewogen gemiddelde over alle afgesloten
  // maanden met echte data, recentere maanden wegen zwaarder. Groeit vanzelf mee — geen vaste
  // getallen meer die ik handmatig moet bijwerken. Lopende maand (aug) telt zelf niet mee, want
  // die is nog niet afgesloten.
  const voorspelling = voorspellingDagelijksPerCategorie(2026, 8);
  const DAGELIJKS_COMPONENTEN = {};
  Object.entries(voorspelling.perCategorie).forEach(([cat,bedrag])=>{
    if(VAST_COMPONENTEN[cat]!=null) return; // al meegeteld bij Vaste lasten (bv. Telecom), niet dubbel
    DAGELIJKS_COMPONENTEN[cat] = bedrag;
  });
  const variabel = Object.values(DAGELIJKS_COMPONENTEN).reduce((a,b)=>a+b,0);
  const inkomenTotaal = Object.values(INKOMEN_COMPONENTEN).reduce((a,b)=>a+b,0);
  const sparenBasis = ROB_SPAREN+LINDY;
  const netto = inkomenTotaal - sparenBasis - vastTotaal - variabel;

  function donutFor(componenten){
    const sorted = Object.entries(componenten).filter(([,v])=>v>0.001).sort((a,b)=>b[1]-a[1]);
    const total = sorted.reduce((s,[,v])=>s+v,0);
    return {sorted, total};
  }
  const SUB_COMPONENTEN_MAP = {"Salaris": SALARIS_SUBCOMPONENTEN};
  function expandCard(titel, componenten, expandKey){
    const d = donutFor(componenten);
    const barHtml = renderBarList(d.sorted, d.total, {
      rowAttrs: (name)=>{ if(!SUB_COMPONENTEN_MAP[name]) return ''; const catKey=expandKey+'|'+name; return ` data-cat-toggle="${catKey}" style="cursor:pointer;${categoryExpand===catKey?'font-weight:600;':''}"`; },
      indicator: (name)=>{ if(!SUB_COMPONENTEN_MAP[name]) return ''; const catKey=expandKey+'|'+name; return categoryExpand===catKey?' ▾':' ▸'; },
    });
    return `<div class="card" style="grid-column: 1 / -1;">
      <div class="card-label">${titel} — samenstelling (voorspelling)</div>
      <div class="bar-total"><span>Totaal</span><b>${fmt(d.total).replace('€','€ ')}</b></div>
      ${barHtml}
      ${(()=>{
        if(!categoryExpand || !categoryExpand.startsWith(expandKey+'|')) return '';
        const catName = categoryExpand.slice(expandKey.length+1);
        const sub = SUB_COMPONENTEN_MAP[catName];
        if(!sub) return '';
        const sd = donutFor(sub);
        return `<div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule);">
          <div class="card-label">${catName} — uitsplitsing</div>
          ${renderBarList(sd.sorted, sd.total, {})}
        </div>`;
      })()}
    </div>`;
  }

  function tile(label, bedrag, sub, expandKey, cls){
    const isOpen = volgendeExpand===expandKey;
    const map = {inkomen:INKOMEN_COMPONENTEN, vast:VAST_COMPONENTEN, dagelijks:DAGELIJKS_COMPONENTEN, sparen:SPAREN_COMPONENTEN};
    const detail = isOpen ? expandCard(label, map[expandKey], expandKey) : '';
    return `<div class="card" data-expand="${expandKey}" style="cursor:pointer;">
        <div class="card-label">${label}${isOpen?' ▾':' ▸'}</div>
        <div class="stat-figure ${cls}">${bedrag}</div>
        <div class="stat-sub">${sub}</div>
      </div>${detail}`;
  }

  return `
    <div class="hero4">
      ${tile('Inkomen', fmt(inkomenTotaal), 'Rob + Lindy + belastingteruggave + deurwaarder (€0)', 'inkomen', 'pos')}
      ${tile('Vaste lasten', fmt(-vastTotaal), 'Bakkersparkweg + Casa 3S + ING + AMEX', 'vast', 'neg')}
      ${tile('Dagelijks', fmt(-variabel), 'gem. 7-8 mnd echte data', 'dagelijks', 'neg')}
      ${tile('Sparen', fmt(sparenBasis), 'Rob €2.000 + Lindy volledig — vaste eerste afspraak', 'sparen', 'pos')}
      <div class="card">
        <div class="card-label">Bestedingsruimte</div>
        <div class="stat-figure ${netto>=0?'pos':'neg'}">${fmt(netto)}</div>
        <div class="stat-sub">o.b.v. patroonherkenning uit 7-8 mnd data</div>
      </div>
    </div>
    <footer>Dagelijks is nu een <em>live</em> gewogen gemiddelde over alle afgesloten maanden met echte ING/AMEX/creditcard-data (recentere maanden wegen zwaarder) — dit groeit vanzelf mee zodra er weer een maand wordt afgesloten, geen vaste getallen meer die handmatig bijgewerkt moeten worden. Enel valt niet in september (alleen feb/apr/jun/aug/okt/dec); IMU ook niet (mei/november). Lindy's salaris komt nu live uit dezelfde berekening als de Salaris-tab (50% parttime vanaf 1 sept) — bijstellen zodra de eerste septemberstrook binnen is en er verschillen blijken.</footer>
  `;
}

/* ---------- Vooruitblik lange termijn: vermogensopbouw (vanaf nu = juli 2026) ---------- */
function reisMomentenLijst(){
  return REIZEN_PLANNING.filter(t=>t.jaar>=2026).map(t=>({type:'reis', label:t.naam+(t.timing?' ('+t.timing+')':''), jaar:String(t.jaar), bedrag:-t.budget}));
}
const MAAND_NAMEN_NL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function timingNaarMaandNummer(timing){
  const t = (timing||'').toLowerCase();
  if(t.includes('zomer')) return 8;
  if(t.includes('kerst')) return 12;
  if(t.includes('lente')) return 4;
  if(t.includes('winter')) return 1;

function reisBetalingenPerMaand(){

function renderVermogenChart(series, idLabel){
  const w=900,h=200,pad=10;
  const n = series.length;
  const max = Math.max(...series)*1.05;
  const min = Math.min(0, Math.min(...series)*1.05);
  const stepX = (w-pad*2)/(n-1);
  const pts = series.map((v,i)=>{ const x=pad+i*stepX; const y=h-pad-((v-min)/(max-min||1))*(h-pad*2); return [x,y]; });
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[n-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const zeroY = h-pad-((0-min)/(max-min||1))*(h-pad*2);
  const zeroLine = (min<0) ? `<line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${idLabel}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.3"/><stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#${idLabel})"/>${zeroLine}<path d="${linePath}" fill="none" stroke="#c9a227" stroke-width="2"/></svg>`;
}

    const baselineVan = (jr)=> jr.totaal;
    const baselineOud = baselineVan(prev);
    const baselineNieuw = baselineVan(j);
    const maandVoordeel = (j.totaalAflos!=null) ? (j.totaalAflos-j.totaal)*12 : 0;
    // reizen halen we niet meer uit de IKV-cijfers (die staan al in de Reizen-tab/Bijzondere posten) — dus het eigen reisbudget van de IKV-sheet rekenen we hier terug de pot in

    const robNettoOud = ((eindJaarNum-1) < ROB_PENSIOEN_JAAR) ? robNettoOp((eindJaarNum-1)+'-07-01') : null;
    const robNettoNieuw = (eindJaarNum < ROB_PENSIOEN_JAAR) ? robNettoOp(eindJaarNum+'-01-01') : null;

      // Echt aflossingseffect (zelfde nauwkeurige berekening als Nominaal-tab), op basis van de delen die

      let aflosMaandEffect = 0;
      let aflosPayoffPost = null;
      if(vermogenAflos==='ja' && hypotheekGekozenDelen.length){
        const pLabel = parseVermogenMaandLabel(label);
        if(pLabel){
          const totMnd = pLabel.jaar*12+pLabel.maand;
          if(totMnd===HYPOTHEEK_RENTEVAST_EIND_TOTAAL_MND){
            const refR = hypotheekVindMaand(pLabel.jaar, pLabel.maand);
            const payoff = refR ? hypotheekGekozenDelen.reduce((s,i)=>s+(refR.delen[i]?refR.delen[i][0]:0),0) : 0;
            aflosPayoffPost = {naam:`Aflossing hypotheek (${hypotheekGekozenDelen.length} ${hypotheekGekozenDelen.length===1?'deel':'delen'})`, bedrag:-payoff};
          } else if(totMnd>HYPOTHEEK_RENTEVAST_EIND_TOTAAL_MND){
            const hr = hypotheekVindMaand(pLabel.jaar, pLabel.maand);
            if(hr){
              const schoon = hypotheekSchoon(hr);
              const metA = hypotheekMetAflossing(hr, hypotheekGekozenDelen);
              aflosMaandEffect = Math.round((schoon.netto-metA.netto)*100)/100;
            }
          }
        }
      }
      const jaarVanMaand = parseInt(label.match(/\d{4}/)[0],10);
      if(label === VERMOGEN_NU_LABEL){
        // Deze maand is al echt bekend — zelfde ankerpunt als de Nominaal-tab (VERMOGEN_NU_BEDRAG/-LABEL).
        // Niet nogmaals via de jaarformule optellen, anders telt de groei van deze maand dubbel (één keer via
        // het echte ankerbedrag zelf, één keer via de formule hieronder).
        alleMaanden.push({label, jaar:jaarVanMaand, waarde:saldo, breakdown:[{naam:'Echt saldo (Rabo-app) — zelfde ankerpunt als Nominaal-tab', bedrag:0}]});
      } else {
        saldo += baseline + maandBuffer + reisTotaal + eenmaligTotaal + bonusTotaal + robDelta + lindyDelta + verplaatstSom + aflosMaandEffect + (aflosPayoffPost?aflosPayoffPost.bedrag:0) + (m===11 ? namedJuliSum+overig : 0);
        const cbsUitleg = jaarVanMaand>=2027 ? ' (2%/jr, gelijk aan cao-plug)' : '';
        const breakdown = [{naam:'Inkomsten (Rob)', bedrag:(bron.inkLVNL||0)+robDelta}, {naam:'Rob (extra)', bedrag:bron.rob||0}, {naam:'Lindy', bedrag:(bron.lindy||0)+lindyDelta}, {naam:'Deurwaarder'+cbsUitleg, bedrag:bron.heks||0}, {naam:'Lasten'+cbsUitleg, bedrag:bron.uitgaven||0}, {naam:'Buffer extra uitgaven'+cbsUitleg, bedrag:maandBuffer}, ...reisPosten, ...eenmaligPosten, ...bonusPosten, ...verplaatstDezeMaand];
        if(aflosMaandEffect) breakdown.push({naam:'Rentevoordeel na aflossing', bedrag:aflosMaandEffect});
        if(aflosPayoffPost) breakdown.push(aflosPayoffPost);
        if(m===11) breakdown.push(...namedJuli);
        alleMaanden.push({label, jaar:jaarVanMaand, waarde:saldo, breakdown});
      }
    }
  });

  // hergroeperen op kalenderjaar (i.p.v. juli-juli), zodat de tegels aansluiten op Nominaal
  const periodesMap = new Map();
  alleMaanden.forEach(mo=>{
    if(!periodesMap.has(mo.jaar)) periodesMap.set(mo.jaar, []);
    periodesMap.get(mo.jaar).push(mo);
  });
  const periodes = [...periodesMap.entries()].map(([jaar,maanden])=>({jaarLabel:maanden[0].label.charAt(0).toUpperCase()+maanden[0].label.slice(1), saldoEind:maanden[0].waarde, maanden}));

  const chartSerie = [VERMOGEN_NU_BEDRAG, ...alleMaanden.map(m=>m.waarde)];

  const c3sMomenten = [];
  Object.entries(VERMOGEN_EENMALIGE_POSTEN).forEach(([label,posten])=>{
    posten.forEach(p=>c3sMomenten.push({type:'c3s', label:p.naam, jaar:label, bedrag:p.bedrag}));
  });
  periodesData.forEach(j=>{
    if(j.extraUitgBasis) c3sMomenten.push({type:'c3s', label:'Buffer extra uitgaven (max '+fmt(-(j.extraUitgBasis||0))+'/jr)', jaar:j.jaar, bedrag:j.extraUitgBasis});
    if(j.italieEenmalig) c3sMomenten.push({type:'c3s', label:'Casa 3S — eenmalig', jaar:j.jaar, bedrag:j.italieEenmalig});
    if(j.extraBijzInk) c3sMomenten.push({type:'inkomst', label:'Bijzondere inkomst', jaar:j.jaar, bedrag:j.extraBijzInk});
    if(j.extraLindy) c3sMomenten.push({type:'inkomst', label:'Extra Lindy', jaar:j.jaar, bedrag:j.extraLindy});
  });
  if(vermogenAflos==='ja' && hypotheekGekozenDelen.length){
    const aflosMogelijkVanafIkv = {y: Math.floor(HYPOTHEEK_RENTEVAST_EIND_TOTAAL_MND/12), m: HYPOTHEEK_RENTEVAST_EIND_TOTAAL_MND%12 || 12};
    const refR = hypotheekVindMaand(aflosMogelijkVanafIkv.y, aflosMogelijkVanafIkv.m);
    const payoff = refR ? hypotheekGekozenDelen.reduce((s,i)=>s+(refR.delen[i]?refR.delen[i][0]:0),0) : 0;
    c3sMomenten.push({type:'c3s', label:`Aflossing hypotheek (${hypotheekGekozenDelen.length} ${hypotheekGekozenDelen.length===1?'deel':'delen'})`, jaar:`${MAAND_NAMEN_NL[aflosMogelijkVanafIkv.m-1]} ${aflosMogelijkVanafIkv.y}`, bedrag:-payoff});
  }
  const momenten = [...reisMomentenLijst(), ...c3sMomenten];

  return `
    <div class="card trend-card vermogen-trend-sticky">
      <div class="card-label">Vermogensopbouw — vanaf ${VERMOGEN_NU_LABEL}, geïnterpoleerd uit je jaarcijfers</div>
      ${renderVermogenChart(chartSerie,'vGradIkv')}
    </div>
    <div class="card-label" style="margin:18px 0 8px;">Per jaar (tik voor de maanden, tik een maand voor de opbouw)</div>
    ${renderJaarAccordion(periodes)}
    ${renderMomentenLijst(momenten)}
    <footer>Rob volgt zijn eigen CAO-opbouw (bevestigde cao-stappen tot 2027; onbekende cao's daarna op 2%/jr, tot een nieuwe cao bekend is). Deurwaarder, Lasten en de buffer extra uitgaven volgen vanaf 2027 dezelfde 2%/jr-aanname als de cao-plug — geen apart CBS-gemiddelde meer. Januari 2027 start bij Deurwaarder op het echte bedrag van eind 2026 (900 euro, nog geen bekende verhoging); 2028 en verder bouwen daarop verder met 2%/jr. Reisbedragen komen uit de Reizen-tab: de helft wordt betaald een half jaar voor de reismaand (aanbetaling/eerste kosten), de rest de maand ervoor — het eigen reisbudget uit de jaarcijfers is losgekoppeld om dubbeltelling te voorkomen. Tegels lopen nu per kalenderjaar, net als bij Nominaal. Erfenis Lindy nog niet verwerkt.</footer>
  `;
}

function hypotheekVindMaand(jaar,maand){ return HYPOTHEEK_MAANDEN.find(r=>r.y===jaar&&r.m===maand); }
function parseVermogenMaandLabel(label){
  // "september 2031" -> {jaar:2031, maand:9}; labels zonder maandnaam+jaartal (bv. "13e maand") geven null
  const m = label.match(/^([a-zëï]+)\s+(\d{4})$/i);
  if(!m) return null;
  const idx = MAAND_NAMEN_NL.findIndex(n=>n.toLowerCase()===m[1].toLowerCase());
  if(idx<0) return null;
  return {jaar: parseInt(m[2],10), maand: idx+1};
}
/* berekenBasisMetAflossing: gebruikt de delen die Rob handmatig heeft aangevinkt in de Hypotheek-tab
   (hypotheekGekozenDelen) — dus dit is precies hetzelfde scenario, niet een aparte aanname hier.
   Vanaf okt-2031 (eerste boetevrije moment): eenmalig het aflossingsbedrag (som van de gekozen
   delen op dat moment) eraf, daarna elke maand het echte verschil tussen normale en verlaagde
   netto hypotheeklast erbij (i.p.v. een vast bedrag). Vóór okt-2031 identiek aan basis. */
function berekenBasisMetAflossing(slice){
  const idx = slice.findIndex(r=>{
    const p = parseVermogenMaandLabel(r.m);
    return p && (p.jaar*12+p.maand)===HYPOTHEEK_RENTEVAST_EIND_TOTAAL_MND;
  });
  const result = slice.map(r=>r.basis);
  if(idx<0 || !hypotheekGekozenDelen.length) return result;
  const refP = parseVermogenMaandLabel(slice[idx].m);
  const refR = hypotheekVindMaand(refP.jaar, refP.maand);
  const payoff = refR ? hypotheekGekozenDelen.reduce((s,i)=> s + (refR.delen[i] ? refR.delen[i][0] : 0), 0) : 0;
  result[idx] = slice[idx].basis - payoff;
  let laatstBekendVoordeel = 0;

  document.querySelectorAll('[data-edit-reis]').forEach(el=>el.addEventListener('change',(e)=>{ e.stopPropagation(); setReisOverrideByKey(el.dataset.editReis, el.value); }));
  document.querySelectorAll('[data-edit-reis]').forEach(el=>el.addEventListener('click',(e)=>e.stopPropagation()));

  // ---- Meerjarenplanning: jaar/periode als dropdown, status = tik-om-te-plannen, budget tikken ----
  document.querySelectorAll('[data-promote-status]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const id = el.dataset.promoteStatus;
    setReisPlanOverride(id, {status: 'planning'});
    render();
  }));
  document.querySelectorAll('[data-demote-idee]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const id = el.dataset.demoteIdee;
    setReisPlanOverride(id, {status: 'idee'});
    reisTripExpand = null;
    render();
  }));
  document.querySelectorAll('[data-bevestig-afwikkeling]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const id = el.dataset.bevestigAfwikkeling;
    setReisPlanOverride(id, {afgewikkeld: true});
    render();
  }));
  document.querySelectorAll('[data-timing-select]').forEach(el=>{
    el.addEventListener('click',(e)=>e.stopPropagation());
    el.addEventListener('change',(e)=>{
      const id = el.dataset.timingSelect;
      const val = e.target.value;
      if(val==='anders'){
        reisTimingCustomFor = id;
        render();
        const input = document.querySelector('[data-timing-custom-input="'+CSS.escape(id)+'"]');
        if(input){ input.focus(); input.select(); }
      } else {
        setReisPlanOverride(id, {timing: val});
        reisTimingCustomFor = null;
        render();
      }
    });
  });
  document.querySelectorAll('[data-timing-custom-input]').forEach(el=>{
    el.addEventListener('click',(e)=>e.stopPropagation());
    el.addEventListener('keydown',(e)=>{ if(e.key==='Enter') e.target.blur(); });
    el.addEventListener('blur',(e)=>{
      const id = el.dataset.timingCustomInput;
      setReisPlanOverride(id, {timing: e.target.value.trim()});
      reisTimingCustomFor = null;
      render();
    });
  });
  document.querySelectorAll('[data-edit-budget-row]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    reisRowEditOpen = el.dataset.editBudgetRow + '|budget';
    render();
    const input = document.querySelector('[data-budget-row-input="'+CSS.escape(el.dataset.editBudgetRow)+'"]');
    if(input){ input.focus(); input.select(); }
  }));
  document.querySelectorAll('[data-budget-row-input]').forEach(el=>{
    el.addEventListener('click',(e)=>e.stopPropagation());
    el.addEventListener('keydown',(e)=>{ if(e.key==='Enter') e.target.blur(); });
    el.addEventListener('blur',(e)=>{
      const id = el.dataset.budgetRowInput;
      const waarde = parseFloat(e.target.value);
      if(!isNaN(waarde)) setReisBudgetOverride(id, waarde);
      reisRowEditOpen = null;
      render();
    });
  });
  document.querySelectorAll('[data-jaar-select]').forEach(el=>{
    el.addEventListener('click',(e)=>e.stopPropagation());
    el.addEventListener('change',(e)=>{
      const id = el.dataset.jaarSelect;
      const nieuwJaar = parseInt(e.target.value, 10);
      setReisPlanOverride(id, {jaar: nieuwJaar});
      render();
    });
  });
}

    try{
      const el = document.querySelector(sel);
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'start'});
    }catch(e){}

// --- Toegangsscherm (eenvoudige PIN-voordeur; data staat nog steeds in de broncode) ---
let lockPinEntry = '';
let lockAttempts = 0;
let lockLocked = false;
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function updateLockDots(){
  document.querySelectorAll('#lockDots .lock-dot').forEach((d,i)=>{
    d.classList.toggle('filled', i < lockPinEntry.length);
  });
}
async function tryUnlock(){
  const hash = await sha256Hex(lockPinEntry);
  if(hash === LOCK_PIN_HASH){
    localStorage.setItem('dashboard_unlocked','1');
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='';
    loadOverrides();
  } else {
    lockAttempts++;
    const dots = document.getElementById('lockDots');
    dots.classList.add('lock-shake');
    setTimeout(()=>dots.classList.remove('lock-shake'), 350);
    lockPinEntry = '';
    updateLockDots();
    const msg = document.getElementById('lockMsg');
    if(lockAttempts >= 5){
      lockLocked = true;
      let secs = 15;
      msg.textContent = 'Te vaak fout — even wachten (' + secs + 's)';
      const iv = setInterval(()=>{
        secs--;
        if(secs <= 0){
          clearInterval(iv);
          lockLocked = false;
          lockAttempts = 0;
          msg.textContent = '';
        } else {
          msg.textContent = 'Te vaak fout — even wachten (' + secs + 's)';
        }
      }, 1000);
    } else {
      msg.textContent = 'Onjuiste PIN';
      setTimeout(()=>{ if(!lockLocked) msg.textContent=''; }, 1200);
    }
  }
}
function initLock(){
  document.querySelectorAll('[data-lock-digit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(lockLocked) return;
      lockPinEntry += el.dataset.lockDigit;
      updateLockDots();
      if(lockPinEntry.length === 4){
        tryUnlock();
      }
    });
  });
  document.querySelector('[data-lock-backspace]').addEventListener('click', ()=>{
    if(lockLocked) return;
    lockPinEntry = lockPinEntry.slice(0,-1);
    updateLockDots();
  });
  if(localStorage.getItem('dashboard_unlocked')==='1'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='';
    loadOverrides();
  }
}
function lockOut(){
  localStorage.removeItem('dashboard_unlocked');
  location.reload();
}
initLock();
